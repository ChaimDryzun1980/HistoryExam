n-m04","concept":"circulation.vein","difficulty":1,"prompt":"מה מאפיין כל וריד לפי הגדרתו?","choices":["הוא מוביל דם לכיוון הלב","הוא מוביל דם רק מהריאות","הוא מכיל תמיד דם דל בחמצן","דופנו בנויה תמיד משכבת תאים אחת"],"answer":0,"explanation":"וריד מוגדר ככלי דם המוביל דם לכיוון הלב. רמת החמצן תלויה במסלול: ורידי הריאה מובילים דם עשיר בחמצן.","source":{"label":"חוברת מערכת ההובלה, פרק ב — כלי הדם; OpenStax, מבנה כלי הדם","url":"https://openstax.org/books/anatomy-and-physiology-2e/pages/20-1-structure-and-function-of-blood-vessels"}},{"id":"circulation-m05","concept":"circulation.capillary","difficulty":2,"prompt":"איזו התאמה של הנימים מסייעת במיוחד לחילוף חומרים בין הדם לרקמות?","choices":["דופן דקה הבנויה משכבת תאים אחת","דופן שרירית עבה מאוד","מסתמים בין כל שני תאים","חלל שמזרים דם ישירות מהלב"],"answer":0,"explanation":"דופן דקה מקצרת את מרחק המעבר של חומרים. החילוף מתרחש דרך דופן הנימים ונוזל הרקמה שסביב התאים.","source":{"label":"חוברת מערכת ההובלה, פרק ב — כלי הדם; OpenStax, מבנה כלי הדם","url":"https://openstax.org/books/anatomy-and-physiology-2e/pages/20-1-structure-and-function-of-blood-vessels"}},{"id":"circulation-m06","concept":"circulation.valves","difficulty":2,"prompt":"מה עלול לקרות אם מסתמים בוורידי הרגליים אינם נסגרים היטב?","choices":["חלק מהדם עלול לזרום לאחור","הדם יהפוך מיד לעשיר בחמצן","כל הוורידים יהפכו לעורקים","תאי הדם האדומים יאבדו את כל ההמוגלובין"],"answer":0,"explanation":"המסתמים בוורידים מסייעים למנוע זרימה לאחור, במיוחד כשהדם חוזר מהרגליים לכיוון הלב.","source":{"label":"חוברת מערכת ההובלה, פרק ב — כלי הדם; OpenStax, מבנה כלי הדם","url":"https://openstax.org/books/anatomy-and-physiology-2e/pages/20-1-structure-and-function-of-blood-vessels"}},{"id":"circulation-m07","concept":"circulation.leftwall","difficulty":2,"prompt":"מדוע דופן החדר השמאלי עבה מזו של החדר הימני?","choices":["עליו ליצור לחץ גבוה יותר כדי להזרים דם במחזור הגוף","הוא מזרים דם רק לעלייה השמאלית","הוא מכיל תמיד יותר דם מכל שאר חללי הלב יחד","הוא אחראי לייצור תאי הדם פקידי מערכת ההובלה.","source":{"label":"חוברת מערכת ההובלה, פרק א — הצורך במערכת ההובלה"},"stimulus":{"type":"text","title":"מזון ותנועה","text":"לאחר הארוחה נספגים חומרי מזון ממערכת העיכול. בהמשך הם זמינים גם לתאי השרירים ברגליים, המרוחקים ממערכת העיכול."}},{"id":"circulation-m29","concept":"circulation.musclepump","difficulty":2,"prompt":"כיצד התכווצות שרירי הרגליים מסייעת להחזרת הדם ללב?","choices":["השרירים לוחצים על הוורידים והמסתמים מסייעים למנוע זרימה לאחור","השרירים הופכים את הוורידים לנימים","השרירים מייצרים חמצן בתוך הוורידים","השרירים פותחים מעבר ישיר מהוורידים לחדר השמאלי"],"answer":0,"explanation":"לחץ השרירים על הוורידים מסייע לדחיפת הדם. מסתמים בוורידים מסייעים לכוון את הזרימה לעבר הלב.","source":{"label":"חוברת מערכת ההובלה, פרק ב — כלי הדם; OpenStax, מבנה כלי הדם","url":"https://openstax.org/books/anatomy-and-physiology-2e/pages/20-1-structure-and-function-of-blood-vessels"}},{"id":"circulation-m30","concept":"circulation.clot","difficulty":3,"prompt":"איזה תיאור של עצירת דימום מדויק ביותר?","choices":["טסיות יוצרות פקק, ותהליך הקרישה יוצר רשת חלבונית המחזקת אותו","תאי דם אדומים הופכים לסיבי שריר שסוגרים את הפצע","הפלזמה נעלמת וכלי הדם נשאר ריק","המוגלובין הופך למסתם קבוע במקום הפצע"],"answer":0,"explanation":"הטסיות מסייעות ליצור פקק באזור הפגיעה. בתהליך הקרישה נוצרת רשת סיבי פיברין המחזקת את הקריש ולוכדת בו תאים.","source":{"label":"חוברת מערכת ההובלה, פרק ו — טסיות; OpenStax, עצירת דימום","url":"https://openstax.org/books/anatomy-and-physiology-2e/pages/18-5-hemostasis"}}],"tf":[{"id":"circulation-t01","concept":"circulation.artery","difficulty":1,"prompt":"עורקים מובילים דם מן הלב אל מחוץ לו.","answer":true,"explanation":"כיוון הזרימה ביחס ללב הוא הבסיס להגדרת עורק.","source":{"label":"חוברת מערכת ההובלה, פרק ב — כלי הדם; OpenStax, מבנה כלי הדם","url":"https://openstax.org/books/anatomy-and-physiology-2e/pages/20-1-structure-and-function-of-blood-vessels"}},{"id":"circulation-t02","concept":"circulation.oxygenclassification","difficulty":2,"prompt":"כל עורק בגוף האדם מוביל דם עשיר בחמצן.","answer":false,"explanation":"עורק הריאה מוביל דם דל יחסית בחמצן מהלב לריאות. עורק מוגדר לפי כיוון הזרימה.","source":{"label":"חוברת מערכת ההובלה, פרק ד — מחזורי הדם; OpenStax, מסלולי הדם","url":"https://openstax.org/books/anatomy-and-physiology-2e/pages/20-5-circulatory-pathways"}},{"id":"circulation-t03","concept":"circulation.vein","difficulty":1,"prompt":"ורידים מובילים דם לכיוון הלב.","answer":true,"explanation":"ורידים מחזירים דם אל הלב; רמת החמצן בדם תלויה במסלול.","source":{"label":"חוברת מערכת ההובלה, פרק ב — כלי הדם; OpenStax, מבנה כלי הדם","url":"https://openstax.org/books/anatomy-and-physiology-2e/pages/20-1-structure-and-function-of-blood-vessels"}},{"id":"circulation-t04","concept":"circulation.capillary","difficulty":1,"prompt":"דופן הנים עבה יותר מדופן העורק.","answer":false,"explanation":"דופן הנים דקה במיוחד ובנויה משכבת תאים אחת, המאפשרת חילוף חומרים.","source":{"label":"חוברת מערכת ההובלה, פרק ב — כלי הדם; OpenStax, מבנה כלי הדם","url":"https://openstax.org/books/anatomy-and-physiology-2e/pages/20-1-structure-and-function-of-blood-vessels"}},{"id":"circulation-t05","concept":"circulation.valves","difficulty":2,"prompt":"בכל וריד בגוף האדם יש מסתמים.","answer":false,"explanation":"בוורידים רבים, ובמיוחד בוורידי הגפיים, יש מסתמים. הם אינם קיימים בכל הוורידים.","source":{"label":"חוברת מערכת ההובלה, פרק ב — כלי הדם; OpenStax, מבנה כלי הדם","url":"https://openstax.org/books/anatomy-and-physiology-2e/pages/20-1-structure-and-function-of-blood-vessels"}},{"id":"circulation-t06","concept":"circulation.septum","difficulty":1,"prompt":"המחיצה בלב תקין מונעת מעבר ישיר של דם בין הצד הימני לצד השמאלי.","answer":true,"explanation":"המחיצה מפרידה בין שני צדי הלב ומונעת ערבוב ישיר ביניהם.","source":{"label":"חוברת מערכת ההובלה, פרק ג — מבנה הלב; OpenStax, מבנה הלב","url":"https://openstax.org/books/anatomy-and-physiology-2e/pages/19-1-heart-anatomy"}},{"id":"circulation-t07","concept":"circulation.leftwall","difficulty":2,"prompt":"דופן החדר השמאלי עבה יותר מדופן החדר הימני.","answer":true,"explanation":"החדר השמאלי נדרש ליצור לחץ גבוה יותר כדי להזרים דם במחזור הגוף.","source":{"label":"חוברת מערכת ההובלה, פרק ג — מבנה הלב; OpenStax, מבנה הלב","url":"https://openstax.org/books/anatomy-and-physiology-2e/pages/19-1-heart-anatomy"}},{"id":"circulation-t08","concept":"circulation.chambers","difficulty":1,"prompt":"בלב האדם יש שתי עליות ושני חדרים.","answer":true,"explanation":"אלה ארבעת חללי הלב: עלייה וחדר בכל אחד משני הצדדים.","source":{"label":"חוברת מערכת ההובלה, פרק ג — מבנה הלב; OpenStax, מבנה הלב","url":"https://openstax.org/books/anatomy-and-physiology-2e/pages/19-1-heart-anatomy"}},{"id":"circulation-t09","concept":"circulation.rightventricle","difficulty":1,"prompt":"החדר הימני מזרים דם ישירות לאבי העורקים.","answer":false,"explanation":"החדר הימני מזרים דם לעורק הריאה; החדר השמאלי מזרים דם לאבי העורקים.","source":{"label":"חוברת מערכת ההובלה, פרק ד — מחזורי הדם; OpenStax, מסלולי הדם","url":"https://openstax.org/books/anatomy-and-physiology-2e/pages/20-5-circulatory-pathways"}},{"id":"circulation-t10","concept":"circulation.leftatrium","difficulty":2,"prompt":"העלייה השמאלית מקבלת דם מוורידי הריאה.","answer":true,"explanation":"זהו הדם שחזר מהריאות לאחר חילוף הגזים.","source":{"label":"חוברת מערכת ההובלה, פרק ד — מחזורי הדם; OpenStax, מסלולי הדם","url":"https://openstax.org/books/anatomy-and-physiology-2e/pages/20-5-circulatory-pathways"}},{"id":"circulation-t11","concept":"circulation.systemicpath","difficulty":2,"prompt":"המחזור הגדול מסתיים בחזרת הדם לעלייה השמאלית.","answer":false,"explanation":"המחזור הגדול מחזיר דם מאיברי הגוף לעלייה הימנית.","source":{"label":"חוברת מערכת ההובלה, פרק ד — מחזורי הדם; OpenStax, מסלולי הדם","url":"https://openstax.org/books/anatomy-and-physiology-2e/pages/20-5-circulatory-pathways"}},{"id":"circulation-t12","concept":"circulation.lungexchange","difficulty":1,"prompt":"בנימי הריאות עובר חמצן מהנאדיות אל הדם.","answer":true,"explanation":"חילוף הגזים בריאות מעשיר את הדם בחמצן ומאפשר פינוי פחמן דו־חמצני.","source":{"label":"חוברת מערכת ההובלה, פרק ד — מחזורי הדם; OpenStax, מסלולי הדם","url":"https://openstax.org/books/anatomy-and-physiology-2e/pages/20-5-circulatory-pathways"}},{"id":"circulation-t13","concept":"circulation.tissueexchange","difficulty":2,"prompt":"בנימי הגוף, פחמן דו־חמצני שנוצר בתאים עובר בדרך כלל מן הרקמה אל הדם.","answer":true,"explanation":"הדם אוסף פחמן דו־חמצני מהרקמות ומוביל אותו לריאות.","source":{"label":"חוברת מערכת ההובלה, פרק ד — מחזורי הדם; OpenStax, מסלולי הדם","url":"https://openstax.org/books/anatomy-and-physiology-2e/pages/20-5-circulatory-pathways"}},{"id":"circulation-t14","concept":"circulation.series","difficulty":3,"prompt":"טיפת דם העוברת בריאות יכולה להשלים את המסלול הרגיל לאיברי הגוף בלי לחזור תחילה ללב.","answer":false,"explanation":"הדם חוזר מהריאות לעלייה השמאלית, עובר לחדר השמאלי ורק אז מוזרם למחזור הגוף.","source":{"label":"חוברת מערכת ההובלה, פרק ד — מחזורי הדם; OpenStax, מסלולי הדם","url":"https://openstax.org/books/anatomy-and-physiology-2e/pages/20-5-circulatory-pathways"}},{"id":"circulation-t15","concept":"circulation.pulse","difficulty":1,"prompt":"את הדופק אפשר לחוש בעורק הנמצא קרוב לפני העור.","answer":true,"explanation":"גל הלחץ שמקורו בפעולת הלב מרחיב את דופן העורק באופן מחזורי.","source":{"label":"חוברת מערכת ההובלה, פרק ה — דופק וקצב הלב"}},{"id":"circulation-t16","concept":"circulation.exercise","difficulty":1,"prompt":"בעת מאמץ גופני, צורכי השרירים בחמצן פוחתים בדרך כלל.","answer":false,"explanation":"במאמץ השרירים פעילים יותר ובדרך כלל זקוקים ליותר חמצן וחומרי מזון להפקת אנרגיה.","source":{"label":"חוברת מערכת ההובלה, פרק ה — דופק וקצב הלב"}},{"id":"circulation-t17","concept":"circulation.plasma","difficulty":1,"prompt":"הפלזמה היא החלק הנוזלי של הדם.","answer":true,"explanation":"תאי הדם נישאים בתוך הפלזמה, ובה מומסים חומרים רבים.","source":{"label":"חוברת מערכת ההובלה, פרק ו — מרכיבי הדם"}},{"id":"circulation-t18","concept":"circulation.plasma","difficulty":1,"prompt":"המרכיב העיקרי בפלזמת הדם הוא מים.","answer":true,"explanation":"המים מאפשרים נשיאה של חומרים מומסים כגון מלחים, חומרי מזון וחומרי פסולת.","source":{"label":"חוברת מערכת ההובלה, פרק ו — מרכיבי הדם"}},{"id":"circulation-t19","concept":"circulation.rbc","difficulty":1,"prompt":"התפקיד המרכזי של תאי הדם האדומים הוא ייצור נוגדנים.","answer":false,"explanation":"תפקידם המרכזי הוא הובלת חמצן בעזרת המוגלובין. תאים מסוימים במערכת החיסון מייצרים נוגדנים.","source":{"label":"חוברת מערכת ההובלה, פרק ו — מרכיבי הדם"}},{"id":"circulation-t20","concept":"circulation.rbcadaptation","difficulty":2,"prompt":"לתא דם אדום בשל באדם אין גרעין.","answer":true,"explanation":"אובדן הגרעין במהלך ההבשלה מפנה מקום להמוגלובין בתא.","source":{"label":"חוברת מערכת ההובלה, פרק ו — תאי דם אדומים; OpenStax, תאי דם אדומים","url":"https://openstax.org/books/anatomy-and-physiology-2e/pages/18-3-erythrocytes"}},{"id":"circulation-t21","concept":"circulation.hemoglobin","difficulty":1,"prompt":"המוגלובין הוא חלבון המכיל ברזל.","answer":true,"explanation":"ההמוגלובין בתאי הדם האדומים מכיל ברזל ומשתתף בקשירת חמצן.","source":{"label":"חוברת מערכת ההובלה, פרק ו — תאי דם אדומים; OpenStax, תאי דם אדומים","url":"https://openstax.org/books/anatomy-and-physiology-2e/pages/18-3-erythrocytes"}},{"id":"circulation-t22","concept":"circulation.wbc","difficulty":1,"prompt":"תאי הדם הלבנים משתתפים בהגנת הגוף מפני גורמי מחלה.","answer":true,"explanation":"סוגים שונים של תאים לבנים ממלאים תפקידים שונים במערכת החיסון.","source":{"label":"חוברת מערכת ההובלה, פרק ו — מרכיבי הדם"}},{"id":"circulation-t23","concept":"circulation.platelets","difficulty":1,"prompt":"טסיות הדם הן שברי תאים המשתתפים בעצירת דימום.","answer":true,"explanation":"הן נצמדות באזור הפגיעה ומסייעות בתהליך יצירת הפקק והקריש.","source":{"label":"חוברת מערכת ההובלה, פרק ו — טסיות; OpenStax, עצירת דימום","url":"https://openstax.org/books/anatomy-and-physiology-2e/pages/18-5-hemostasis"}},{"id":"circulation-t24","concept":"circulation.platelets","difficulty":2,"prompt":"הובלת רוב החמצן בדם היא התפקיד המרכזי של הטסיות.","answer":false,"explanation":"הטסיות מסייעות בעצירת דימום. רוב החמצן בדם קשור להמוגלובין בתאים האדומים.","source":{"label":"חוברת מערכת ההובלה, פרק ו — מרכיבי הדם"}},{"id":"circulation-t25","concept":"circulation.need","difficulty":2,"prompt":"מערכת ההובלה הופכת את מעבר החומרים בדיפוזיה למיותר בכל הגוף.","answer":false,"explanation":"הובלת הדם מקרבת חומרים לרקמות, אך חילוף של חומרים רבים בין הדם לרקמות עדיין נעשה בדיפוזיה.","source":{"label":"חוברת מערכת ההובלה, פרק א — הצורך במערכת ההובלה"}},{"id":"circulation-t26","concept":"circulation.valvesheart","difficulty":2,"prompt":"מסתמי הלב מאפשרים לדם לזרום באופן חופשי לשני הכיוונים.","answer":false,"explanation":"מסתמי הלב מסייעים לשמור על זרימה בכיוון אחד ומונעים חזרה לאחור.","source":{"label":"חוברת מערכת ההובלה, פרק ג — מבנה הלב; OpenStax, מבנה הלב","url":"https://openstax.org/books/anatomy-and-physiology-2e/pages/19-1-heart-anatomy"}},{"id":"circulation-t27","concept":"circulation.waste","difficulty":1,"prompt":"מערכת ההובלה מסייעת גם בפינוי חומרי פסולת מן התאים.","answer":true,"explanation":"הדם מוביל חומרי פסולת לאיברים כגון הריאות והכליות, שמהם הם מסולקים.","source":{"label":"חוברת מערכת ההובלה, פרק א — הצורך במערכת ההובלה"}},{"id":"circulation-t28","concept":"circulation.tissueexchange","difficulty":2,"prompt":"תאי הדם האדומים חייבים לצאת מכלי הדם כדי להעביר חמצן לתאי הגוף.","answer":false,"explanation":"החמצן משתחרר מההמוגלובין ועובר דרך הפלזמה, דופן הנימים ונוזל הרקמה; התאים האדומים נשארים בכלי הדם במצב תקין.","source":{"label":"חוברת מערכת ההובלה, פרק ו — תאי דם אדומים; OpenStax, תאי דם אדומים","url":"https://openstax.org/books/anatomy-and-physiology-2e/pages/18-3-erythrocytes"}},{"id":"circulation-t29","concept":"circulation.valvesheart","difficulty":2,"prompt":"המסתמים שבין העליות לחדרים נשארים פתוחים בזמן התכווצות החדרים.","answer":false,"explanation":"המסתמים האלה נסגרים כאשר הלחץ בחדרים עולה, וכך מונעים חזרת דם לעליות.","source":{"label":"חוברת מערכת ההובלה, פרק ג — מבנה הלב; OpenStax, מבנה הלב","url":"https://openstax.org/books/anatomy-and-physiology-2e/pages/19-1-heart-anatomy"}},{"id":"circulation-t30","concept":"circulation.pulmonarypath","difficulty":2,"prompt":"דם עשיר בחמצן חוזר מהריאות ללב דרך עורק הריאה.","answer":false,"explanation":"הדם העשיר בחמצן חוזר מהריאות דרך ורידי הריאה. עורק הריאה מוביל דם מהלב לריאות.","source":{"label":"חוברת מערכת ההובלה, פרק ד — מחזורי הדם; OpenStax, מסלולי הדם","url":"https://openstax.org/books/anatomy-and-physiology-2e/pages/20-5-circulatory-pathways"}}],"cloze":[{"id":"circulation-c01","title":"מסע של דם דרך הלב והריאות","text":"דם החוזר מאיברי הגוף במחזור הגדול מגיע תחילה אל [[a]]. משם הוא עובר אל [[b]], שמזרים אותו דרך [[c]] אל [[d]], שבהן מתרחש חילוף גזים עם האוויר. הדם חוזר דרך [[e]] אל [[f]]. בהמשך הוא עובר אל [[g]], המזרים אותו אל [[h]], העורק הגדול שממנו מסתעפים עורקים לאיברי הגוף.","blanks":[{"key":"a","answer":"העלייה הימנית","concept":"circulation.rightatrium","explanation":"העלייה הימנית מקבלת דם החוזר מאיברי הגוף."},{"key":"b","answer":"החדר הימני","concept":"circulation.rightventricle","explanation":"החדר הימני מקבל דם מהעלייה הימנית ומזרים אותו לריאות."},{"key":"c","answer":"עורק הריאה","concept":"circulation.pulmonarypath","explanation":"עורק הריאה מוביל דם מהחדר הימני לריאות."},{"key":"d","answer":"הריאות","concept":"circulation.lungexchange","explanation":"בריאות מתרחש חילוף גזים בין הנאדיות לדם."},{"key":"e","answer":"ורידי הריאה","concept":"circulation.pulmonarypath","explanation":"ורידי הריאה מחזירים דם מהריאות ללב."},{"key":"f","answer":"העלייה השמאלית","concept":"circulation.leftatrium","explanation":"העלייה השמאלית מקבלת דם מוורידי הריאה."},{"key":"g","answer":"החדר השמאלי","concept":"circulation.leftwall","explanation":"החדר השמאלי מזרים דם למחזור הגוף."},{"key":"h","answer":"אבי העורקים","concept":"circulation.systemicpath","explanation":"אבי העורקים הוא העורק הגדול היוצא מהחדר השמאלי."}],"distractors":["ורידי הגוף","נימי הגוף","מחיצת הלב"],"source":{"label":"חוברת מערכת ההובלה, פרק ד — מחזורי הדם; OpenStax, מסלולי הדם","url":"https://openstax.org/books/anatomy-and-physiology-2e/pages/20-5-circulatory-pathways"}},{"id":"circulation-c02","title":"כלי הדם וחילוף החומרים","text":"כלי דם הנקראים [[a]] מובילים דם החוצה מן [[b]]. לעומתם, [[c]] מחזירים דם לכיוון המשאבה הזאת. ברבים מכלי הדם המחזירים דם, במיוחד בגפיים, יש [[d]] המונעים זרימה לאחור. חילוף החומרים עם הרקמות מתרחש בעיקר בכלי דם זעירים הנקראים [[e]]. דופנם בנויה משכבה אחת של [[f]], ולכן מרחק המעבר דרכה קצר. ברקמת שריר פעילה, [[g]] עובר בדרך כלל מן הדם אל הרקמה, ואילו [[h]], שנוצר בתהליך הפקת האנרגיה בתאים, עובר ממנה אל הדם.","blanks":[{"key":"a","answer":"עורקים","concept":"circulation.artery","explanation":"עורקים מוליכים דם מהלב החוצה."},{"key":"b","answer":"הלב","concept":"circulation.chambers","explanation":"הלב הוא המשאבה המזרימה את הדם."},{"key":"c","answer":"ורידים","concept":"circulation.vein","explanation":"ורידים מוליכים דם בחזרה לכיוון הלב."},{"key":"d","answer":"מסתמים","concept":"circulation.valves","explanation":"מסתמים בוורידים מסייעים במניעת זרימה לאחור."},{"key":"e","answer":"נימים","concept":"circulation.capillary","explanation":"בנימים מתרחש חילוף חומרים עם הרקמות."},{"key":"f","answer":"תאים","concept":"circulation.capillary","explanation":"דופן הנימים מורכבת משכבת תאים אחת."},{"key":"g","answer":"חמצן","concept":"circulation.tissueexchange","explanation":"תאי שריר פעילים קולטים חמצן מן הדם."},{"key":"h","answer":"פחמן דו־חמצני","concept":"circulation.waste","explanation":"פחמן דו־חמצני שנוצר בתאים עובר לדם לצורך פינויו."}],"distractors":["טסיות","גרעינים","המוגלובין"],"source":{"label":"חוברת מערכת ההובלה, פרק ב — כלי הדם; OpenStax, מבנה כלי הדם","url":"https://openstax.org/books/anatomy-and-physiology-2e/pages/20-1-structure-and-function-of-blood-vessels"}},{"id":"circulation-c03","title":"מה נמצא בתוך הדם","text":"החלק הנוזלי של הדם נקרא [[a]], והמרכיב העיקרי שלו הוא [[b]]. רוב החמצן בדם נישא באמצעות [[c]]. בתוך התאים האלה נמצא חלבון בשם [[d]], המכיל את היסוד [[e]] ויכול לקשור חמצן. [[f]] משתתפים בהגנת הגוף מפני גורמי מחלה. כאשר כלי דם נפגע, [[g]] נצמדות לאזור הפגיעה ומסייעות לעצירת הדימום. בתהליך הקרישה נוצרת רשת חלבונית המייצבת [[h]] באזור הפצע.","blanks":[{"key":"a","answer":"פלזמה","concept":"circulation.plasma","explanation":"פלזמה היא החלק הנוזלי של הדם."},{"key":"b","answer":"מים","concept":"circulation.plasma","explanation":"מים הם המרכיב העיקרי בפלזמה."},{"key":"c","answer":"תאי דם אדומים","concept":"circulation.rbc","explanation":"רוב החמצן בדם קשור להמוגלובין הנמצא בתאים האדומים."},{"key":"d","answer":"המוגלובין","concept":"circulation.hemoglobin","explanation":"המוגלובין הוא חלבון קושר חמצן."},{"key":"e","answer":"ברזל","concept":"circulation.hemoglobin","explanation":"ברזל הוא חלק ממבנה ההמוגלובין."},{"key":"f","answer":"תאי דם לבנים","concept":"circulation.wbc","explanation":"תאי דם לבנים משתתפים במערכת החיסון."},{"key":"g","answer":"טסיות","concept":"circulation.platelets","explanation":"טסיות נצמדות באזור פגיעה ומסייעות ביצירת פקק ובקרישה."},{"key":"h","answer":"קריש","concept":"circulation.clot","explanation":"הקריש מחוזק ברשת חלבונית ומסייע לסתום את הפגיעה בכלי הדם."}],"distractors":["חומרי מזון","מסתם","נימים"],"source":{"label":"חוברת מערכת ההובלה, פרק ו — מרכיבי הדם; OpenStax, עצירת דימום","url":"https://openstax.org/books/anatomy-and-physiology-2e/pages/18-5-hemostasis"}}],"open":[{"id":"circulation-o01","concept":"circulation.capillary","prompt":"הסבירו כיצד מבנה הנימים מותאם לחילוף חומרים בין הדם לתאי הגוף.","modelAnswer":"לנימים דופן דקה הבנויה משכבת תאים אחת. הדופן הדקה מקצרת את מרחק מעבר החומרים, והרשת הענפה מקרבת את הדם לרקמות. חומרים עוברים בין הדם לתאים דרך דופן הנימים ונוזל הרקמה.","keyPoints":["דופן דקה הבנויה משכבת תאים אחת","מרחק מעבר קצר ורשת נימים קרובה לרקמות","חילוף חומרים דרך הדופן ונוזל הרקמה"],"source":{"label":"חוברת מערכת ההובלה, פרק ב — כלי הדם; OpenStax, מבנה כלי הדם","url":"https://openstax.org/books/anatomy-and-physiology-2e/pages/20-1-structure-and-function-of-blood-vessels"}},{"id":"circulation-o02","concept":"circulation.oxygenclassification","prompt":"תלמיד טוען: ״עורק מכיל תמיד דם עשיר בחמצן, ווריד מכיל תמיד דם דל בחמצן״. הסבירו מה הטעות ותנו דוגמה.","modelAnswer":"עורק ווריד מוגדרים לפי כיוון הזרימה ביחס ללב. עורק מוציא דם מן הלב, ווריד מחזיר דם אליו. לדוגמה, עורק הריאה מוציא דם דל יחסית בחמצן אל הריאות, וורידי הריאה מחזירים דם עשיר בחמצן.","keyPoints":["ההגדרה מבוססת על כיוון הזרימה ביחס ללב","עורק הריאה מוביל דם דל יחסית בחמצן","ורידי הריאה מחזירים דם עשיר בחמצן"],"source":{"label":"חוברת מערכת ההובלה, פרק ד — מחזורי הדם; OpenStax, מסלולי הדם","url":"https://openstax.org/books/anatomy-and-physiology-2e/pages/20-5-circulatory-pathways"}},{"id":"circulation-o03","concept":"circulation.exercise","prompt":"הסבירו מדוע קצב הלב עולה בדרך כלל בזמן ריצה, וקשרו את ההסבר לצורכי תאי השריר.","modelAnswer":"בריצה השרירים מפיקים יותר אנרגיה ולכן זקוקים לאספקה מוגברת של חמצן וחומרי מזון. הם גם מייצרים יותר פחמן דו־חמצני שיש לפנות. עלייה בקצב הלב מסייעת להגדיל את הזרמת הדם ולענות על הצרכים האלה.","keyPoints":["צורך מוגבר בחמצן ובחומרי מזון","צורך בפינוי מוגבר של פחמן דו־חמצני","קצב לב גבוה יותר מסייע להגדיל את הזרמת הדם"],"source":{"label":"חוברת מערכת ההובלה, פרק ה — דופק וקצב הלב"}},{"id":"circulation-o04","concept":"circulation.leftwall","prompt":"השוו בין החדר הימני לחדר השמאלי: לאן כל אחד מזרים דם, ומדוע עובי הדופן שלהם שונה?","modelAnswer":"החדר הימני מזרים דם לריאות, והחדר השמאלי מזרים דם למחזור הגוף דרך אבי העורקים. ההתנגדות במחזור הגוף גדולה יותר, ולכן החדר השמאלי נדרש ליצור לחץ גבוה יותר. הדופן השרירית העבה שלו מותאמת לדרישה זו.","keyPoints":["חדר ימין מזרים לריאות וחדר שמאל למחזור הגוף","במחזור הגוף נדרש לחץ גבוה יותר","דופן חדר שמאל עבה יותר בהתאם לתפקידה"],"source":{"label":"חוברת מערכת ההובלה, פרק ג — מבנה הלב; OpenStax, מבנה הלב","url":"https://openstax.org/books/anatomy-and-physiology-2e/pages/19-1-heart-anatomy"}},{"id":"circulation-o05","concept":"circulation.components","prompt":"הסבירו כיצד הפלזמה, תאי הדם האדומים והטסיות תורמים לתפקידים שונים של הדם.","modelAnswer":"הפלזמה היא נוזל שבו נישאים תאי הדם וחומרים מומסים, כגון חומרי מזון ופסולת. תאי הדם האדומים מובילים חמצן בעזרת המוגלובין. הטסיות משתתפות בעצירת דימום באזור שבו כלי דם נפגע.","keyPoints":["פלזמה נושאת תאים וחומרים מומסים","תאים אדומים מובילים חמצן בעזרת המוגלובין","טסיות משתתפות בעצירת דימום"],"source":{"label":"חוברת מערכת ההובלה, פרק ו — מרכיבי הדם"}},{"id":"circulation-o06","concept":"circulation.series","prompt":"תארו בקיצור את הדרך שעובר דם מהחדר הימני עד שהוא חוזר לעלייה הימנית.","modelAnswer":"מהחדר הימני הדם זורם דרך עורק הריאה אל נימי הריאות, שם מתרחש חילוף גזים. הוא חוזר בוורידי הריאה לעלייה השמאלית ועובר לחדר השמאלי. משם הוא מוזרם באבי העורקים ובעורקי הגוף אל נימי הגוף, וחוזר דרך ורידי הגוף לעלייה הימנית.","keyPoints":["חדר ימין, עורק הריאה, נימי הריאות","ורידי הריאה, עלייה שמאלית, חדר שמאלי","אבי העורקים, נימי הגוף, ורידי הגוף, עלייה ימנית"],"source":{"label":"חוברת מערכת ההובלה, פרק ד — מחזורי הדם; OpenStax, מסלולי הדם","url":"https://openstax.org/books/anatomy-and-physiology-2e/pages/20-5-circulatory-pathways"}}]},{"topic":"periodic","mcq":[{"id":"periodic-m01","concept":"periodic.atomic-order","difficulty":1,"prompt":"לפי איזה גודל מסודרים היסודות בטבלה המחזורית המודרנית?","choices":["מספר אטומי עולה","מספר האותיות בשם היסוד","סדר אלפביתי של הסמלים","מסה של דגימה מהיסוד"],"answer":0,"explanation":"הסדר בטבלה המודרנית נקבע לפי מספר אטומי עולה. המספר האטומי הוא מספר הפרוטונים בגרעין.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 90–92; IUPAC — הטבלה המחזורית","url":"https://iupac.org/what-we-do/periodic-table-of-elements/"}},{"id":"periodic-m02","concept":"periodic.period","difficulty":1,"prompt":"מהו מחזור בטבלה המחזורית?","choices":["שורה אופקית","טור אנכי","רשימה של מתכות בלבד","קבוצה של יסודות בעלי אותו מספר אטומי"],"answer":0,"explanation":"מחזור הוא שורה אופקית בטבלה; לאורך השורה, משמאל לימין, המספר האטומי עולה.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 90–92; IUPAC — הטבלה המחזורית","url":"https://iupac.org/what-we-do/periodic-table-of-elements/"}},{"id":"periodic-m03","concept":"periodic.family-similarity","difficulty":1,"prompt":"מה מאפיין בדרך כלל יסודות השייכים לאותה משפחה כימית?","choices":["תכונות כימיות דומות","אותו מספר אטומי","אותו צבע בדיוק","אותו מספר פרוטונים"],"answer":0,"explanation":"בני משפחה כימית חולקים תכונות כימיות דומות. הם עדיין יסודות שונים, ולכן מספריהם האטומיים שונים.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 55–59, 62–63; מספור קבוצות מודרני: IUPAC","url":"https://iupac.org/what-we-do/periodic-table-of-elements/"}},{"id":"periodic-m04","concept":"periodic.period-vs-group","difficulty":2,"prompt":"נתרן וכלור נמצאים באותה שורה בטבלה. מה אפשר להסיק מכך בלבד?","choices":["הם באותו מחזור","הם מאותה משפחה כימית","שניהם מתכות","לשניהם אותו מספר אטומי"],"answer":0,"explanation":"שורה משותפת פירושה מחזור משותף. היא אינה מחייבת השתייכות לאותה משפחה או תכונות דומות.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 90–92; IUPAC — הטבלה המחזורית","url":"https://iupac.org/what-we-do/periodic-table-of-elements/"}},{"id":"periodic-m05","concept":"periodic.metal-location","difficulty":1,"prompt":"איזו קבוצת יסודות מהווה את רוב היסודות בטבלה המחזורית?","choices":["מתכות","גזים אצילים","הלוגנים","אל מתכות"],"answer":0,"explanation":"רוב היסודות הם מתכות. הן מצויות בעיקר בחלק השמאלי ובמרכז הטבלה.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 40, 44–45, 61–64"}},{"id":"periodic-m06","concept":"periodic.nonmetal-location","difficulty":1,"prompt":"היכן נמצאות רוב האל מתכות בטבלה המחזורית?","choices":["בחלק הימני, ומימן הוא חריג הנמצא משמאל","רק בשורה התחתונה","רק בשני הטורים השמאליים","רק במרכז הטבלה"],"answer":0,"explanation":"רוב האל מתכות נמצאות בחלק הימני. מימן הוא אל מתכת הנמצאת בראש הטור השמאלי.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 40, 44–45, 61–64"}},{"id":"periodic-m07","concept":"periodic.hydrogen-exception","difficulty":2,"prompt":"מה נכון לגבי המימן, הנמצא בקבוצה 1?","choices":["הוא אל מתכת ואינו מתכת אלקלית","הוא מתכת אלקלית כמו נתרן","הוא גז אציל כי הוא גז","הוא הלוגן כי הוא אל מתכת"],"answer":0,"explanation":"מיקומו של מימן בקבוצה 1 אינו הופך אותו למתכת אלקלית. מימן הוא אל מתכת בעלת תכונות שונות מהמתכות האלקליות.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 44, 55; RSC — מימן","url":"https://periodic-table.rsc.org/element/1/hydrogen"}},{"id":"periodic-m08","concept":"periodic.alkali-members","difficulty":1,"prompt":"איזו רשימה כוללת רק מתכות אלקליות?","choices":["ליתיום, נתרן ואשלגן","נתרן, כלור וארגון","מימן, חמצן וחנקן","ברזל, נחושת ואלומיניום"],"answer":0,"explanation":"ליתיום, נתרן ואשלגן שייכים למשפחת המתכות האלקליות שבקבוצה 1.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 55–59, 62–63; מספור קבוצות מודרני: IUPAC","url":"https://iupac.org/what-we-do/periodic-table-of-elements/"}},{"id":"periodic-m09","concept":"periodic.halogen-members","difficulty":1,"prompt":"איזו רשימה כוללת רק הלוגנים?","choices":["פלואור, כלור וברום","הליום, ניאון וארגון","ליתיום, נתרן ואשלגן","חמצן, ניאון ונתרן"],"answer":0,"explanation":"פלואור, כלור וברום הם הלוגנים, הנמצאים בקבוצה 17 במספור המודרני.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 55–59, 62–63; מספור קבוצות מודרני: IUPAC","url":"https://iupac.org/what-we-do/periodic-table-of-elements/"}},{"id":"periodic-m10","concept":"periodic.noble-members","difficulty":1,"prompt":"איזו רשימה כוללת רק גזים אצילים?","choices":["הליום, ניאון וארגון","מימן, חמצן וכלור","כלור, ברום ויוד","נתרן, ארגון ופחמן"],"answer":0,"explanation":"הליום, ניאון וארגון הם גזים אצילים, ממשפחה המתאפיינת בפעילות כימית נמוכה.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 55–59, 62–63; מספור קבוצות מודרני: IUPAC","url":"https://iupac.org/what-we-do/periodic-table-of-elements/"}},{"id":"periodic-m11","concept":"periodic.group-numbering","difficulty":2,"prompt":"בספר הלימוד משפחת ההלוגנים נקראת הטור הראשי השביעי. מה מספרה בשיטת 18 הקבוצות המודרנית?","choices":["17","7","18","1"],"answer":0,"explanation":"הטור הראשי השביעי בספר מתאים לקבוצה 17 במספור המודרני. הטור הראשי השמיני מתאים לקבוצה 18.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 55–59, 62–63; מספור קבוצות מודרני: IUPAC","url":"https://iupac.org/what-we-do/periodic-table-of-elements/"}},{"id":"periodic-m12","concept":"periodic.alkali-position","difficulty":2,"prompt":"איזה תיאור מזהה נכון את משפחת המתכות האלקליות?","choices":["יסודות קבוצה 1 מלבד מימן","כל היסודות שהם גזים","כל היסודות בחלק הימני של הטבלה","כל יסודות השורה הראשונה"],"answer":0,"explanation":"המתכות האלקליות מצויות בקבוצה 1, אך מימן שבראש הקבוצה אינו שייך למשפחה זו.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 55–59, 62–63; מספור קבוצות מודרני: IUPAC","url":"https://iupac.org/what-we-do/periodic-table-of-elements/"}},{"id":"periodic-m13","concept":"periodic.metal-properties","difficulty":1,"prompt":"איזה צירוף תכונות אופייני למתכות?","choices":["הולכת חשמל וחום ואפשרות לריקוע","בידוד חשמלי והיעדר ברק תמיד","מצב צבירה גזי בטמפרטורת החדר","שבירות וחוסר אפשרות לעיבוד בכל המקרים"],"answer":0,"explanation":"מתכות מוליכות חשמל וחום, ובדרך כלל ניתן לרקע ולעבד אותן. יש שונות בין המתכות ולכן חשוב להימנע מהכללות מוחלטות.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 40, 44–45, 61–64"}},{"id":"periodic-m14","concept":"periodic.mercury-exception","difficulty":2,"prompt":"כספית היא מתכת הנמצאת במצב נוזלי בטמפרטורת החדר. איזו מסקנה נכונה?","choices":["מצב מוצק אינו תנאי הכרחי להיותו של יסוד מתכת","כספית אינה יכולה להוליך חשמל","כל המתכות נוזליות","כל נוזל הוא מתכת"],"answer":0,"explanation":"רוב המתכות מוצקות בטמפרטורת החדר, אך כספית היא חריג. סיווג מתכת אינו נשען על מצב הצבירה בלבד.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 93; RSC — כספית","url":"https://periodic-table.rsc.org/element/80/mercury"}},{"id":"periodic-m15","concept":"periodic.graphite-exception","difficulty":2,"prompt":"גרפיט הוא צורה של פחמן, אל מתכת המוליכה חשמל. מה הוא מדגים?","choices":["יש חריגים לכלל שלפיו אל מתכות אינן מוליכות חשמל היטב","כל מוליך חשמל הוא בהכרח מתכת","כל האל מתכות מוליכות חשמל היטב","פחמן חייב להשתייך למתכות האלקליות"],"answer":0,"explanation":"גרפיט הוא דוגמה חשובה לכך שמוליכות חשמלית לבדה אינה מספיקה כדי לקבוע שיסוד הוא מתכת.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 40, 64; RSC — פחמן","url":"https://periodic-table.rsc.org/element/6/carbon"}},{"id":"periodic-m16","concept":"periodic.malleability","difficulty":1,"prompt":"מה פירוש התכונה ריקוע?","choices":["יכולת לעצב חומר ולשטח אותו בלי שיתפורר","יכולת להימשך לכל מגנט","יכולת להפוך לגז ללא חימום","יכולת להאיר בחושך"],"answer":0,"explanation":"ריקוע הוא עיצוב ושיטוח של חומר, למשל ליריעה. תכונה זו מאפשרת שימוש במתכות לייצור מוצרים בעלי צורות שונות.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 40, 44–45, 61–64"}},{"id":"periodic-m17","concept":"periodic.electrical-use","difficulty":2,"prompt":"מדוע נחושת מתאימה לשמש ליבה של חוט חשמל?","choices":["היא מוליכה חשמל היטב","היא מבודדת חשמל","היא גז בטמפרטורת החדר","היא אינה מאפשרת מעבר מטענים"],"answer":0,"explanation":"נחושת מתאימה להולכת זרם חשמלי. הציפוי המבודד של החוט ממלא תפקיד אחר: להפריד בין המוליך לסביבתו.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 40, 93–94"}},{"id":"periodic-m18","concept":"periodic.thermal-use","difficulty":2,"prompt":"מדוע גוף הסיר וידית האחיזה מיוצרים לעיתים מחומרים שונים?","choices":["גוף הסיר צריך להעביר חום היטב, ובידית רצוי לצמצם העברת חום","גוף הסיר צריך לבודד חום, והידית צריכה להוליך אותו במהירות","שני החלקים חייבים להיות מגזים אצילים","אין קשר בין תכונות החומר לתפקיד החלק"],"answer":0,"explanation":"החומר נבחר לפי התפקיד. מתכת מסייעת להעביר חום אל המזון, וחומר מבודד יחסית מסייע להפחית את התחממות ידית האחיזה.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 40, 44–45, 61–64"},"stimulus":{"type":"text","title":"בחירת חומרים למוצר","text":"מעצבת מתכננת סיר. חשוב לה שהמזון יתחמם ושאפשר יהיה לאחוז בידית בנוחות. היא בוחנת מתכת וחומר המוליך חום בצורה גרועה."}},{"id":"periodic-m19","concept":"periodic.noble-reactivity","difficulty":2,"prompt":"איזו תכונה מסבירה את הבחירה המתוארת בקטע?","choices":["הפעילות הכימית הנמוכה של ארגון","השתייכות ארגון למתכות","יכולתו של ארגון להגיב בקלות עם חוט הלהט","היותו של ארגון הלוגן"],"answer":0,"explanation":"ארגון הוא גז אציל. פעילותו הכימית הנמוכה מאפשרת להשתמש בו בסביבה שבה רצוי לצמצם תגובות עם חומר אחר.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 55–59, 62–63; מספור קבוצות מודרני: IUPAC","url":"https://iupac.org/what-we-do/periodic-table-of-elements/"},"stimulus":{"type":"text","title":"גז בתוך נורת להט","text":"בנורות להט מסוימות ממלאים את החלל בארגון כדי לצמצם תגובות כימיות של חוט הלהט החם עם הגז שסביבו."}},{"id":"periodic-m20","concept":"periodic.alkali-properties","difficulty":2,"prompt":"איזה מאפיין מתאים לנתרן ולאשלגן?","choices":["שניהם מתכות אלקליות המגיבות עם מים","שניהם גזים אצילים בעלי פעילות כימית נמוכה","שניהם הלוגנים שאינם מוליכים חשמל","שניהם אל מתכות במצב גזי בטמפרטורת החדר"],"answer":0,"explanation":"נתרן ואשלגן הם מתכות אלקליות. תגובתיות עם מים היא אחת התכונות הנלמדות של משפחה זו.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 55–59, 62–63; מספור קבוצות מודרני: IUPAC","url":"https://iupac.org/what-we-do/periodic-table-of-elements/"}},{"id":"periodic-m21","concept":"periodic.nonmetal-states","difficulty":2,"prompt":"מה הנתונים מלמדים על האל מתכות במשפחת ההלוגנים?","choices":["בני אותה משפחה יכולים להימצא במצבי צבירה שונים","כל הלוגן חייב להיות גז בטמפרטורת החדר","ברום הוא מתכת מפני שהוא נוזל","יוד הוא מתכת מפני שהוא מוצק"],"answer":0,"explanation":"כלור, ברום ויוד שייכים לאותה משפחה, אך בטמפרטורת החדר הם במצבי צבירה שונים. השתייכות למשפחה אינה מחייבת מצב צבירה זהה.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 55–59, 62–63; מספור קבוצות מודרני: IUPAC","url":"https://iupac.org/what-we-do/periodic-table-of-elements/"},"stimulus":{"type":"table","title":"מצבי צבירה בטמפרטורת החדר — נתונים על יסודות","headers":["יסוד","משפחה","מצב צבירה"],"rows":[["כלור","הלוגנים","גז"],["ברום","הלוגנים","נוזל"],["יוד","הלוגנים","מוצק"]]}},{"id":"periodic-m22","concept":"periodic.atomic-order","difficulty":2,"prompt":"בטבלה המלאה, איזה יסוד יופיע מיד אחרי נתרן בשורה זו?","choices":["מגנזיום","ניאון","אלומיניום","אשלגן"],"answer":0,"explanation":"המספר האטומי של נתרן הוא 11, ואחריו מופיע מגנזיום שמספרו האטומי 12. הסדר נקבע לפי המספר האטומי.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 90–92; IUPAC — הטבלה המחזורית","url":"https://iupac.org/what-we-do/periodic-table-of-elements/"},"stimulus":{"type":"periodic","title":"נתונים נבחרים מהטבלה המחזורית","cells":[{"symbol":"Na","name":"נתרן","number":11,"group":1,"period":3},{"symbol":"Mg","name":"מגנזיום","number":12,"group":2,"period":3},{"symbol":"Al","name":"אלומיניום","number":13,"group":13,"period":3}],"caption":"מספרי הקבוצות מוצגים במספור המודרני 1–18. זו תצוגה חלקית של הטבלה."}},{"id":"periodic-m23","concept":"periodic.family-similarity","difficulty":2,"prompt":"לפי הנתונים, לאיזה יסוד צפויות להיות תכונות כימיות הדומות יותר לאלו של נתרן?","choices":["ליתיום","כלור","ארגון","מגנזיום"],"answer":0,"explanation":"ליתיום ונתרן נמצאים באותה קבוצה ושייכים למשפחת המתכות האלקליות. קבוצה משותפת מסייעת לחזות דמיון בתכונות הכימיות.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 55–59, 62–63; מספור קבוצות מודרני: IUPAC","url":"https://iupac.org/what-we-do/periodic-table-of-elements/"},"stimulus":{"type":"periodic","title":"נתונים נבחרים מהטבלה המחזורית","cells":[{"symbol":"Li","name":"ליתיום","number":3,"group":1,"period":2},{"symbol":"Na","name":"נתרן","number":11,"group":1,"period":3},{"symbol":"Mg","name":"מגנזיום","number":12,"group":2,"period":3},{"symbol":"Cl","name":"כלור","number":17,"group":17,"period":3},{"symbol":"Ar","name":"ארגון","number":18,"group":18,"period":3}],"caption":"מספרי הקבוצות מוצגים במספור המודרני 1–18. זו תצוגה חלקית של הטבלה."}},{"id":"periodic-m24","concept":"periodic.period-vs-group","difficulty":2,"prompt":"איזה זוג מהיסודות המוצגים נמצא באותו מחזור אך בקבוצות שונות?","choices":["מגנזיום וכלור","ליתיום ונתרן","הליום וניאון","ליתיום ואשלגן"],"answer":0,"explanation":"מגנזיום וכלור נמצאים במחזור 3, בקבוצות 2 ו־17 בהתאמה. שאר הזוגות ברשימה נמצאים באותה קבוצה ובמחזורים שונים.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 90–92; IUPAC — הטבלה המחזורית","url":"https://iupac.org/what-we-do/periodic-table-of-elements/"},"stimulus":{"type":"periodic","title":"נתונים נבחרים מהטבלה המחזורית","cells":[{"symbol":"Li","name":"ליתיום","number":3,"group":1,"period":2},{"symbol":"Na","name":"נתרן","number":11,"group":1,"period":3},{"symbol":"K","name":"אשלגן","number":19,"group":1,"period":4},{"symbol":"Mg","name":"מגנזיום","number":12,"group":2,"period":3},{"symbol":"Cl","name":"כלור","number":17,"group":17,"period":3},{"symbol":"He","name":"הליום","number":2,"group":18,"period":1},{"symbol":"Ne","name":"ניאון","number":10,"group":18,"period":2}],"caption":"מספרי הקבוצות מוצגים במספור המודרני 1–18. זו תצוגה חלקית של הטבלה."}},{"id":"periodic-m25","concept":"periodic.evidence-classification","difficulty":3,"prompt":"איזה יסוד מתאים ביותר לתיאור של מתכת טיפוסית על סמך מכלול הבדיקות?","choices":["יסוד א","יסוד ב","יסוד ג","יסוד ד"],"answer":0,"explanation":"ליסוד א כמה תכונות אופייניות למתכות יחד: הולכת חשמל, ברק ויכולת ריקוע. עדיף להסתמך על מכלול תכונות ולא על תכונה יחידה.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 40, 44–45, 61–64"},"stimulus":{"type":"table","title":"דוגמה לימודית עם נתונים בדויים על ארבעה יסודות","headers":["יסוד","מוליכות חשמל","מראה","במכה קלה"],"rows":[["א","טובה","מבריק","משנה צורה בלי להתפורר"],["ב","גרועה","עמום","מתפורר"],["ג","גרועה","חסר צבע","גז; הבדיקה אינה מתאימה"],["ד","טובה","עמום","מתפורר"]]}},{"id":"periodic-m26","concept":"periodic.property-to-use","difficulty":3,"prompt":"איזה חומר מתאים ביותר ליריעה דקה שצריכה גם להוליך חשמל?","choices":["חומר ב","חומר א","חומר ג","חומר ד"],"answer":0,"explanation":"צריך לקיים את שתי הדרישות יחד: הולכת חשמל ויכולת ריקוע. רק חומר ב מתאים לשתיהן לפי הנתונים.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 40, 44–45, 61–64"},"stimulus":{"type":"table","title":"דוגמה לימודית עם תוצאות בדיקה בדויות","headers":["חומר","מוליך חשמל","ניתן לריקוע"],"rows":[["א","כן","לא"],["ב","כן","כן"],["ג","לא","כן"],["ד","לא","לא"]]}},{"id":"periodic-m27","concept":"periodic.magnetic-generalization","difficulty":3,"prompt":"איזו מסקנה מוצדקת מהתצפיות המתוארות?","choices":["משיכה למגנט אינה תכונה של כל המתכות","כל מתכת נמשכת למגנט","נחושת אינה מתכת","אלומיניום הוא גז אציל"],"answer":0,"explanation":"יש מתכות, כגון ברזל, שנמשכות היטב למגנט רגיל, ולעומתן נחושת ואלומיניום אינן נמשכות אליו באופן מורגש בבדיקה זו. לכן לא מזהים את כל המתכות לפי משיכה למגנט.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 40, 44–45, 61–64"},"stimulus":{"type":"text","title":"מיון לפי תצפיות","text":"בבדיקה בכיתה מסמר ברזל נמשך למגנט רגיל, ואילו פסי נחושת ואלומיניום לא נמשכו אליו באופן מורגש. שלושת החומרים מוכרים כמתכות."}},{"id":"periodic-m28","concept":"periodic.halogen-position","difficulty":2,"prompt":"יסוד לא מוכר לתלמיד נמצא בקבוצה 17 בטבלה המודרנית. מה אפשר לקבוע לפי המיקום?","choices":["הוא שייך למשפחת ההלוגנים","הוא שייך למשפחת המתכות האלקליות","הוא שייך למשפחת הגזים האצילים","הוא חייב להיות גז בטמפרטורת החדר"],"answer":0,"explanation":"קבוצה 17 היא משפחת ההלוגנים. המיקום במשפחה אינו אומר שכל חבריה נמצאים באותו מצב צבירה.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 55–59, 62–63; מספור קבוצות מודרני: IUPAC","url":"https://iupac.org/what-we-do/periodic-table-of-elements/"}},{"id":"periodic-m29","concept":"periodic.symbols","difficulty":1,"prompt":"איזה סימול כתוב בצורה התקינה של סמל היסוד נתרן?","choices":["Na","NA","na","nA"],"answer":0,"explanation":"בסמל כימי המורכב משתי אותיות, הראשונה גדולה והשנייה קטנה. הסמל של נתרן הוא Na.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 55–59, 62–63; מספור קבוצות מודרני: IUPAC","url":"https://iupac.org/what-we-do/periodic-table-of-elements/"}},{"id":"periodic-m30","concept":"periodic.noble-application","difficulty":3,"prompt":"מדוע הליום מתאים יותר ממימן לבלון כאשר רוצים להפחית סכנת התלקחות?","choices":["הליום הוא גז אציל בעל פעילות כימית נמוכה ואינו דליק","הליום הוא מתכת מוצקה","כל גז קל אינו דליק","מימן שייך למשפחת הגזים האצילים"],"answer":0,"explanation":"הליום הוא גז אציל ואינו דליק. מימן הוא אל מתכת גזית, אך הוא אינו גז אציל והוא דליק. היות חומר גז אינו מעיד על היותו אציל.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 55–59, 62–63; מספור קבוצות מודרני: IUPAC","url":"https://iupac.org/what-we-do/periodic-table-of-elements/"},"stimulus":{"type":"text","title":"שני גזים לבלונים","text":"הליום ומימן הם גזים קלים מהאוויר. בבחירת גז לבלון, חשוב להביא בחשבון גם את האפשרות שלו להשתתף בבעירה, ולא רק את צפיפותו."}}],"tf":[{"id":"periodic-t01","concept":"periodic.atomic-order","difficulty":1,"prompt":"בטבלה המחזורית המודרנית היסודות מסודרים לפי מספר אטומי עולה.","answer":true,"explanation":"המספר האטומי, מספר הפרוטונים בגרעין, קובע את סדר היסודות בטבלה.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 90–92; IUPAC — הטבלה המחזורית","url":"https://iupac.org/what-we-do/periodic-table-of-elements/"}},{"id":"periodic-t02","concept":"periodic.period","difficulty":1,"prompt":"מחזור בטבלה המחזורית הוא טור אנכי.","answer":false,"explanation":"מחזור הוא שורה אופקית; טור אנכי נקרא קבוצה.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 90–92; IUPAC — הטבלה המחזורית","url":"https://iupac.org/what-we-do/periodic-table-of-elements/"}},{"id":"periodic-t03","concept":"periodic.family-similarity","difficulty":1,"prompt":"ליסודות באותה משפחה כימית יש בדרך כלל תכונות כימיות דומות.","answer":true,"explanation":"הדמיון בתכונות הכימיות הוא מאפיין מרכזי של המשפחות הכימיות.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 55–59, 62–63; מספור קבוצות מודרני: IUPAC","url":"https://iupac.org/what-we-do/periodic-table-of-elements/"}},{"id":"periodic-t04","concept":"periodic.period-vs-group","difficulty":2,"prompt":"כל שני יסודות באותה שורה שייכים לאותה משפחה כימית.","answer":false,"explanation":"שורה היא מחזור וכוללת יסודות מקבוצות שונות. משפחה כימית מזוהה עם קבוצה, כלומר טור.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 90–92; IUPAC — הטבלה המחזורית","url":"https://iupac.org/what-we-do/periodic-table-of-elements/"}},{"id":"periodic-t05","concept":"periodic.metal-location","difficulty":1,"prompt":"רוב היסודות בטבלה המחזורית הם מתכות.","answer":true,"explanation":"המתכות מהוות את רוב היסודות ומצויות בעיקר בחלק השמאלי ובמרכז הטבלה.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 40, 44–45, 61–64"}},{"id":"periodic-t06","concept":"periodic.nonmetal-location","difficulty":2,"prompt":"כל האל מתכות נמצאות בצד הימני של הטבלה.","answer":false,"explanation":"רוב האל מתכות נמצאות בצד הימני, אך מימן הוא חריג הנמצא בצד השמאלי.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 44, 55; RSC — מימן","url":"https://periodic-table.rsc.org/element/1/hydrogen"}},{"id":"periodic-t07","concept":"periodic.hydrogen-exception","difficulty":1,"prompt":"מימן הוא אל מתכת.","answer":true,"explanation":"מימן הוא אל מתכת גם כאשר מציגים אותו בראש קבוצה 1.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 44, 55; RSC — מימן","url":"https://periodic-table.rsc.org/element/1/hydrogen"}},{"id":"periodic-t08","concept":"periodic.alkali-position","difficulty":2,"prompt":"מימן שייך למשפחת המתכות האלקליות מפני שהוא בקבוצה 1.","answer":false,"explanation":"מימן אינו מתכת אלקלית. בקבוצה 1 הוא חריג ביחס למתכות האלקליות שמתחתיו.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 44, 55; RSC — מימן","url":"https://periodic-table.rsc.org/element/1/hydrogen"}},{"id":"periodic-t09","concept":"periodic.alkali-members","difficulty":1,"prompt":"נתרן ואשלגן שייכים לאותה משפחה כימית.","answer":true,"explanation":"שניהם מתכות אלקליות בקבוצה 1.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 55–59, 62–63; מספור קבוצות מודרני: IUPAC","url":"https://iupac.org/what-we-do/periodic-table-of-elements/"}},{"id":"periodic-t10","concept":"periodic.halogen-members","difficulty":1,"prompt":"כלור הוא גז אציל.","answer":false,"explanation":"כלור הוא הלוגן. גזים אצילים כוללים למשל הליום, ניאון וארגון.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 55–59, 62–63; מספור קבוצות מודרני: IUPAC","url":"https://iupac.org/what-we-do/periodic-table-of-elements/"}},{"id":"periodic-t11","concept":"periodic.group-numbering","difficulty":1,"prompt":"ההלוגנים נמצאים בקבוצה 17 במספור המודרני.","answer":true,"explanation":"קבוצה 17 מתאימה לטור הראשי השביעי במספור המשמש בספר הלימוד.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 55–59, 62–63; מספור קבוצות מודרני: IUPAC","url":"https://iupac.org/what-we-do/periodic-table-of-elements/"}},{"id":"periodic-t12","concept":"periodic.group-numbering","difficulty":2,"prompt":"הטור הראשי השמיני בספר הוא קבוצה 8 במספור המודרני של 18 קבוצות.","answer":false,"explanation":"הטור הראשי השמיני בספר, משפחת הגזים האצילים, הוא קבוצה 18 במספור המודרני.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 55–59, 62–63; מספור קבוצות מודרני: IUPAC","url":"https://iupac.org/what-we-do/periodic-table-of-elements/"}},{"id":"periodic-t13","concept":"periodic.noble-reactivity","difficulty":1,"prompt":"הגזים האצילים מתאפיינים בפעילות כימית נמוכה.","answer":true,"explanation":"הם אינם נוטים להגיב בקלות בתנאים רגילים. עדיף ניסוח זה על טענה מוחלטת שלפיה לעולם אינם מגיבים.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 55–59, 62–63; מספור קבוצות מודרני: IUPAC","url":"https://iupac.org/what-we-do/periodic-table-of-elements/"}},{"id":"periodic-t14","concept":"periodic.noble-members","difficulty":2,"prompt":"כל יסוד שנמצא במצב גזי בטמפרטורת החדר הוא גז אציל.","answer":false,"explanation":"גם מימן, חמצן וכלור הם גזים בטמפרטורת החדר, אך אינם גזים אצילים.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 55–59, 62–63; מספור קבוצות מודרני: IUPAC","url":"https://iupac.org/what-we-do/periodic-table-of-elements/"}},{"id":"periodic-t15","concept":"periodic.halogen-states","difficulty":2,"prompt":"כלור וברום יכולים להשתייך לאותה משפחה גם כשמצבי הצבירה שלהם שונים.","answer":true,"explanation":"כלור גזי וברום נוזלי בטמפרטורת החדר, ושניהם הלוגנים.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 55–59, 62–63; מספור קבוצות מודרני: IUPAC","url":"https://iupac.org/what-we-do/periodic-table-of-elements/"}},{"id":"periodic-t16","concept":"periodic.halogen-states","difficulty":1,"prompt":"כל ההלוגנים הנלמדים הם גזים בטמפרטורת החדר.","answer":false,"explanation":"ברום הוא נוזל ויוד הוא מוצק בטמפרטורת החדר; גם הם הלוגנים.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 55–59, 62–63; מספור קבוצות מודרני: IUPAC","url":"https://iupac.org/what-we-do/periodic-table-of-elements/"}},{"id":"periodic-t17","concept":"periodic.mercury-exception","difficulty":1,"prompt":"כספית היא מתכת נוזלית בטמפרטורת החדר.","answer":true,"explanation":"כספית היא חריג חשוב לכלל שרוב המתכות מוצקות בטמפרטורת החדר.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 93; RSC — כספית","url":"https://periodic-table.rsc.org/element/80/mercury"}},{"id":"periodic-t18","concept":"periodic.metal-properties","difficulty":2,"prompt":"מצב מוצק בטמפרטורת החדר מוכיח שיסוד הוא מתכת.","answer":false,"explanation":"יש אל מתכות מוצקות, כגון פחמן וגפרית. צריך לבחון מכלול תכונות.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 40, 44–45, 61–64"}},{"id":"periodic-t19","concept":"periodic.graphite-exception","difficulty":2,"prompt":"גרפיט מוליך חשמל אף שפחמן מסווג כאל מתכת.","answer":true,"explanation":"גרפיט מדגים חריג לכלל שאל מתכות מוליכות חשמל בצורה גרועה.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 40, 64; RSC — פחמן","url":"https://periodic-table.rsc.org/element/6/carbon"}},{"id":"periodic-t20","concept":"periodic.graphite-exception","difficulty":2,"prompt":"כל יסוד שמוליך חשמל הוא בהכרח מתכת.","answer":false,"explanation":"גרפיט הוא צורה של פחמן, אל מתכת, והוא מוליך חשמל.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 40, 64; RSC — פחמן","url":"https://periodic-table.rsc.org/element/6/carbon"}},{"id":"periodic-t21","concept":"periodic.malleability","difficulty":1,"prompt":"ריקוע מאפשר ליצור יריעות דקות מחומר מתאים.","answer":true,"explanation":"ניתן לשטח ולעצב מתכות מתאימות ליריעות בלי שיתפוררו.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 40, 44–45, 61–64"}},{"id":"periodic-t22","concept":"periodic.malleability","difficulty":1,"prompt":"ריקוע פירושו משיכה של חומר למגנט.","answer":false,"explanation":"ריקוע הוא עיצוב ושיטוח של חומר. משיכה למגנט היא תכונה אחרת.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 40, 44–45, 61–64"}},{"id":"periodic-t23","concept":"periodic.electrical-use","difficulty":1,"prompt":"מוליכות חשמלית היא תכונה חשובה בבחירת מתכת לחוט חשמל.","answer":true,"explanation":"החלק המוליך בחוט נועד להעביר זרם, ולכן בוחרים חומר המוליך חשמל היטב.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 40, 93–94"}},{"id":"periodic-t24","concept":"periodic.thermal-use","difficulty":2,"prompt":"ידית המוליכה חום במהירות תמיד עדיפה לאחיזה בסיר חם.","answer":false,"explanation":"לאחיזה בסיר חם מעדיפים בדרך כלל ידית המוליכה חום בצורה גרועה יחסית, כדי לצמצם התחממות שלה.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 40, 44–45, 61–64"}},{"id":"periodic-t25","concept":"periodic.property-to-use","difficulty":2,"prompt":"בבחירת חומר למוצר יש להתאים בין תכונות החומר לתפקיד המוצר.","answer":true,"explanation":"למשל, הולכת חום מתאימה לגוף סיר, והולכת חשמל מתאימה לליבה של חוט חשמל.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 40, 44–45, 61–64"}},{"id":"periodic-t26","concept":"periodic.magnetic-generalization","difficulty":2,"prompt":"כל המתכות נמשכות באופן מורגש למגנט רגיל.","answer":false,"explanation":"נחושת ואלומיניום הן מתכות שאינן נמשכות באופן מורגש למגנט רגיל בבדיקה כיתתית.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 40, 44–45, 61–64"}},{"id":"periodic-t27","concept":"periodic.symbols","difficulty":1,"prompt":"בסמל Na האות הראשונה גדולה והשנייה קטנה.","answer":true,"explanation":"כך נכתב סמל כימי המורכב משתי אותיות: אות גדולה ולאחריה אות קטנה.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 55–59, 62–63; מספור קבוצות מודרני: IUPAC","url":"https://iupac.org/what-we-do/periodic-table-of-elements/"}},{"id":"periodic-t28","concept":"periodic.atomic-order","difficulty":2,"prompt":"סדר היסודות בטבלה נקבע לפי האות הראשונה בשם העברי שלהם.","answer":false,"explanation":"הסדר נקבע לפי מספר אטומי עולה, בלי תלות בשפת השם.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 90–92; IUPAC — הטבלה המחזורית","url":"https://iupac.org/what-we-do/periodic-table-of-elements/"}},{"id":"periodic-t29","concept":"periodic.alkali-properties","difficulty":2,"prompt":"נתרן ואשלגן מגיבים עם מים.","answer":true,"explanation":"שניהם מתכות אלקליות, ותגובה עם מים היא אחת התכונות הנלמדות של משפחה זו.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 55–59, 62–63; מספור קבוצות מודרני: IUPAC","url":"https://iupac.org/what-we-do/periodic-table-of-elements/"}},{"id":"periodic-t30","concept":"periodic.family-similarity","difficulty":2,"prompt":"לשני יסודות שונים באותה משפחה כימית יש אותו מספר אטומי.","answer":false,"explanation":"מספר אטומי מזהה יסוד מסוים. יסודות שונים, גם אם הם בני אותה משפחה, נבדלים במספר האטומי.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 55–59, 62–63; מספור קבוצות מודרני: IUPAC","url":"https://iupac.org/what-we-do/periodic-table-of-elements/"}}],"cloze":[{"id":"periodic-c01","title":"איך קוראים את הטבלה המחזורית?","text":"הטבלה המחזורית מרכזת את ה[[a]]. הסדר בה נקבע לפי [[b]] עולה. השורות האופקיות נקראות [[c]], והטורים האנכיים נקראים [[d]]. לבני משפחה כימית יש בדרך כלל תכונות כימיות [[e]]. במספור המודרני, המתכות האלקליות נמצאות בקבוצה [[f]], ההלוגנים בקבוצה [[g]], והגזים האצילים בקבוצה [[h]].","blanks":[{"key":"a","answer":"יסודות","concept":"periodic.element-table","explanation":"הטבלה המחזורית היא טבלה מסודרת של היסודות הכימיים."},{"key":"b","answer":"מספר אטומי","concept":"periodic.atomic-order","explanation":"המספר האטומי קובע את סדר היסודות בטבלה המודרנית."},{"key":"c","answer":"מחזורים","concept":"periodic.period","explanation":"מחזור הוא שורה אופקית בטבלה."},{"key":"d","answer":"קבוצות","concept":"periodic.group","explanation":"קבוצה היא טור אנכי בטבלה."},{"key":"e","answer":"דומות","concept":"periodic.family-similarity","explanation":"למשפחה כימית מאפיינות תכונות דומות, שאינן בהכרח זהות."},{"key":"f","answer":"1","concept":"periodic.alkali-position","explanation":"המתכות האלקליות נמצאות בקבוצה 1; מימן אינו שייך למשפחה."},{"key":"g","answer":"17","concept":"periodic.halogen-position","explanation":"קבוצה 17 היא משפחת ההלוגנים."},{"key":"h","answer":"18","concept":"periodic.noble-position","explanation":"קבוצה 18 היא משפחת הגזים האצילים."}],"distractors":["מולקולות","מספר נייטרונים","זהות לחלוטין"],"source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 90–92; IUPAC — הטבלה המחזורית","url":"https://iupac.org/what-we-do/periodic-table-of-elements/"}},{"id":"periodic-c02","title":"תכונות החומר והשימוש בו","text":"רוב ה[[a]] מוצקות בטמפרטורת החדר. הן מוליכות [[b]], ולכן משמשות בחלק המוליך של כבלים, ומוליכות [[c]], ולכן משמשות בגוף של סירים. היכולת לשטח ולעצב חומר נקראת [[d]]. דוגמה ליסוד המשמש בחוטי הולכה היא [[e]]. מתכת חריגה מבחינת מצב הצבירה היא [[f]], שהיא נוזלית בטמפרטורת החדר. פחמן מסווג כ[[g]], אך אחת מצורותיו, [[h]], דווקא מוליכה זרם.","blanks":[{"key":"a","answer":"מתכות","concept":"periodic.metal-properties","explanation":"רוב המתכות מוצקות בתנאי חדר."},{"key":"b","answer":"חשמל","concept":"periodic.electrical-use","explanation":"מוליכות חשמלית מאפשרת שימוש בליבה מוליכה של כבל."},{"key":"c","answer":"חום","concept":"periodic.thermal-use","explanation":"מוליכות חום מסייעת להעברת חום אל המזון."},{"key":"d","answer":"ריקוע","concept":"periodic.malleability","explanation":"ריקוע הוא היכולת לשטח ולעצב חומר."},{"key":"e","answer":"נחושת","concept":"periodic.electrical-use","explanation":"נחושת היא מתכת המוליכה חשמל היטב."},{"key":"f","answer":"כספית","concept":"periodic.mercury-exception","explanation":"כספית היא מתכת נוזלית בטמפרטורת החדר."},{"key":"g","answer":"אל מתכת","concept":"periodic.nonmetal-classification","explanation":"פחמן הוא אל מתכת."},{"key":"h","answer":"גרפיט","concept":"periodic.graphite-exception","explanation":"גרפיט הוא צורה של פחמן בעלת מוליכות חשמלית."}],"distractors":["חמצן","מגנטיות","גז אציל"],"source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 40, 44–45, 61–64"}},{"id":"periodic-c03","title":"שלוש משפחות וחריג אחד","text":"בראש הקבוצה השמאלית ביותר בטבלה נמצא [[a]], שהוא אל מתכת. היסודות שמתחתיו באותה קבוצה שייכים למשפחה הנקראת [[b]]; אחד מהם הוא [[c]], שסמלו Na. משפחת ה[[d]] נמצאת בקבוצה 17; אחד מחבריה הוא [[e]], שסמלו Cl. בקבוצה 18 נמצאת המשפחה המכונה [[f]]; אחד מחבריה הוא [[g]], שסמלו He. משפחה אחרונה זו מתאפיינת בפעילות כימית [[h]] בתנאים רגילים.","blanks":[{"key":"a","answer":"מימן","concept":"periodic.hydrogen-exception","explanation":"מימן הוא אל מתכת בראש קבוצה 1."},{"key":"b","answer":"מתכות אלקליות","concept":"periodic.alkali-position","explanation":"המתכות האלקליות נמצאות בקבוצה 1 מתחת למימן."},{"key":"c","answer":"נתרן","concept":"periodic.alkali-members","explanation":"Na הוא הסמל של נתרן, מתכת אלקלית."},{"key":"d","answer":"הלוגנים","concept":"periodic.halogen-position","explanation":"ההלוגנים שייכים לקבוצה 17."},{"key":"e","answer":"כלור","concept":"periodic.halogen-members","explanation":"Cl הוא הסמל של כלור, הלוגן."},{"key":"f","answer":"גזים אצילים","concept":"periodic.noble-position","explanation":"הגזים האצילים שייכים לקבוצה 18."},{"key":"g","answer":"הליום","concept":"periodic.noble-members","explanation":"He הוא הסמל של הליום, גז אציל."},{"key":"h","answer":"נמוכה","concept":"periodic.noble-reactivity","explanation":"גזים אצילים מתאפיינים בתגובתיות נמוכה בתנאים רגילים."}],"distractors":["מגנזיום","חמצן","גבוהה"],"source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 55–59, 62–63; מספור קבוצות מודרני: IUPAC","url":"https://iupac.org/what-we-do/periodic-table-of-elements/"}}],"open":[{"id":"periodic-o01","concept":"periodic.period-vs-group","prompt":"הסבירו את ההבדל בין שורה לטור בטבלה המחזורית, ומה אפשר ללמוד מכל אחד מהם.","modelAnswer":"שורה אופקית נקראת מחזור, ולאורכה המספר האטומי עולה משמאל לימין. טור אנכי נקרא קבוצה; במשפחות שנלמדו, לבני אותה קבוצה יש תכונות כימיות דומות. שורה משותפת אינה אומרת שהיסודות הם מאותה משפחה.","keyPoints":["מחזור הוא שורה אופקית.","לאורך המחזור המספר האטומי עולה.","קבוצה היא טור, ובני משפחה כימית דומים בתכונותיהם."],"source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 90–92; IUPAC — הטבלה המחזורית","url":"https://iupac.org/what-we-do/periodic-table-of-elements/"}},{"id":"periodic-o02","concept":"periodic.hydrogen-exception","prompt":"תלמיד טוען שמימן הוא מתכת אלקלית כי הוא נמצא בקבוצה 1. הסבירו מה נכון ומה שגוי בטענה.","modelAnswer":"נכון שמימן מופיע בקבוצה 1, אך הוא אל מתכת ואינו שייך למשפחת המתכות האלקליות. במשפחה זו נמצאים למשל ליתיום, נתרן ואשלגן, מתחת למימן.","keyPoints":["מיקומו של מימן בקבוצה 1 נכון.","מימן הוא אל מתכת ואינו מתכת אלקלית.","דוגמה למתכת אלקלית: ליתיום, נתרן או אשלגן."],"source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 44, 55; RSC — מימן","url":"https://periodic-table.rsc.org/element/1/hydrogen"}},{"id":"periodic-o03","concept":"periodic.evidence-classification","prompt":"מדוע אין די בבדיקת מצב הצבירה כדי להחליט אם יסוד הוא מתכת? הביאו שתי דוגמאות.","modelAnswer":"רוב המתכות מוצקות בטמפרטורת החדר, אך כספית היא מתכת נוזלית. מצד שני, פחמן הוא אל מתכת מוצקה. לכן צריך לבחון כמה תכונות יחד או להיעזר בסיווג היסוד בטבלה.","keyPoints":["מצב הצבירה לבדו אינו קובע את הסיווג.","כספית היא מתכת נוזלית.","יש אל מתכות מוצקות, כגון פחמן."],"source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 40, 44–45, 61–64"}},{"id":"periodic-o04","concept":"periodic.property-to-use","prompt":"הציעו תכונה רצויה לחומר של גוף סיר ותכונה רצויה לחומר של ידית אחיזה. נמקו כל בחירה.","modelAnswer":"לגוף הסיר רצויה מוליכות חום טובה כדי להעביר חום אל המזון. לידית האחיזה רצויה מוליכות חום נמוכה יחסית כדי לצמצם את התחממותה. התאמת החומר תלויה בתפקיד של כל חלק.","keyPoints":["גוף הסיר: הולכת חום טובה.","ידית: הולכת חום גרועה יחסית.","נימוק התואם לתפקיד של כל חלק."],"source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 40, 44–45, 61–64"}},{"id":"periodic-o05","concept":"periodic.group-numbering","prompt":"בספר ההלוגנים נמצאים בטור הראשי 7 והגזים האצילים בטור הראשי 8. בטבלה אחרת הם בקבוצות 17 ו־18. הסבירו מדוע אין כאן סתירה.","modelAnswer":"הספר ממספר שמונה טורים ראשיים, ואילו השיטה המודרנית ממספרת את הקבוצות 1 עד 18. הטור הראשי 7 מתאים לקבוצה 17, והטור הראשי 8 מתאים לקבוצה 18. מיקום המשפחות נשאר זהה; שיטת המספור שונה.","keyPoints":["יש שתי שיטות מספור שונות.","הלוגנים: טור ראשי 7 הוא קבוצה 17.","גזים אצילים: טור ראשי 8 הוא קבוצה 18."],"source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 55–59, 62–63; מספור קבוצות מודרני: IUPAC","url":"https://iupac.org/what-we-do/periodic-table-of-elements/"}},{"id":"periodic-o06","concept":"periodic.graphite-exception","prompt":"תלמיד בדק גרפיט ומצא שהוא מוליך חשמל. הוא הסיק שגרפיט הוא מתכת. הסבירו מדוע המסקנה אינה נכונה.","modelAnswer":"גרפיט הוא צורה של היסוד פחמן, המסווג כאל מתכת. הוא חריג מוליך חשמל, ולכן מוליכות חשמלית לבדה אינה מוכיחה שחומר הוא מתכת. יש להיעזר במכלול תכונות ובזהות היסוד.","keyPoints":["גרפיט הוא צורה של פחמן.","פחמן מסווג כאל מתכת.","מוליכות חשמלית לבדה אינה מספיקה לסיווג."],"source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 40, 64; RSC — פחמן","url":"https://periodic-table.rsc.org/element/6/carbon"}}]},{"topic":"atom","mcq":[{"id":"atom-m01","concept":"atom.proton","difficulty":1,"prompt":"איזה תיאור מתאים לפרוטון?","choices":["חלקיק בעל מטען חיובי הנמצא בגרעין","חלקיק בעל מטען שלילי הנמצא בגרעין","חלקיק חסר מטען הנמצא במעטפת","חלקיק בעל מטען חיובי הנמצא מחוץ לגרעין"],"answer":0,"explanation":"פרוטון נמצא בגרעין האטום ומטענו החשמלי חיובי.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 81–83 (מספור מודפס)"}},{"id":"atom-m02","concept":"atom.electron","difficulty":1,"prompt":"היכן נמצאים האלקטרונים באטום?","choices":["במרחב שסביב הגרעין","רק במרכז הגרעין","בתוך הפרוטונים","בתוך הנייטרונים"],"answer":0,"explanation":"האלקטרונים נמצאים באזור שמחוץ לגרעין, המתואר באמצעות ענן האלקטרונים.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 81–83 (מספור מודפס)"}},{"id":"atom-m03","concept":"atom.neutron","difficulty":1,"prompt":"מהו המטען החשמלי של נייטרון?","choices":["אפס","חיובי","שלילי","תלוי ביסוד שבו הוא נמצא"],"answer":0,"explanation":"הנייטרון חסר מטען חשמלי כולל; מטענו אפס בכל יסוד.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 82–83 (מספור מודפס)"}},{"id":"atom-m04","concept":"atom.atomic_number","difficulty":1,"prompt":"מה קובע את המספר האטומי של יסוד?","choices":["מספר הפרוטונים בגרעין","מספר הנייטרונים בגרעין","סכום הפרוטונים והנייטרונים","סכום כל החלקיקים באטום"],"answer":0,"explanation":"המספר האטומי מוגדר כמספר הפרוטונים בגרעין. הוא מזהה את היסוד.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 88–89 (מספור מודפס)"}},{"id":"atom-m05","concept":"atom.neutrality","difficulty":2,"prompt":"בגרעין של אטום חמצן ניטרלי יש 8 פרוטונים. כמה אלקטרונים יש באטום?","choices":["8","16","4","אי אפשר לדעת ללא מספר הנייטרונים"],"answer":0,"explanation":"באטום ניטרלי מספר האלקטרונים שווה למספר הפרוטונים. מספר הנייטרונים אינו משנה את השוויון הזה.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 88–89 (מספור מודפס)"}},{"id":"atom-m06","concept":"atom.mass_distribution","difficulty":1,"prompt":"היכן מרוכזת כמעט כל מסת האטום?","choices":["בגרעין","בענן האלקטרונים בלבד","על הגבול החיצוני של האטום","באופן אחיד בכל נפח האטום"],"answer":0,"explanation":"הפרוטונים והנייטרונים שבגרעין כבדים בהרבה מהאלקטרונים, ולכן כמעט כל המסה מרוכזת בגרעין.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 81–84 (מספור מודפס)"}},{"id":"atom-m07","concept":"atom.mass_volume","difficulty":2,"prompt":"איזו השוואה בין הגרעין לאטום כולו נכונה?","choices":["הגרעין תופס חלק זעיר מהנפח, אך מכיל כמעט את כל המסה","הגרעין תופס כמעט את כל הנפח, אך מכיל מעט מאוד מסה","הגרעין תופס מחצית מהנפח ומחצית מהמסה","הגרעין והאטום זהים בנפחם"],"answer":0,"explanation":"מסה ונפח הם גדלים שונים: הגרעין קטן מאוד ביחס לאטום, אך רוב המסה מרוכזת בו.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 81–84 (מספור מודפס)"}},{"id":"atom-m08","concept":"atom.atomic_number","difficulty":2,"prompt":"מהו המספר האטומי של האטום המתואר?","choices":["3","4","6","7"],"answer":0,"explanation":"בתרשים מוצגים 3 פרוטונים. לכן המספר האטומי הוא 3; הנייטרונים והאלקטרונים אינם נספרים לצורך הגדרה זו.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 88–89 (מספור מודפס)"},"stimulus":{"type":"atom","title":"מודל סכמטי של אטום — לא בקנה מידה","protons":3,"neutrons":4,"electrons":3,"showCounts":true}},{"id":"atom-m09","concept":"atom.neutrality","difficulty":2,"prompt":"מדוע האטום שבתרשים ניטרלי מבחינה חשמלית?","choices":["מספר המטענים החיוביים שווה למספר המטענים השליליים","מספר הנייטרונים שווה למספר האלקטרונים","כל החלקיקים שבו חסרי מטען","מסת הגרעין שווה למסת המעטפת"],"answer":0,"explanation":"ששת הפרוטונים וששת האלקטרונים נושאים מטענים שווים בגודלם והפוכים בסימנם, ולכן המטען הכולל אפס. הנייטרונים אינם תורמים מטען.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 83, 88–89 (מספור מודפס)"},"stimulus":{"type":"atom","title":"מודל סכמטי של אטום — לא בקנה מידה","protons":6,"neutrons":6,"electrons":6,"showCounts":true}},{"id":"atom-m10","concept":"atom.nucleus_contents","difficulty":2,"prompt":"כמה חלקיקים נמצאים בגרעין האטום שבתרשים?","choices":["4","2","6","8"],"answer":0,"explanation":"בגרעין יש 2 פרוטונים ו־2 נייטרונים, ובסך הכול 4 חלקיקים. שני האלקטרונים נמצאים מחוץ לגרעין.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 81–83 (מספור מודפס)"},"stimulus":{"type":"atom","title":"מודל סכמטי של אטום — לא בקנה מידה","protons":2,"neutrons":2,"electrons":2,"showCounts":true}},{"id":"atom-m11","concept":"atom.element_identity","difficulty":2,"prompt":"איזה נתון בטבלה מוכיח שהאטומים א ו־ב שייכים ליסודות שונים?","choices":["מספר הפרוטונים שלהם שונה","בשניהם מספר הפרוטונים שווה למספר האלקטרונים","בשניהם קיימים נייטרונים","כל אחד מהם ניטרלי"],"answer":0,"explanation":"זהות היסוד נקבעת לפי מספר הפרוטונים. לאטום א 7 פרוטונים ולאטום ב 8, ולכן הם שייכים ליסודות שונים.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 88–89 (מספור מודפס)"},"stimulus":{"type":"table","title":"נתונים לדוגמה לימודית על שני אטומים","headers":["אטום","פרוטונים","נייטרונים","אלקטרונים"],"rows":[["א","7","7","7"],["ב","8","8","8"]]}},{"id":"atom-m12","concept":"atom.nuclear_charge","difficulty":2,"prompt":"מהו סימן המטען הכולל של הגרעין המתואר בטבלה?","choices":["חיובי","שלילי","אפס","אי אפשר לדעת כי מספר הנייטרונים גדול יותר"],"answer":0,"explanation":"בגרעין יש 5 פרוטונים חיוביים ו־6 נייטרונים חסרי מטען. לכן מטענו חיובי, אף שיש בו יותר נייטרונים מפרוטונים.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 81–83 (מספור מודפס)"},"stimulus":{"type":"table","title":"הרכב אטום לדוגמה לימודית","headers":["חלקיק","כמות"],"rows":[["פרוטונים","5"],["נייטרונים","6"],["אלקטרונים","5"]]}},{"id":"atom-m13","concept":"atom.neutrality","difficulty":3,"prompt":"איזה הסבר מתקן את טענתו של התלמיד?","choices":["הנייטרונים אינם מוסיפים מטען; 12 הפרוטונים ו־12 האלקטרונים מאזנים זה את זה","האטום ניטרלי מפני שמספר הנייטרונים גדול ממספר הפרוטונים","האטום ניטרלי רק אם מוציאים ממנו נייטרון אחד","הנייטרונים מבטלים את המטען של האלקטרונים"],"answer":0,"explanation":"ניטרליות נקבעת לפי איזון המטענים של הפרוטונים והאלקטרונים. לנייטרונים מטען אפס, ולכן כמותם אינה קובעת אם האטום ניטרלי.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 88–89 (מספור מודפס)"},"stimulus":{"type":"text","title":"בודקים הסבר","text":"באטום יש 12 פרוטונים, 13 נייטרונים ו־12 אלקטרונים. תלמיד טען: ״האטום אינו ניטרלי, כי מספר הנייטרונים שונה ממספר הפרוטונים״."}},{"id":"atom-m14","concept":"atom.neutral_atomic_number","difficulty":2,"prompt":"ידוע שלאטום ניטרלי יש 11 אלקטרונים. מהו מספרו האטומי?","choices":["11","22","מספר הנייטרונים שלו","אי אפשר להסיק דבר ממספר האלקטרונים"],"answer":0,"explanation":"באטום ניטרלי יש מספר שווה של אלקטרונים ופרוטונים. לכן יש בו 11 פרוטונים והמספר האטומי הוא 11.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 88–89 (מספור מודפס)"}},{"id":"atom-m15","concept":"atom.neutron_independence","difficulty":3,"prompt":"ידוע רק שמספרו האטומי של אטום הוא 8. איזה נתון אי אפשר לקבוע מכך לבדו?","choices":["מספר הנייטרונים בגרעין","מספר הפרוטונים בגרעין","סימן המטען של הגרעין","מספר האלקטרונים, אם נאמר גם שהאטום ניטרלי"],"answer":0,"explanation":"המספר האטומי נותן את מספר הפרוטונים. כדי לדעת כמה נייטרונים יש באטום המסוים נדרש מידע נוסף, למשל מספר המסה שלו.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 88–91 (מספור מודפס)"}},{"id":"atom-m16","concept":"atom.identical_particles","difficulty":2,"prompt":"מה נכון לגבי פרוטון באטום נחושת ופרוטון באטום ברזל?","choices":["אלה חלקיקים מאותו סוג, בעלי אותו מטען חשמלי","לפרוטון בנחושת מטען חיובי ולפרוטון בברזל מטען שלילי","הפרוטון בנחושת כבד פי שניים רק משום שזהו יסוד אחר","הפרוטון בברזל נמצא במעטפת והפרוטון בנחושת בגרעין"],"answer":0,"explanation":"פרוטונים הם אותו סוג של חלקיק בכל האטומים. היסודות נבדלים במספר הפרוטונים, ולא בסוג הפרוטונים.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 88, 102 (מספור מודפס)"}},{"id":"atom-m17","concept":"atom.particle_mass","difficulty":2,"prompt":"איזה משפט מתאר נכון את מסות החלקיקים?","choices":["מסות הפרוטון והנייטרון קרובות זו לזו, ושתיהן גדולות בהרבה ממסת האלקטרון","מסת האלקטרון גדולה בהרבה ממסת הפרוטון","לנייטרון אין מסה מפני שאין לו מטען","לפרוטון, לנייטרון ולאלקטרון מסות שוות"],"answer":0,"explanation":"מטען חשמלי ומסה אינם אותו גודל. לנייטרון יש מסה, ומסתו קרובה למסת הפרוטון. מסת האלקטרון קטנה בהרבה.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 82–83 (מספור מודפס)"}},{"id":"atom-m18","concept":"atom.charge_magnitude","difficulty":2,"prompt":"כיצד יכולים פרוטון ואלקטרון לאזן את המטען זה של זה, אף שמסותיהם שונות מאוד?","choices":["מטעניהם שווים בגודלם והפוכים בסימנם","המטען נקבע לפי מסת החלקיק","האלקטרון הופך לחסר מטען בתוך האטום","הפרוטון מאבד את מטענו כאשר יש לידו נייטרון"],"answer":0,"explanation":"לפרוטון ולאלקטרון מטענים שווים בגודלם ומנוגדים בסימנם. איזון המטען אינו דורש שוויון מסות.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 82–83 (מספור מודפס)"}},{"id":"atom-m19","concept":"atom.electric_attraction","difficulty":1,"prompt":"בין איזה זוג חלקיקים פועל כוח משיכה חשמלי?","choices":["פרוטון ואלקטרון","שני פרוטונים","שני אלקטרונים","פרוטון ונייטרון חסר מטען"],"answer":0,"explanation":"מטענים מנוגדים מושכים זה את זה. לכן פרוטון חיובי ואלקטרון שלילי נמשכים מבחינה חשמלית.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 84, 100–101 (מספור מודפס)"}},{"id":"atom-m20","concept":"atom.electric_repulsion","difficulty":2,"prompt":"מתייחסים רק לכוח החשמלי בין שני פרוטונים. מה כיוונו?","choices":["כוח דחייה ביניהם","כוח משיכה ביניהם","אין ביניהם כוח חשמלי","הכוח מתחלף לפי מספר האלקטרונים באטום"],"answer":0,"explanation":"לשני פרוטונים מטען חיובי, ומטענים בעלי אותו סימן דוחים זה את זה מבחינה חשמלית. השאלה עוסקת בכוח החשמלי בלבד.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 84 (מספור מודפס)"}},{"id":"atom-m21","concept":"atom.nuclear_charge","difficulty":1,"prompt":"מדוע גרעין האטום בעל מטען חיובי?","choices":["הוא מכיל פרוטונים חיוביים, והנייטרונים שבו אינם מוסיפים מטען","הוא מכיל יותר נייטרונים מאלקטרונים","כל החלקיקים בגרעין נושאים מטען חיובי","האלקטרונים החיוביים מרוכזים בו"],"answer":0,"explanation":"הפרוטונים מקנים לגרעין את מטענו החיובי. נייטרונים, כאשר הם נמצאים בגרעין, חסרי מטען; האלקטרונים נמצאים מחוץ לגרעין.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 81–83 (מספור מודפס)"}},{"id":"atom-m22","concept":"atom.same_element","difficulty":3,"prompt":"שני האטומים שבטבלה שייכים לאותו יסוד. מהו ההסבר?","choices":["מספר הפרוטונים שלהם זהה","מספר הנייטרונים שלהם זהה","מספר החלקיקים הכולל בשניהם זהה","המסה שלהם זהה בהכרח"],"answer":0,"explanation":"זהות היסוד נקבעת לפי מספר הפרוטונים. בשני האטומים יש 6 פרוטונים, ולכן הם מאותו יסוד גם כאשר מספר הנייטרונים שונה.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 88–89 (מספור מודפס)"},"stimulus":{"type":"table","title":"שני אטומים — דוגמה לימודית","headers":["אטום","פרוטונים","נייטרונים","אלקטרונים"],"rows":[["א","6","6","6"],["ב","6","7","6"]]}},{"id":"atom-m23","concept":"atom.neutrality","difficulty":2,"prompt":"איזו טענה של התלמידה נכונה?","choices":["באטום ניטרלי מספר הפרוטונים שווה למספר האלקטרונים","באטום ניטרלי כל החלקיקים חסרי מטען","באטום ניטרלי אין פרוטונים","באטום ניטרלי חייב להיות מספר שווה של כל שלושת סוגי החלקיקים"],"answer":0,"explanation":"ניטרלי פירושו שהמטען החשמלי הכולל אפס. החלקיקים עצמם יכולים להיות טעונים, ובלבד שהמטענים החיוביים והשליליים מתאזנים.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 88–89 (מספור מודפס)"},"stimulus":{"type":"text","title":"מפרשים מושג","text":"תלמידה מתבקשת להסביר מה פירוש הביטוי ״אטום ניטרלי מבחינה חשמלית״. היא בוחנת את הקשר בין מספרי החלקיקים לבין המטען הכולל."}},{"id":"atom-m24","concept":"atom.model_limits","difficulty":3,"prompt":"מה צריך לשנות בכיתוב שליד הדגם?","choices":["לציין שהציור סכמטי ואינו מציג מסלול תנועה מדויק של אלקטרון","לציין שכל אלקטרון הוא למעשה כדור הארץ זעיר","לציין שהגרעין נמצא מחוץ לאטום","לציין שהעיגול מייצג דופן מוצקה שסוגרת את האטום"],"answer":0,"explanation":"דגם מסייע להבין מיקום יחסי, אך אין להסיק ממנו שאלקטרונים מקיפים את הגרעין במסלול קלאסי מדויק כמו כוכבי לכת.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 81–83 (מספור מודפס)"},"stimulus":{"type":"text","title":"דגם והמציאות","text":"בציור לימודי הוצגו גרעין במרכז ועיגול סביבו. ליד העיגול נכתב: ״זהו בדיוק המסלול שבו נע האלקטרון תמיד״."}},{"id":"atom-m25","concept":"atom.electron_cloud","difficulty":3,"prompt":"מה מתאר ענן האלקטרונים במודל האטום?","choices":["את האזור שבו אפשר למצוא אלקטרונים ואת הסיכוי להימצאותם במקומות שונים","ענן של אדי מים שמקיף את הגרעין","שכבה מוצקה המפרידה בין האטום לסביבה","מסלול מעגלי אחד שחייב להיות משותף לכל האלקטרונים"],"answer":0,"explanation":"ענן האלקטרונים הוא תיאור של פיזור ההסתברות למציאת אלקטרונים סביב הגרעין, ולא ענן חומר רגיל או דופן מוצקה.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 83 (מספור מודפס)"}},{"id":"atom-m26","concept":"atom.scale","difficulty":2,"prompt":"מהי מגבלה של ציור אטום שבו הגרעין נראה כמעט בגודל האטום כולו?","choices":["הציור אינו משמר את היחס האמיתי בין גודל הגרעין לגודל האטום","הציור מוכיח שרוב נפח האטום מלא בפרוטונים","הציור מוכיח שמסת האלקטרון גדולה ממסת הגרעין","אין מגבלה, משום שהגרעין אכן כמעט בגודל האטום"],"answer":0,"explanation":"במציאות הגרעין קטן מאוד ביחס לאטום. לעיתים מגדילים אותו בציור כדי שאפשר יהיה לראות את מרכיביו.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 81–84 (מספור מודפס)"}},{"id":"atom-m27","concept":"atom.common_structure","difficulty":2,"prompt":"מה משותף לאטום חמצן ולאטום ברזל?","choices":["בשניהם יש גרעין חיובי ואלקטרונים מחוץ לגרעין","בשניהם אותו מספר פרוטונים","בשניהם אותה מסה","בשניהם כל החלקיקים נמצאים בגרעין"],"answer":0,"explanation":"האטומים חולקים מבנה בסיסי של גרעין ואלקטרונים סביבו. מספר הפרוטונים שונה בין יסודות שונים.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 81–83, 88 (מספור מודפס)"}},{"id":"atom-m28","concept":"atom.mass_number","difficulty":3,"prompt":"לאטום מסוים מספר אטומי 13 ומספר מסה 27. כמה נייטרונים יש בגרעינו?","choices":["14","13","27","40"],"answer":0,"explanation":"מספר המסה הוא סכום הפרוטונים והנייטרונים. בגרעין 13 פרוטונים, ולכן מספר הנייטרונים הוא 27 פחות 13, כלומר 14.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 89, 93 (מספור מודפס)"}},{"id":"atom-m29","concept":"atom.nucleus_contents","difficulty":2,"prompt":"במודל שלפניכם אין נייטרונים. איזה תיאור של המטען נכון בכל זאת?","choices":["הגרעין חיובי והאטום כולו ניטרלי","הגרעין ניטרלי והאטום כולו חיובי","לפרוטון אין מטען כי אין נייטרון לידו","אי אפשר לקבל אטום ניטרלי ללא נייטרונים"],"answer":0,"explanation":"הפרוטון מקנה לגרעין מטען חיובי, והאלקטרון בעל מטען נגדי שווה בגודלו. לכן האטום כולו ניטרלי גם ללא נייטרון.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 81–83; OpenStax, מבנה האטום","url":"https://openstax.org/books/chemistry-atoms-first-2e/pages/2-3-atomic-structure-and-symbolism"},"stimulus":{"type":"atom","title":"מודל סכמטי של אטום מימן — לא בקנה מידה","protons":1,"neutrons":0,"electrons":1,"showCounts":true}},{"id":"atom-m30","concept":"atom.mass_volume","difficulty":3,"prompt":"איזו תשובה מסבירה את התיאור שבקטע?","choices":["חלקיקי הגרעין כבדים בהרבה מהאלקטרונים, אף שהגרעין קטן מאוד","הנפח של כל חלקיק חייב להיות שווה למסה שלו","כל האלקטרונים נמצאים בתוך הגרעין","המסה מתחלקת באטום תמיד ביחס ישר לנפח"],"answer":0,"explanation":"רוב המסה מרוכזת בחלקיקי הגרעין הכבדים יחסית. אין הכרח שהאזור הגדול יותר בנפחו יכיל את רוב המסה.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 81–84 (מספור מודפס)"},"stimulus":{"type":"text","title":"מסה לעומת נפח","text":"בסיכום נכתב: ״הגרעין תופס חלק זעיר מנפח האטום, אך כמעט כל מסת האטום מרוכזת בו״. תלמיד חשב ששני חלקי המשפט סותרים זה את זה."}}],"tf":[{"id":"atom-t01","concept":"atom.proton","difficulty":1,"prompt":"הפרוטונים נמצאים בגרעין האטום.","answer":true,"explanation":"הפרוטונים הם חלקיקים חיוביים הנמצאים בגרעין.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 81–83 (מספור מודפס)"}},{"id":"atom-t02","concept":"atom.electron","difficulty":1,"prompt":"לאלקטרון יש מטען חשמלי חיובי.","answer":false,"explanation":"לאלקטרון מטען שלילי. הפרוטון הוא החלקיק בעל המטען החיובי.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 82–83 (מספור מודפס)"}},{"id":"atom-t03","concept":"atom.neutron","difficulty":1,"prompt":"לנייטרון אין מטען חשמלי כולל.","answer":true,"explanation":"מטענו החשמלי של הנייטרון הוא אפס.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 82–83 (מספור מודפס)"}},{"id":"atom-t04","concept":"atom.particle_mass","difficulty":2,"prompt":"לנייטרון אין מסה, משום שהוא חסר מטען.","answer":false,"explanation":"מסה ומטען הם גדלים שונים. לנייטרון יש מסה הקרובה למסת הפרוטון.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 82–83 (מספור מודפס)"}},{"id":"atom-t05","concept":"atom.atomic_number","difficulty":1,"prompt":"מספר הפרוטונים בגרעין קובע את המספר האטומי.","answer":true,"explanation":"זו הגדרת המספר האטומי, המזהה את היסוד.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 88–89 (מספור מודפס)"}},{"id":"atom-t06","concept":"atom.atomic_number","difficulty":2,"prompt":"המספר האטומי הוא סכום הפרוטונים והנייטרונים בגרעין.","answer":false,"explanation":"המספר האטומי הוא מספר הפרוטונים בלבד. סכום הפרוטונים והנייטרונים נקרא מספר המסה.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 88–89 (מספור מודפס)"}},{"id":"atom-t07","concept":"atom.neutrality","difficulty":1,"prompt":"באטום ניטרלי מספר האלקטרונים שווה למספר הפרוטונים.","answer":true,"explanation":"מטעני הפרוטונים והאלקטרונים מאזנים זה את זה כאשר מספריהם שווים.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 88–89 (מספור מודפס)"}},{"id":"atom-t08","concept":"atom.neutrality","difficulty":2,"prompt":"אטום ניטרלי מורכב רק מחלקיקים חסרי מטען.","answer":false,"explanation":"באטום ניטרלי יש פרוטונים חיוביים ואלקטרונים שליליים. המטען הכולל אפס משום שהם מתאזנים.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 88–89 (מספור מודפס)"}},{"id":"atom-t09","concept":"atom.mass_distribution","difficulty":1,"prompt":"כמעט כל מסת האטום מרוכזת בגרעין.","answer":true,"explanation":"הגרעין מכיל את הפרוטונים והנייטרונים, הכבדים בהרבה מהאלקטרונים.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 81–84 (מספור מודפס)"}},{"id":"atom-t10","concept":"atom.mass_volume","difficulty":2,"prompt":"גרעין האטום תופס כמעט את כל נפח האטום.","answer":false,"explanation":"הגרעין תופס חלק זעיר מהנפח. האזור שמחוץ לגרעין מהווה את רוב נפח האטום.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 81–84 (מספור מודפס)"}},{"id":"atom-t11","concept":"atom.nuclear_charge","difficulty":1,"prompt":"גרעין האטום בעל מטען חשמלי חיובי.","answer":true,"explanation":"בגרעין נמצאים פרוטונים חיוביים. נייטרונים אינם מוסיפים מטען שלילי.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 81–83 (מספור מודפס)"}},{"id":"atom-t12","concept":"atom.nuclear_charge","difficulty":2,"prompt":"באטום ניטרלי גם הגרעין עצמו חייב להיות ניטרלי.","answer":false,"explanation":"הגרעין חיובי. האלקטרונים שמחוץ לו מאזנים את מטענו כאשר מתייחסים לאטום כולו.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 81–83, 88–89 (מספור מודפס)"}},{"id":"atom-t13","concept":"atom.identical_particles","difficulty":2,"prompt":"אלקטרון באטום חמצן ואלקטרון באטום ברזל הם אותו סוג של חלקיק.","answer":true,"explanation":"האלקטרונים זהים בסוגם בכל היסודות. הבדלים בין האטומים נובעים מהרכבם וממספרי החלקיקים.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 88–89 (מספור מודפס)"}},{"id":"atom-t14","concept":"atom.identical_particles","difficulty":2,"prompt":"הפרוטונים ביסודות שונים נבדלים בסימן המטען שלהם.","answer":false,"explanation":"לפרוטונים בכל היסודות מטען חיובי זהה בגודלו. מספר הפרוטונים משתנה מיסוד ליסוד.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 88 (מספור מודפס)"}},{"id":"atom-t15","concept":"atom.element_identity","difficulty":2,"prompt":"שני אטומים שבגרעיניהם מספר שונה של פרוטונים שייכים ליסודות שונים.","answer":true,"explanation":"מספר הפרוטונים הוא הנתון שמגדיר את זהות היסוד.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 88–89 (מספור מודפס)"}},{"id":"atom-t16","concept":"atom.neutron_independence","difficulty":2,"prompt":"בכל אטום חייב להיות מספר שווה של פרוטונים ונייטרונים.","answer":false,"explanation":"מספר הנייטרונים יכול להיות שונה ממספר הפרוטונים. ניטרליות חשמלית קשורה לשוויון בין פרוטונים לאלקטרונים.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 89 (מספור מודפס)"}},{"id":"atom-t17","concept":"atom.same_element","difficulty":3,"prompt":"שני אטומים בעלי אותו מספר פרוטונים שייכים לאותו יסוד גם אם מספר הנייטרונים שונה.","answer":true,"explanation":"מספר הפרוטונים קובע את זהות היסוד; מספר הנייטרונים אינו משנה את המספר האטומי.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 88–89 (מספור מודפס)"}},{"id":"atom-t18","concept":"atom.neutron_independence","difficulty":3,"prompt":"אם ידוע המספר האטומי בלבד, אפשר תמיד לדעת גם את מספר הנייטרונים.","answer":false,"explanation":"המספר האטומי נותן את מספר הפרוטונים. מספר הנייטרונים מחייב מידע נוסף על האטום המסוים.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 89–91 (מספור מודפס)"}},{"id":"atom-t19","concept":"atom.charge_magnitude","difficulty":2,"prompt":"מטעני הפרוטון והאלקטרון שווים בגודלם ומנוגדים בסימנם.","answer":true,"explanation":"הפרוטון חיובי והאלקטרון שלילי, וגודל המטען של כל אחד מהם שווה.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 82–83 (מספור מודפס)"}},{"id":"atom-t20","concept":"atom.particle_mass","difficulty":2,"prompt":"מסת האלקטרון שווה בקירוב למסת הפרוטון.","answer":false,"explanation":"מסת האלקטרון קטנה בהרבה ממסת הפרוטון. דווקא מסות הפרוטון והנייטרון קרובות זו ל
