זו.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 82–83 (מספור מודפס)"}},{"id":"atom-t21","concept":"atom.electric_attraction","difficulty":1,"prompt":"בין פרוטון לאלקטרון פועל כוח משיכה חשמלי.","answer":true,"explanation":"מטענים בעלי סימנים מנוגדים מושכים זה את זה מבחינה חשמלית.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 84 (מספור מודפס)"}},{"id":"atom-t22","concept":"atom.electric_repulsion","difficulty":2,"prompt":"הכוח החשמלי בין שני אלקטרונים הוא כוח משיכה.","answer":false,"explanation":"שני האלקטרונים בעלי מטען שלילי. מטענים בעלי אותו סימן דוחים זה את זה.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 84 (מספור מודפס)"}},{"id":"atom-t23","concept":"atom.electron_cloud","difficulty":2,"prompt":"ענן האלקטרונים מתאר אזור שמחוץ לגרעין.","answer":true,"explanation":"האזור שבו ניתן למצוא אלקטרונים נמצא סביב הגרעין, והוא מכונה ענן האלקטרונים.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 81–83 (מספור מודפס)"}},{"id":"atom-t24","concept":"atom.model_limits","difficulty":3,"prompt":"עיגול בציור סכמטי של אטום מוכיח שלאלקטרון יש מסלול מעגלי מדויק וקבוע.","answer":false,"explanation":"ציור סכמטי הוא מודל מוגבל. ענן האלקטרונים מתאר הסתברויות למציאת אלקטרונים, ולא מסלול קלאסי מדויק.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 81–83 (מספור מודפס)"}},{"id":"atom-t25","concept":"atom.neutral_atomic_number","difficulty":2,"prompt":"באטום ניטרלי שמספרו האטומי 9 יש 9 אלקטרונים.","answer":true,"explanation":"המספר האטומי מציין 9 פרוטונים, ובאטום ניטרלי יש גם 9 אלקטרונים.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 88–89 (מספור מודפס)"}},{"id":"atom-t26","concept":"atom.neutral_atomic_number","difficulty":2,"prompt":"אטום ניטרלי שמספרו האטומי 12 מכיל 24 פרוטונים.","answer":false,"explanation":"המספר האטומי 12 פירושו 12 פרוטונים. באטום ניטרלי יהיו בנוסף 12 אלקטרונים.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 88–89 (מספור מודפס)"}},{"id":"atom-t27","concept":"atom.mass_number","difficulty":2,"prompt":"באטום שמספרו האטומי 6 ומספר המסה שלו 14 יש 8 נייטרונים.","answer":true,"explanation":"מספר הנייטרונים הוא מספר המסה פחות מספר הפרוטונים: 14 פחות 6 שווה 8.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 89, 93 (מספור מודפס)"}},{"id":"atom-t28","concept":"atom.nucleus_contents","difficulty":2,"prompt":"האלקטרונים נמצאים בתוך גרעין האטום יחד עם הפרוטונים.","answer":false,"explanation":"האלקטרונים נמצאים מחוץ לגרעין. הגרעין מכיל פרוטונים, וברוב סוגי האטומים גם נייטרונים.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 81–83 (מספור מודפס)"}},{"id":"atom-t29","concept":"atom.common_structure","difficulty":2,"prompt":"גם אטום מתכתי וגם אטום אל־מתכתי מכילים פרוטונים ואלקטרונים.","answer":true,"explanation":"פרוטונים ואלקטרונים הם מרכיבים של אטומים מכל היסודות; סוג היסוד אינו משנה את סוגי החלקיקים האלה.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 81–83, 88 (מספור מודפס)"}},{"id":"atom-t30","concept":"atom.scale","difficulty":2,"prompt":"בכל ציור לימודי של אטום נשמר היחס האמיתי בין גודל הגרעין לגודל האטום.","answer":false,"explanation":"ציורים רבים אינם בקנה מידה: הגרעין מוגדל כדי לאפשר לראות את מרכיביו.","source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 81–84 (מספור מודפס)"}}],"cloze":[{"id":"atom-c01","title":"מפת האטום","text":"במרכז האטום נמצא [[a]]. הוא מכיל תמיד [[b]], שלכל אחד מהם מטען [[c]]. ברוב סוגי האטומים מצויים במרכז גם [[d]], שמטענם החשמלי הוא [[e]]. מחוץ למרכז נמצאים [[f]], שלכל אחד מהם מטען [[g]]. האזור שמחוץ למרכז מכונה גם [[h]] האטום.","blanks":[{"key":"a","answer":"הגרעין","concept":"atom.nucleus_contents","explanation":"הגרעין הוא האזור המרכזי והקטן מאוד של האטום."},{"key":"b","answer":"פרוטונים","concept":"atom.proton","explanation":"הפרוטונים מצויים בגרעין ומקנים לו מטען חיובי."},{"key":"c","answer":"חיובי","concept":"atom.proton","explanation":"כל פרוטון נושא מטען חשמלי חיובי."},{"key":"d","answer":"נייטרונים","concept":"atom.neutron","explanation":"בגרעינים של רוב סוגי האטומים יש גם נייטרונים."},{"key":"e","answer":"אפס","concept":"atom.neutron","explanation":"לנייטרון אין מטען חשמלי כולל."},{"key":"f","answer":"אלקטרונים","concept":"atom.electron","explanation":"האלקטרונים נמצאים במרחב שמחוץ לגרעין."},{"key":"g","answer":"שלילי","concept":"atom.electron","explanation":"כל אלקטרון נושא מטען חשמלי שלילי."},{"key":"h","answer":"מעטפת","concept":"atom.electron_cloud","explanation":"מעטפת האטום היא האזור שמחוץ לגרעין שבו נמצאים האלקטרונים."}],"distractors":["מולקולות","כפול","הקרום"],"source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 81–83 (מספור מודפס)"}},{"id":"atom-c02","title":"כרטיס הזיהוי של אטום","text":"מספר הפרוטונים בגרעין נקרא [[a]]. נתון זה קובע את [[b]] שאליו שייך האטום. באטום שמטענו הכולל אפס, מספר האלקטרונים [[c]] למספר הפרוטונים; אטום כזה נקרא [[d]]. אם בכרטיס כתוב שהמספר המזהה הוא 8, מספר הפרוטונים הוא [[e]]. בלי מידע נוסף אי אפשר לקבוע את מספר ה[[f]]. כאשר ידוע גם [[g]], אפשר למצוא את הכמות החסרה באמצעות פעולת [[h]]: מפחיתים ממנו את מספר הפרוטונים.","blanks":[{"key":"a","answer":"המספר האטומי","concept":"atom.atomic_number","explanation":"המספר האטומי מוגדר כמספר הפרוטונים בגרעין."},{"key":"b","answer":"היסוד","concept":"atom.element_identity","explanation":"מספר הפרוטונים קובע לאיזה יסוד שייך האטום."},{"key":"c","answer":"שווה","concept":"atom.neutrality","explanation":"לשם מטען כולל אפס דרושים מספרים שווים של פרוטונים ואלקטרונים."},{"key":"d","answer":"ניטרלי","concept":"atom.neutrality","explanation":"ניטרלי מבחינה חשמלית פירושו שהמטען הכולל אפס."},{"key":"e","answer":"שמונה","concept":"atom.atomic_number","explanation":"מספר אטומי 8 פירושו שמונה פרוטונים."},{"key":"f","answer":"נייטרונים","concept":"atom.neutron_independence","explanation":"אי אפשר להסיק את מספר הנייטרונים מהמספר האטומי בלבד."},{"key":"g","answer":"מספר המסה","concept":"atom.mass_number","explanation":"מספר המסה הוא סכום הפרוטונים והנייטרונים בגרעין."},{"key":"h","answer":"חיסור","concept":"atom.mass_number","explanation":"מחסרים ממספר המסה את מספר הפרוטונים כדי לקבל את מספר הנייטרונים."}],"distractors":["גדול","כפל","שישה עשר"],"source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 88–93 (מספור מודפס)"}},{"id":"atom-c03","title":"מבינים מודל של אטום","text":"חשוב להבחין בין שני גדלים: [[a]] נמדדת למשל בגרמים, ואילו המקום שגוף תופס מתואר באמצעות [[b]]. באטום, האזור המרכזי קטן מאוד ובכל זאת מכיל [[c]] המסה. בהשוואה לאלקטרונים, הפרוטונים והנייטרונים [[d]] בהרבה. ציור לימודי הוא [[e]] שעוזר להבין את המבנה; הוא לא תמיד מצויר לפי [[f]]. בייצוג ענן האלקטרונים מתארים את ה[[g]] למצוא אלקטרון במקום מסוים. האזור הזה נמצא [[h]] לגרעין.","blanks":[{"key":"a","answer":"מסה","concept":"atom.mass_volume","explanation":"מסה היא גודל שאפשר למדוד, למשל, בגרמים או בקילוגרמים."},{"key":"b","answer":"נפח","concept":"atom.mass_volume","explanation":"נפח מתאר את המקום שגוף תופס."},{"key":"c","answer":"כמעט את כל","concept":"atom.mass_distribution","explanation":"כמעט כל מסת האטום מרוכזת בגרעין."},{"key":"d","answer":"כבדים","concept":"atom.particle_mass","explanation":"המסה של פרוטון או נייטרון גדולה בהרבה ממסת האלקטרון."},{"key":"e","answer":"מודל","concept":"atom.model_limits","explanation":"מודל מסייע לייצג ולהבין היבטים של המציאות, אך אינו העתק מלא שלה."},{"key":"f","answer":"קנה מידה","concept":"atom.scale","explanation":"לעיתים מגדילים את הגרעין בציור כדי שניתן יהיה לראות את חלקיו."},{"key":"g","answer":"סיכוי","concept":"atom.electron_cloud","explanation":"ענן האלקטרונים מתאר את הסיכוי למציאת אלקטרון באזורים שונים."},{"key":"h","answer":"מחוץ","concept":"atom.electron","explanation":"אלקטרונים נמצאים באזור שמחוץ לגרעין."}],"distractors":["קלים","בתוך","מעט מאוד מן"],"source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 81–84 (מספור מודפס)"}}],"open":[{"id":"atom-o01","concept":"atom.neutrality","prompt":"באטום יש 8 פרוטונים, 9 נייטרונים ו־8 אלקטרונים. הסבירו מדוע הוא ניטרלי למרות שמספר הנייטרונים שונה ממספר הפרוטונים.","modelAnswer":"לכל פרוטון מטען חיובי ולכל אלקטרון מטען שלילי שווה בגודלו. שמונת הפרוטונים ושמונת האלקטרונים מאזנים זה את זה. לנייטרונים מטען אפס, ולכן מספרם אינו משנה את המטען הכולל.","keyPoints":["מטעני הפרוטון והאלקטרון הפוכים בסימנם ושווים בגודלם","מספר הפרוטונים שווה למספר האלקטרונים","הנייטרונים חסרי מטען חשמלי"],"source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 82–83, 88–89 (מספור מודפס)"}},{"id":"atom-o02","concept":"atom.mass_volume","prompt":"הגרעין קטן מאוד ביחס לאטום, אך כמעט כל מסת האטום מרוכזת בו. הסבירו כיצד שתי העובדות מתיישבות זו עם זו.","modelAnswer":"מסה ונפח אינם אותו גודל. הגרעין תופס חלק קטן מאוד מהנפח, אך נמצאים בו פרוטונים ונייטרונים שכבדים בהרבה מהאלקטרונים. לכן כמעט כל המסה מרוכזת באזור קטן.","keyPoints":["הבחנה בין מסה לנפח","הפרוטונים והנייטרונים נמצאים בגרעין","האלקטרונים קלים בהרבה מחלקיקי הגרעין"],"source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 81–84 (מספור מודפס)"}},{"id":"atom-o03","concept":"atom.element_identity","prompt":"תלמיד אומר: ״אטום נחושת שונה מאטום ברזל כי הפרוטונים בנחושת הם מסוג אחר״. תקנו את ההסבר שלו.","modelAnswer":"הפרוטונים הם אותו סוג של חלקיק בכל היסודות ויש להם אותו מטען חיובי. אטום נחושת ואטום ברזל נבדלים במספר הפרוטונים בגרעין. מספר זה הוא המספר האטומי והוא קובע את זהות היסוד.","keyPoints":["הפרוטונים זהים בסוגם בכל היסודות","מספר הפרוטונים שונה בין היסודות","המספר האטומי קובע את זהות היסוד"],"source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 88, 102 (מספור מודפס)"}},{"id":"atom-o04","concept":"atom.nucleus_contents","prompt":"תארו את מיקומם ואת מטענם של שלושת סוגי החלקיקים הנלמדים במודל האטום.","modelAnswer":"הפרוטונים נמצאים בגרעין ומטענם חיובי. הנייטרונים, כאשר הם קיימים באטום, נמצאים בגרעין ומטענם אפס. האלקטרונים נמצאים מחוץ לגרעין ומטענם שלילי.","keyPoints":["פרוטונים: בגרעין, חיוביים","נייטרונים: בגרעין, חסרי מטען","אלקטרונים: מחוץ לגרעין, שליליים"],"source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 81–83 (מספור מודפס)"}},{"id":"atom-o05","concept":"atom.neutral_atomic_number","prompt":"לאטום ניטרלי מספר אטומי 12. מה אפשר לקבוע על מספר הפרוטונים ועל מספר האלקטרונים, ומה אי אפשר לקבוע על מספר הנייטרונים מהנתון הזה בלבד?","modelAnswer":"יש באטום 12 פרוטונים לפי הגדרת המספר האטומי. מכיוון שהוא ניטרלי, יש בו גם 12 אלקטרונים. אין די מידע לקביעת מספר הנייטרונים; נדרש נתון נוסף, כגון מספר המסה של האטום המסוים.","keyPoints":["12 פרוטונים","12 אלקטרונים בגלל הניטרליות","מספר הנייטרונים אינו נקבע מהמספר האטומי בלבד"],"source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 88–91 (מספור מודפס)"}},{"id":"atom-o06","concept":"atom.model_limits","prompt":"בציור לימודי הגרעין גדול וברור, והאלקטרונים מסומנים סביבו. ציינו מה אפשר ללמוד מהציור ומה עלול להטעות בו.","modelAnswer":"אפשר ללמוד שהאטום כולל גרעין ואלקטרונים מחוץ לו. לעיתים הגרעין מוגדל מאוד ביחס לגודלו האמיתי כדי שיהיה אפשר לראותו. כמו כן, מיקום נקודות בציור אינו מתאר מסלולי תנועה מדויקים וקבועים של האלקטרונים.","keyPoints":["הציור מראה מבנה ומיקום יחסי של המרכיבים","הציור אינו בהכרח בקנה מידה","אין להסיק ממנו מסלול תנועה מדויק של אלקטרון"],"source":{"label":"חוקרים חומר ואנרגיה ב׳, עמ׳ 81–84 (מספור מודפס)"}}]},{"topic":"inquiry","mcq":[{"id":"inquiry-m01","concept":"inquiry.question","difficulty":1,"prompt":"איזו שאלה מתאימה לשאלת חקר שאפשר לבדוק בניסוי בכיתה?","choices":["כיצד טמפרטורת המים משפיעה על הזמן הדרוש להמסת כמות קבועה של סוכר?","האם מים חמים נעימים יותר ממים קרים?","מי אוהב לשתות מים?","מהו הצבע היפה ביותר לכוס מים?"],"answer":0,"explanation":"שאלת חקר מתארת קשר בין גורם שאפשר לשנות לבין תוצאה שאפשר למדוד. כאן משנים טמפרטורה ומודדים זמן המסה.","source":{"label":"מצגת חקר מדעי, שקופית 2"}},{"id":"inquiry-m02","concept":"inquiry.hypothesis","difficulty":1,"prompt":"מהי השערת חקר?","choices":["תשובה אפשרית ומנומקת לשאלת החקר, שאותה בודקים","התוצאה הסופית שחייבת להתקבל בכל ניסוי","רשימת הציוד הדרוש לביצוע הניסוי","טבלה המכילה רק תוצאות שנמדדו"],"answer":0,"explanation":"השערה היא הסבר או תחזית המבוססים על ידע קודם. תוצאות הניסוי יכולות לתמוך בה או לא לתמוך בה.","source":{"label":"מצגת חקר מדעי, שקופית 2"}},{"id":"inquiry-m03","concept":"inquiry.independent","difficulty":1,"prompt":"מהו הגורם המשפיע בניסוי המתואר?","choices":["כמות המים הניתנת ביום","גובה הצמח לאחר שבועיים","סוג הזרע","משך הניסוי"],"answer":0,"explanation":"הגורם המשפיע הוא הגורם שהחוקרים משנים בכוונה. בניסוי זה משנים את כמות המים היומית.","source":{"label":"מצגת חקר מדעי, שקופיות 5 ו־12"},"stimulus":{"type":"text","title":"השקיית צמחים — תרחיש לימודי","text":"תלמידים חילקו שתילים דומים מאותו סוג לשלוש קבוצות. כל קבוצה קיבלה כמות מים יומית שונה. סוג הקרקע, התאורה ומשך הניסוי היו זהים. לאחר שבועיים נמדד גובה כל צמח."}},{"id":"inquiry-m04","concept":"inquiry.dependent","difficulty":1,"prompt":"מהו הגורם המושפע שנמדד בניסוי?","choices":["הזמן עד להמסת הסוכר","טמפרטורת המים בתחילת הניסוי","מסת הסוכר שנוספה","נפח המים בכל כוס"],"answer":0,"explanation":"הגורם המושפע הוא התוצאה הנמדדת. כאן בודקים אם שינוי הטמפרטורה משנה את זמן ההמסה.","source":{"label":"מצגת חקר מדעי, שקופיות 5 ו־11"},"stimulus":{"type":"text","title":"זמן המסה — תרחיש לימודי","text":"לשלוש כוסות הוכנסו אותו נפח מים ואותה מסת סוכר. טמפרטורות המים היו שונות. בכל הכוסות ערבבו באותה דרך ומדדו את הזמן עד שכל הסוכר נמס."}},{"id":"inquiry-m05","concept":"inquiry.constants","difficulty":1,"prompt":"בודקים כיצד כמות האור משפיעה על גובה שתילים. איזה גורם כדאי לשמור קבוע?","choices":["סוג השתיל","כמות האור שכל קבוצה מקבלת","הגובה שיימדד בסוף הניסוי","השינוי שיחול בגובה"],"answer":0,"explanation":"סוג השתיל עשוי להשפיע על גדילתו ולכן יש לשמור עליו קבוע. כמות האור היא הגורם שמשנים, והגובה הוא התוצאה שבודקים.","source":{"label":"מצגת חקר מדעי, שקופית 5"}},{"id":"inquiry-m06","concept":"inquiry.isolation","difficulty":2,"prompt":"מדוע משנים רק גורם נבדק אחד בניסוי השוואתי פשוט?","choices":["כדי שנוכל לקשור את ההבדל בתוצאות לשינוי בגורם הנבדק","כדי להבטיח שכל הקבוצות יקבלו תוצאה זהה","כדי שלא יהיה צורך למדוד את התוצאות","כדי שההשערה תהיה נכונה בהכרח"],"answer":0,"explanation":"אם משנים כמה גורמים יחד, קשה לדעת איזה מהם תרם להבדל שנמדד. שמירת שאר התנאים דומים מאפשרת השוואה הוגנת יותר.","source":{"label":"מצגת חקר מדעי, שקופית 5"}},{"id":"inquiry-m07","concept":"inquiry.control","difficulty":2,"prompt":"איזו קבוצה מתאימה לשמש קבוצת בקרה לבדיקת השפעת הדשן?","choices":["שתילים שמקבלים אותה השקיה ואותם תנאים, ללא תוספת דשן","שתילים בלי מים ובלי אור","שתילים מסוג אחר שמקבלים דשן","השתילים הגבוהים ביותר בסוף הניסוי"],"answer":0,"explanation":"קבוצת הבקרה מאפשרת להשוות לתנאי הייחוס. כאן ההבדל הרצוי הוא תוספת הדשן בלבד, ולכן שאר התנאים צריכים להיות דומים.","source":{"label":"מצגת חקר מדעי, שקופיות 3 ו־5"},"stimulus":{"type":"text","title":"בדיקת דשן — תרחיש לימודי","text":"כיתה רוצה לבדוק אם תוספת דשן משנה את גובה השתילים לאחר שבועיים. כל השתילים מאותו סוג ובעלי גובה התחלתי דומה."}},{"id":"inquiry-m08","concept":"inquiry.repetition","difficulty":1,"prompt":"מהו היתרון העיקרי של חזרות על ניסוי באותם תנאים?","choices":["הן עוזרות לבדוק אם התוצאה עקבית ומקטינות את ההשפעה של מקרים מקריים","הן מבטיחות שההשערה נכונה","הן מחליפות את הצורך בקבוצת השוואה","הן מאפשרות להשאיר את המשתנים ללא מדידה"],"answer":0,"explanation":"חזרות מאפשרות להעריך את יציבות התוצאות. תוצאה שחוזרת בניסויים דומים משכנעת יותר מתוצאה המבוססת על מקרה יחיד.","source":{"label":"מצגת חקר מדעי, שקופית 4"}},{"id":"inquiry-m09","concept":"inquiry.systematic_error","difficulty":3,"prompt":"התלמידים חזרו על המדידה עשר פעמים באותו סרגל. מה נכון להסיק?","choices":["הטעות הקבועה בסרגל יכולה להישאר גם לאחר חזרות רבות","החזרות מבטלות בהכרח את הטעות בסרגל","רק המדידה האחרונה נכונה","אין צורך לתקן או להחליף את הסרגל"],"answer":0,"explanation":"חזרות אינן מתקנות מעצמן כלי מדידה שנותן בכל פעם תוספת קבועה. יש לזהות את הבעיה ולתקן את דרך המדידה או את הכלי.","source":{"label":"מצגת חקר מדעי, שקופית 4; הבהרה על שגיאה שיטתית: NIST","url":"https://www.itl.nist.gov/div898/handbook/mpc/section5/mpc52.htm"},"stimulus":{"type":"text","title":"בדיקת כלי מדידה — תרחיש לימודי","text":"בגלל סימון שגוי, סרגל מסוים מציג לכל עצם אורך הגדול בסנטימטר אחד מאורכו בפועל."}},{"id":"inquiry-m10","concept":"inquiry.result_conclusion","difficulty":2,"prompt":"איזה משפט מציג תוצאה שנמדדה, ולא מסקנה המסבירה קשר?","choices":["בקבוצה שקיבלה 20 מ״ל מים ביום היה הגובה הממוצע 9 ס״מ","בטווח שנבדק תוספת מים תרמה לגדילת השתילים","כמות המים היא גורם המשפיע על הגדילה","כדאי לבדוק אם אותה מגמה מתקיימת בסוג ין","נייר א ספג יותר בכל החזרות","מספיקה החזרה השנייה כדי להוכיח מה יקרה בכל תנאי אפשרי"],"answer":0,"explanation":"הבדלים קטנים בין חזרות אינם מבטלים בהכרח מגמה עקבית. בכל חזרה בטבלה הכמות שנספגה בנייר ב גדולה יותר, אך המסקנה מוגבלת לתנאי הבדיקה.","source":{"label":"מצגת חקר מדעי, שקופיות 4 ו־7"},"stimulus":{"type":"table","title":"נתונים דמיוניים לתרגול: כמויות מים שנספגו בדגימות זהות בשטחן, במ״ל","headers":["חזרה","נייר א","נייר ב"],"rows":[["1","11","17"],["2","12","18"],["3","13","19"]]}}],"tf":[{"id":"inquiry-t01","concept":"inquiry.question","difficulty":1,"prompt":"שאלת חקר ניסויית צריכה להתייחס לתופעה שאפשר לבדוק באמצעות תצפיות או מדידות.","answer":true,"explanation":"אפשר לבדוק שאלה מדעית באמצעות ראיות. בניסוי נבחרים משתנים ודרך לאסוף נתונים המתאימים לשאלה.","source":{"label":"מצגת חקר מדעי, שקופית 2"}},{"id":"inquiry-t02","concept":"inquiry.hypothesis","difficulty":1,"prompt":"השערת חקר היא עובדה שכבר הוכחה ולכן אין צורך לבדוק אותה.","answer":false,"explanation":"השערה היא תשובה אפשרית המבוססת על ידע קודם. צריך לבדוק אם התוצאות תומכות בה.","source":{"label":"מצגת חקר מדעי, שקופית 2"}},{"id":"inquiry-t03","concept":"inquiry.independent","difficulty":1,"prompt":"הגורם המשפיע בניסוי הוא הגורם שהחוקרים משנים בכוונה.","answer":true,"explanation":"משנים את הגורם המשפיע ובודקים כיצד השינוי קשור לתוצאה הנמדדת.","source":{"label":"מצגת חקר מדעי, שקופיות 5 ו־12"}},{"id":"inquiry-t04","concept":"inquiry.dependent","difficulty":1,"prompt":"הגורם המושפע חייב לקבל אותו ערך בכל קבוצות הניסוי.","answer":false,"explanation":"הגורם המושפע הוא התוצאה הנמדדת. ייתכן שיתקבלו בו ערכים שונים בעקבות שינוי הגורם המשפיע.","source":{"label":"מצגת חקר מדעי, שקופיות 5 ו־11"}},{"id":"inquiry-t05","concept":"inquiry.constants","difficulty":1,"prompt":"שמירת תנאים דומים בין קבוצות מסייעת לבודד את השפעת הגורם הנבדק.","answer":true,"explanation":"גורמים נוספים עשויים לשנות את התוצאה. שמירתם קבועים ככל האפשר מאפשרת השוואה ברורה יותר.","source":{"label":"מצגת חקר מדעי, שקופית 5"}},{"id":"inquiry-t06","concept":"inquiry.control","difficulty":1,"prompt":"קבוצת הבקרה היא תמיד הקבוצה שבה התקבלה התוצאה הגבוהה ביותר.","answer":false,"explanation":"קבוצת הבקרה נקבעת לפי תפקידה כתנאי ייחוס להשוואה, ולא לפי גובה התוצאה שלה.","source":{"label":"מצגת חקר מדעי, שקופיות 3 ו־10"}},{"id":"inquiry-t07","concept":"inquiry.repetition","difficulty":1,"prompt":"חזרות על בדיקה בתנאים דומים מאפשרות לבחון אם התוצאה עקבית.","answer":true,"explanation":"חזרות עוזרות להבחין בין דפוס שחוזר לבין תוצאה חד־פעמית או מקרית.","source":{"label":"מצגת חקר מדעי, שקופית 4"}},{"id":"inquiry-t08","concept":"inquiry.systematic_error","difficulty":3,"prompt":"חזרה פעמים רבות על מדידה בכלי פגום מבטיחה שהטעות הקבועה שלו תיעלם.","answer":false,"explanation":"טעות קבועה של כלי יכולה להופיע בכל החזרות. צריך לבדוק ולתקן את הכלי או את שיטת המדידה.","source":{"label":"מצגת חקר מדעי, שקופית 4; הבהרה: NIST","url":"https://www.itl.nist.gov/div898/handbook/mpc/section5/mpc52.htm"}},{"id":"inquiry-t09","concept":"inquiry.result_conclusion","difficulty":1,"prompt":"המשפט ״נמדד גובה של 12 ס״מ״ מתאר תוצאה.","answer":true,"explanation":"המשפט מדווח על מדידה, בלי להסביר מה גרם לה או להסיק קשר בין משתנים.","source":{"label":"מצגת חקר מדעי, שקופית 6"}},{"id":"inquiry-t10","concept":"inquiry.evidence_conclusion","difficulty":2,"prompt":"מסקנה מדעית צריכה להתבסס בעיקר על התוצאה שהחוקר קיווה לקבל.","answer":false,"explanation":"מסקנה צריכה להתבסס על התוצאות שנאספו בפועל, גם אם הן שונות מן הציפייה.","source":{"label":"מצגת חקר מדעי, שקופית 7"}},{"id":"inquiry-t11","concept":"inquiry.data_presentation","difficulty":1,"prompt":"כותרות ויחידות מידה בטבלה עוזרות להבין את משמעות התוצאות.","answer":true,"explanation":"הכותרות מזהות מה נמדד, והיחידות נותנות משמעות לכמויות המספריות.","source":{"label":"מצגת חקר מדעי, שקופית 6"}},{"id":"inquiry-t12","concept":"inquiry.confounding","difficulty":2,"prompt":"אם משנים יחד את כמות האור ואת כמות המים, אפשר תמיד לדעת מי מהם גרם לשינוי בגדילה.","answer":false,"explanation":"כששני גורמים משתנים יחד, אי אפשר לייחס את ההבדל בוודאות לאחד מהם. בניסוי פשוט יש לבודד את הגורם הנבדק.","source":{"label":"מצגת חקר מדעי, שקופית 5"}},{"id":"inquiry-t13","concept":"inquiry.hypothesis_evidence","difficulty":2,"prompt":"תוצאות שאינן תומכות בהשערה יכולות לספק מידע מדעי מועיל.","answer":true,"explanation":"הן עשויות להצביע על צורך לשנות את ההשערה, לבחון הסבר אחר או לשפר את הניסוי.","source":{"label":"מצגת חקר מדעי, שקופית 7"}},{"id":"inquiry-t14","concept":"inquiry.repetition_design","difficulty":1,"prompt":"כתיבה של אותו מספר שלוש פעמים נחשבת לשלוש חזרות ניסוי.","answer":false,"explanation":"חזרה דורשת ביצוע נוסף של הבדיקה או מדידה נוספת לפי התכנון. העתקת מספר אינה אוספת ראיה חדשה.","source":{"label":"מצגת חקר מדעי, שקופית 4"}},{"id":"inquiry-t15","concept":"inquiry.control_reference","difficulty":2,"prompt":"קבוצת השוואה יכולה להיות קבוצה בתנאים רגילים, גם כשהגורם הנבדק אינו נעדר לחלוטין.","answer":true,"explanation":"אפשר להשתמש בתנאי ייחוס מוגדרים, למשל טמפרטורת החדר, ולהשוות אליהם טיפולים אחרים.","source":{"label":"מצגת חקר מדעי, שקופית 3 — עקרון הבקרה"}},{"id":"inquiry-t16","concept":"inquiry.scope_conclusion","difficulty":2,"prompt":"בדיקה של שני סוגי נייר מספיקה כדי לקבוע איזה נייר הוא הסופג ביותר מכל הניירות בעולם.","answer":false,"explanation":"אפשר להסיק על הסוגים ועל התנאים שנבדקו. ניירות אחרים לא נכללו בהשוואה.","source":{"label":"מצגת חקר מדעי, שקופית 7"}},{"id":"inquiry-t17","concept":"inquiry.measurement","difficulty":1,"prompt":"יש להגדיר מראש כיצד מודדים את הגורם המושפע.","answer":true,"explanation":"הגדרה כמו ״גובה בסנטימטרים לאחר שבועיים״ ברורה יותר מתיאור לא מדיד כמו ״הצמח נראה טוב״.","source":{"label":"מצגת חקר מדעי, שקופיות 5–6"}},{"id":"inquiry-t18","concept":"inquiry.data_integrity","difficulty":2,"prompt":"מותר למחוק תוצאה רק מפני שהיא אינה מתאימה להשערה.","answer":false,"explanation":"צריך לתעד תוצאות ולבחון חריגות באופן ענייני. אי־התאמה להשערה אינה סיבה למחוק נתון.","source":{"label":"מצגת חקר מדעי, שקופיות 6–7"}},{"id":"inquiry-t19","concept":"inquiry.question_variables","difficulty":1,"prompt":"בשאלה ״כיצד סוג הנייר משפיע על כמות המים שנספגת בו?״, סוג הנייר הוא הגורם המשפיע.","answer":true,"explanation":"משווים בין סוגי נייר ומודדים את הכמות הנספגת. לכן סוג הנייר הוא הגורם שמשנים.","source":{"label":"מצגת חקר מדעי, שקופיות 2 ו־12"}},{"id":"inquiry-t20","concept":"inquiry.constants_vs_outcome","difficulty":2,"prompt":"בניסוי על השפעת האור על גדילה יש להכריח את כל הצמחים להגיע לאותו גובה סופי.","answer":false,"explanation":"הגובה הסופי הוא תוצאה שיש למדוד. יש לשמור על תנאים אחרים דומים, ולא לקבוע מראש את תוצאת הגדילה.","source":{"label":"מצגת חקר מדעי, שקופית 5"}},{"id":"inquiry-t21","concept":"inquiry.sequence","difficulty":1,"prompt":"לאחר ארגון התוצאות אפשר להשוות אותן להשערה ולנסח מסקנה.","answer":true,"explanation":"המסקנה נשענת על הנתונים ועונה לשאלת החקר, תוך בדיקה אם ההשערה נתמכת.","source":{"label":"מצגת חקר מדעי, שקופיות 6–8"}},{"id":"inquiry-t22","concept":"inquiry.extrapolation","difficulty":3,"prompt":"תוצאה שנמדדה בשלוש טמפרטורות היא גם מדידה של כל טמפרטורה אחרת.","answer":false,"explanation":"אפשר לשער מה יקרה בתנאי שלא נבדק, אך כדי לקבל בו תוצאה ניסויית צריך לבצע מדידה מתאימה.","source":{"label":"מצגת חקר מדעי, שקופיות 2 ו־7"}},{"id":"inquiry-t23","concept":"inquiry.measurement_timing","difficulty":2,"prompt":"בהשוואת גדילת שתילים, משך הזמן מתחילת הטיפול עשוי להיות גורם שיש לשמור קבוע.","answer":true,"explanation":"גובה תלוי גם בזמן הגדילה. אם נבדוק קבוצות לאחר זמנים שונים, יהיה קשה לייחס את ההבדל לטיפול בלבד.","source":{"label":"מצגת חקר מדעי, שקופית 5"}},{"id":"inquiry-t24","concept":"inquiry.control_identification","difficulty":1,"prompt":"אין צורך למדוד את קבוצת הבקרה, משום שכבר יודעים מה אמור לקרות בה.","answer":false,"explanation":"גם בקבוצת הבקרה אוספים נתונים. בלעדיהם אין תוצאה בפועל שאליה אפשר להשוות את הטיפול.","source":{"label":"מצגת חקר מדעי, שקופיות 3 ו־9–11"}},{"id":"inquiry-t25","concept":"inquiry.fair_comparison","difficulty":3,"prompt":"כאשר קבוצות שונות בגודלן, השוואת מספר המצליחים בלבד עלולה להטעות.","answer":true,"explanation":"יש להביא בחשבון את מספר הנבדקים בכל קבוצה. למשל, 6 מתוך 10 ו־12 מתוך 20 הם אותו שיעור הצלחה.","source":{"label":"מצגת חקר מדעי, שקופיות 9–11"}},{"id":"inquiry-t26","concept":"inquiry.graph_axes","difficulty":2,"prompt":"בגרף תוצאות אין צורך לציין מה מייצג כל ציר.","answer":false,"explanation":"שמות הצירים והיחידות מאפשרים להבין אילו משתנים מוצגים ומה משמעות הערכים.","source":{"label":"מצגת חקר מדעי, שקופית 6"}},{"id":"inquiry-t27","concept":"inquiry.repeatability","difficulty":2,"prompt":"מדידות שחזרו על עצמן בתנאים דומים עשויות להיות מעט שונות זו מזו.","answer":true,"explanation":"שונות בין דגימות ובין מדידות יכולה ליצור הבדלים קטנים. לכן בוחנים את מכלול התוצאות ואת עקביות הדפוס.","source":{"label":"מצגת חקר מדעי, שקופית 4"}},{"id":"inquiry-t28","concept":"inquiry.isolation","difficulty":2,"prompt":"שמירת כל התנאים קבועים, כולל הגורם שרוצים לבדוק, מאפשרת להשוות את השפעת שינויו.","answer":false,"explanation":"כדי לבדוק את השפעת שינויו של גורם צריך לקבוע לו ערכים שונים. את הגורמים האחרים שומרים דומים ככל האפשר.","source":{"label":"מצגת חקר מדעי, שקופית 5"}},{"id":"inquiry-t29","concept":"inquiry.result_formats","difficulty":1,"prompt":"אפשר להציג תוצאות ניסוי גם בטבלה וגם בגרף.","answer":true,"explanation":"דרכי הצגה שונות יכולות להשלים זו את זו: טבלה מציגה ערכים, וגרף עשוי להבליט דפוסים וקשרים.","source":{"label":"מצגת חקר מדעי, שקופית 6"}},{"id":"inquiry-t30","concept":"inquiry.hypothesis_vs_conclusion","difficulty":2,"prompt":"השערה ומסקנה הן אותו שלב בחקר, ולכן שתיהן נכתבות בלי להסתמך על תוצאות.","answer":false,"explanation":"השערה מנוסחת לקראת הבדיקה על בסיס ידע קודם. מסקנה מנוסחת מתוך התוצאות שנאספו ועונה לשאלת החקר.","source":{"label":"מצגת חקר מדעי, שקופיות 2 ו־7"}}],"cloze":[{"id":"inquiry-c01","title":"מתכננים בדיקה הוגנת","text":"כיתה רצתה לבדוק כיצד כמות האור משפיעה על גובה שתילים. המשפט שמנסח מה רוצים לבדוק הוא [[a]]. לפני הבדיקה הוצעה תשובה אפשרית המבוססת על ידע קודם; זו [[b]]. כמות האור ששונתה בכוונה היא [[c]], ואילו גובה השתילים שנמדד הוא [[d]]. סוג השתיל וכמות המים נשמרו זהים ולכן הם [[e]]. שמירה על תנאים אלה תוך שינוי גורם אחד בלבד נקראת [[f]]. קבוצה שגודלה בתנאי הייחוס שימשה [[g]]. ביצוע הבדיקה שוב בתנאים דומים מוסיף [[h]] ועוזר לבחון את עקביות הממצאים.","blanks":[{"key":"a","answer":"שאלת החקר","concept":"inquiry.question","explanation":"שאלת החקר מנסחת את הקשר שרוצים לבדוק."},{"key":"b","answer":"השערה","concept":"inquiry.hypothesis","explanation":"השערה היא תשובה אפשרית ומנומקת שנבחנת במחקר."},{"key":"c","answer":"הגורם המשפיע","concept":"inquiry.independent","explanation":"כמות האור היא המשתנה ששינו בכוונה."},{"key":"d","answer":"הגורם המושפע","concept":"inquiry.dependent","explanation":"גובה השתילים הוא התוצאה הנמדדת."},{"key":"e","answer":"גורמים קבועים","concept":"inquiry.constants","explanation":"סוג השתיל וכמות המים נשמרים זהים כדי לצמצם הסברים חלופיים."},{"key":"f","answer":"בידוד משתנים","concept":"inquiry.isolation","explanation":"בידוד משתנים מאפשר לבדוק גורם אחד כאשר התנאים האחרים דומים."},{"key":"g","answer":"קבוצת בקרה","concept":"inquiry.control","explanation":"הבקרה מספקת תנאי ייחוס להשוואה."},{"key":"h","answer":"חזרות","concept":"inquiry.repetition","explanation":"חזרות מאפשרות לבחון אם דפוס התוצאות עקבי."}],"distractors":["מסקנה סופית","מכשיר מדידה","תוצאה רצויה"],"source":{"label":"מצגת חקר מדעי, שקופיות 2–7"}},{"id":"inquiry-c02","title":"מהמדידה למסקנה","text":"בתרגיל לימודי בדקו כיצד סוג הנייר משנה את כמות המים שהוא סופג. בין הקבוצות שינו את [[a]], ואת הכמות הנספגת מדדו באמצעות [[b]] המסומן בשנתות. את המספרים שנמדדו ארגנו ב־[[c]], ולצדם ציינו [[d]] כדי שיהיה ברור אם מדובר במיליליטרים. המספרים שנאספו בפועל הם [[e]]. אחר כך ניסחו [[f]] שענתה לשאלה והסתמכה על המדידות. כאשר הממצאים שונים מן הצפוי, צריך לבדוק אם הם תומכים ב־[[g]] שהוצעה מראש. הטענה הסופית צריכה להיות מוגבלת ל־[[h]] שנבדקו בפועל.","blanks":[{"key":"a","answer":"סוג הנייר","concept":"inquiry.independent","explanation":"סוג הנייר הוא הגורם ששינו בבדיקה."},{"key":"b","answer":"כלי מדידה","concept":"inquiry.measurement","explanation":"כלי מתאים בעל שנתות מאפשר למדוד נפח באופן מוגדר."},{"key":"c","answer":"טבלה","concept":"inquiry.data_presentation","explanation":"טבלה מארגנת את הערכים כדי שיהיה קל להשוות ביניהם."},{"key":"d","answer":"יחידות מידה","concept":"inquiry.data_presentation","explanation":"יחידות מעניקות משמעות למספרים המייצגים כמויות."},{"key":"e","answer":"התוצאות","concept":"inquiry.result_conclusion","explanation":"תוצאות הן המדידות והתצפיות שנאספו."},{"key":"f","answer":"מסקנה","concept":"inquiry.evidence_conclusion","explanation":"המסקנה עונה לשאלת החקר על בסיס התוצאות."},{"key":"g","answer":"השערה","concept":"inquiry.hypothesis_evidence","explanation":"משווים בין ההשערה המוקדמת לבין הנתונים שנאספו."},{"key":"h","answer":"התנאים והחומרים","concept":"inquiry.scope_conclusion","explanation":"אין להרחיב מסקנה באופן אוטומטי לחומרים או לתנאים שלא נבדקו."}],"distractors":["שמות החוקרים","קבוצת בקרה","הציפיות בלבד"],"source":{"label":"מצגת חקר מדעי, שקופיות 2 ו־5–7"}},{"id":"inquiry-c03","title":"בודקים את איכות הניסוי","text":"כדי להשוות את השפעת הדשן על גדילת שתילים, נבחרו שתילים מאותו [[a]]. לכל הקבוצות ניתנה אותה כמות [[b]], והן הוצבו בתנאי אור דומים. בכל קבוצה השתנתה רק כמות [[c]]. לאחר אותו משך זמן מדדו את [[d]] בסנטימטרים. קבוצה ללא תוספת טיפול שימשה [[e]] להשוואה. הבדיקה בוצעה כמה פעמים כדי לבחון את [[f]] של התוצאות. נתון חריג נשמר ברישום ונבדק אם הייתה [[g]] בדרך המדידה. לבסוף נכתבה מסקנה שהתבססה על [[h]] שנאספו, גם אם לא התאימו לציפייה המוקדמת.","blanks":[{"key":"a","answer":"סוג","concept":"inquiry.constants","explanation":"סוג השתיל עשוי להשפיע על הגדילה ולכן נשמר קבוע."},{"key":"b","answer":"מים","concept":"inquiry.constants","explanation":"בניסוי על דשן שומרים את ההשקיה דומה בין הקבוצות."},{"key":"c","answer":"הדשן","concept":"inquiry.independent","explanation":"כמות הדשן היא הגורם ששינו בכוונה."},{"key":"d","answer":"גובה השתילים","concept":"inquiry.dependent","explanation":"גובה השתילים הוא הגורם המושפע הנמדד."},{"key":"e","answer":"בקרה","concept":"inquiry.control","explanation":"הקבוצה ללא תוספת הדשן משמשת תנאי ייחוס להשוואה."},{"key":"f","answer":"העקביות","concept":"inquiry.repetition","explanation":"חזרות מאפשרות לבדוק אם הדפוס חוזר בתנאים דומים."},{"key":"g","answer":"תקלה","concept":"inquiry.data_integrity","explanation":"בודקים אם הייתה תקלה במקום למחוק תוצאה רק מפני שהיא חריגה."},{"key":"h","answer":"הנתונים","concept":"inquiry.evidence_conclusion","explanation":"המסקנה מבוססת על הראיות שנאספו בפועל."}],"distractors":["ניחוש","צבע העלים","מסקנה"],"source":{"label":"מצגת חקר מדעי, שקופיות 3–7"}}],"open":[{"id":"inquiry-o01","concept":"inquiry.experiment_design","prompt":"רוצים לבדוק כיצד כמות האור משפיעה על גובה שתילים. נסחו שאלת חקר, ציינו את הגורם המשפיע ואת הגורם המושפע, והציעו שני גורמים שיישמרו קבועים.","modelAnswer":"שאלת החקר: כיצד מספר שעות האור ביום משפיע על גובה שתילים לאחר שבועיים? הגורם המשפיע הוא מספר שעות האור, והמושפע הוא הגובה לאחר שבועיים. נשמור על אותו סוג שתיל ועל כמות מים יומית זהה; רצוי גם גובה התחלתי דומה ואותם תנאי קרקע.","keyPoints":["שאלה הקושרת בין כמות אור לבין גובה במועד מוגדר","זיהוי נכון: האור משתנה והגובה נמדד","לפחות שני גורמים קבועים רלוונטיים"],"source":{"label":"מצגת חקר מדעי, שקופיות 2 ו־5"}},{"id":"inquiry-o02","concept":"inquiry.confounding","prompt":"קבוצה אחת של שתילים הונחה באור וקיבלה הרבה מים. קבוצה אחרת הונחה בחושך וקיבלה מעט מים. מדוע הניסוי אינו מאפשר לבודד את השפעת האור, וכיצד תשפרו אותו?","modelAnswer":"שונו יחד שני גורמים: כמות האור וכמות המים. אם יהיה הבדל בגדילה לא נוכל לדעת אם הוא נובע מהאור, מהמים או משילוב ביניהם. כדי לבדוק את האור נשנה רק את כמות האור ונשמור על אותה השקיה ועל שאר התנאים דומים.","keyPoints":["זיהוי שני הגורמים שהשתנו יחד","הסבר שאי אפשר לייחס את ההבדל לאור לבדו","הצעת השקיה זהה ושינוי האור בלבד"],"source":{"label":"מצגת חקר מדעי, שקופית 5"}},{"id":"inquiry-o03","concept":"inquiry.control","prompt":"בבדיקת השפעת דשן על גובה שתילים, למה צריך להשוות גם לשתילים שלא קיבלו תוספת דשן? ציינו תנאי אחד שצריך להיות דומה בין הקבוצות.","modelAnswer":"השתילים ללא תוספת הדשן מספקים קבוצת בקרה. הם מאפשרים לבדוק אם הגובה בקבוצות שקיבלו דשן שונה מהגובה בתנאי הייחוס. כדי שההשוואה תהיה הוגנת, יש לשמור למשל על אותו סוג שתיל ועל השקיה דומה.","keyPoints":["זיהוי הקבוצה ללא תוספת דשן כבקרה","הסבר תפקיד הבקרה כתנאי ייחוס להשוואה","תנאי קבוע רלוונטי כגון השקיה או סוג שתיל"],"source":{"label":"מצגת חקר מדעי, שקופיות 3 ו־5"}},{"id":"inquiry-o04","concept":"inquiry.evidence_conclusion","prompt":"בבדיקה לימודית של דגימות נייר שוות בשטחן, נייר א ספג בממוצע 12 מ״ל מים ונייר ב ספג 18 מ״ל. נסחו מסקנה מנומקת וציינו דבר אחד שלא ניתן להסיק מן הבדיקה.","modelAnswer":"בתנאי הבדיקה נייר ב ספג יותר מים מנייר א, משום שנמדדו בו 18 מ״ל בממוצע לעומת 12 מ״ל. אי אפשר להסיק שהוא הנייר הסופג ביותר בעולם, משום שנבדקו רק שני הסוגים האלה בתנאים מסוימים.","keyPoints":["מסקנה שלפיה ב ספג יותר בתנאים שנבדקו","שימוש בשני הערכים כתמיכה במסקנה","הגבלה מפורשת: לא להסיק על סוגים או תנאים שלא נבדקו"],"source":{"label":"מצגת חקר מדעי, שקופיות 6–7"}},{"id":"inquiry-o05","concept":"inquiry.repetition","prompt":"מדוע כדאי לבצע כמה חזרות על ניסוי? האם חזרות לבדן מתקנות סרגל שנותן בכל פעם אורך הגדול בסנטימטר מן האורך האמיתי? הסבירו.","modelAnswer":"חזרות מאפשרות לבדוק אם התוצאה עקבית ולהקטין את השפעתם של מקרים מקריים. הן אינן מתקנות מעצמן טעות קבועה: הסרגל יוסיף סנטימטר גם בכל חזרה. לכן יש לבדוק ולתקן את הכלי או להשתמש בכלי תקין.","keyPoints":["חזרות בודקות עקביות ומצמצמות השפעת מקרים מקריים","הטעות הקבועה יכולה להישאר בכל חזרה","נדרש טיפול בכלי או בשיטת המדידה"],"source":{"label":"מצגת חקר מדעי, שקופית 4; הבהרה: NIST","url":"https://www.itl.nist.gov/div898/handbook/mpc/section5/mpc52.htm"}},{"id":"inquiry-o06","concept":"inquiry.hypothesis_vs_conclusion","prompt":"הסבירו את ההבדל בין השערה, תוצאה ומסקנה בעזרת דוגמה של בדיקת ספיגת מים בשני סוגי נייר.","modelAnswer":"השערה היא תחזית לפני הבדיקה, למשל שנייר ב יספוג יותר מים מנייר א. התוצאות הן המדידות בפועל, למשל 18 מ״ל לעומת 12 מ״ל בבדיקה לימודית. המסקנה היא שבאותם תנאים נייר ב ספג יותר, ולכן הנתונים האלה תומכים בהשערה.","keyPoints":["השערה היא תשובה אפשרית לפני הבדיקה","תוצאה היא תצפית או מדידה שנאספה בפועל","מסקנה מפרשת את התוצאות ועונה לשאלת החקר"],"source":{"label":"מצגת חקר מדעי, שקופיות 2 ו־6–7"}}]}];</script><script>(function(root){

function weighted(pool,stats,rng){let sum=pool.reduce((s,x)=>s+(stats[x.id]?.weight||1),0),u=rng()*sum;for(const x of pool){u-=stats[x.id]?.weight||1;if(u<0)return x;}return pool[pool.length-1];}

function createSession(bank,state,{mode='exam',topic=null}={},rng=Math.random){const index=indexBank(bank),topics=topic?[topic]:Object.keys(TOPICS),focused=!!topic;const session={id:'s-'+Date.now()+'-'+Math.floor(rng()*1e9),createdAt:new Date().toISOString(),mode,focused,topics,mcq:[],tf:[],cloze:[],open:[],answers:{},graded:{},openAnswers:{},selfChecks:{},revealed:{},cursor:{section:'mcq',index:0},submitted:false};const used=new Set();for(const t of topics){const p=bank.find(x=>x.topic===t);for(const kind of ['mcq','tf']){const chosen=sample(p[kind],focused?10:5,state.stats,rng,used,true);session[kind].push(...chosen.map(q=>({id:q.id,...(kind==='mcq'?{order:shuffle([0,1,2,3],rng)}:{})})));}const passageCounts={};for(const h of state.history)for(const id of (h.clozeIds||[]))passageCounts[id]={seen:(passageCounts[id]?.seen||0)+1};const psg=sample(p.cloze,1,passageCounts,rng)[0];const blanks=sample(psg.blanks.map(b=>({...b,id:psg.id+':'+b.key})),5,state.stats,rng);session.cloze.push({id:psg.id,hiddenKeys:blanks.map(b=>b.key),words:shuffle([...blanks.map(b=>b.answer),...psg.distractors],rng)});}

function results(s,index){const topics={},types={mcq:{correct:0,total:0},blank:{correct:0,total:0},tf:{correct:0,total:0}};let correct=0,total=0;for(const id of objectiveIds(s)){const q=index[id],ok=!!s.graded[id]?.correct;topics[q.topic]??={correct:0,total:0};topics[q.topic].total++;topics[q.topic].correct+=Number(ok);types[q.type].total++;types[q.type].correct+=Number(ok);total++;correct+=Number(ok);}return {correct,total,score:Math.round(100*correct/total),topics,types};}

function exportProgress(state){return {app:'science-grade8',schema:SCHEMA,bankVersion:VERSION,exportedAt:new Date().toISOString(),stats:state.stats,history:state.history};}

if(Array.isArray(data.history))next.history=data.history.slice(0,100).filter(h=>h&&typeof h.id==='string'&&typeof h.date==='string'&&Number.isInteger(h.score)&&h.score>=0&&h.score<=100&&Number.isInteger(h.total)&&h.total>0&&h.total<=100&&Number.isInteger(h.correct)&&h.correct>=0&&h.correct<=h.total).map(h=>({id:h.id.slice(0,100),date:h.date.slice(0,40),mode:h.mode==='exam'?'exam':'practice',focused:!!h.focused,score:h.score,correct:h.correct,total:h.total,clozeIds:Array.isArray(h.clozeIds)?h.clozeIds.filter(id=>index[id]?.type==='cloze'):[],openIds:Array.isArray(h.openIds)?h.openIds.filter(id=>index[id]?.type==='open'):[]}));return next;}
function validateBank(bank){const ids=new Set(),errors=[];for(const p of bank){if(!TOPICS[p.topic])errors.push('topic '+p.topic);for(const kind of ['mcq','tf','cloze','open'])for(const q of p[kind]||[]){if(ids.has(q.id))errors.push('duplicate '+q.id);ids.add(q.id);if(!q.source?.label)errors.push('source '+q.id);if(kind==='mcq'&&(q.choices?.length!==4||new Set(q.choices).size!==4||!Number.isInteger(q.answer)||q.answer<0||q.answer>3))errors.push('choices '+q.id);if(kind==='tf'&&typeof q.answer!=='boolean')errors.push('tf '+q.id);if(kind==='cloze'){const keys=[...q.text.matchAll(/\[\[([^\]]+)\]\]/g)].map(x=>x[1]);if(keys.length!==8||q.blanks.length!==8||new Set(keys).size!==8||!q.blanks.every(b=>keys.includes(b.key)))errors.push('blanks '+q.id);if(new Set([...q.blanks.map(b=>b.answer),...q.distractors]).size!==q.blanks.length+q.distractors.length)errors.push('word ambiguity '+q.id);}}}if(errors.length)throw new Error(errors.join('\n'));return true;}

function warning(){return storageWarning?'<div class="save-warning" role="alert">השמירה בדפדפן אינה זמינה או שקובץ השמירה לא נקרא. אפשר להמשיך לתרגל ולייצא התקדמות מההגדרות לפני סגירה.</div>':'';}
function stimulus(s){if(!s)return '';let body='';if(s.type==='text')body=`<p>${esc(s.text)}</p>`;else if(s.type==='table')body=`<div class="table-scroll"><table><thead><tr>${s.headers.map(h=>`<th scope="col">${esc(h)}</th>`).join('')}</tr></thead><tbody>${s.rows.map(row=>`<tr>${row.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;else if(s.type==='flow')body=`<div class="flow">${s.nodes.map((n,i)=>`${i?'<span class="flow-arrow" aria-hidden="true">←</span>':''}<span class="flow-node">${esc(n)}</span>`).join('')}</div>`;else if(s.type==='periodic')body=`<div class="elements">${s.cells.map(c=>`<div class="element"><div class="atomic-no">${esc(c.number)}</div><b>${esc(c.symbol)}</b><span dir="rtl">${esc(c.name)}</span><small dir="rtl">קבוצה ${esc(c.group)} · מחזור ${esc(c.period)}</small></div>`).join('')}</div>`;else if(s.type==='atom'){let particles='';for(let i=0;i<s.electrons;i++){const a=2*Math.PI*i/s.electrons;particles+=`<circle cx="${95+67*Math.cos(a)}" cy="${90+67*Math.sin(a)}" r="4" fill="#476fc0"/>`;}for(let i=0;i<s.protons+s.neutrons;i++){const a=i*2.39996,r=4*Math.sqrt(i);particles+=`<circle cx="${95+r*Math.cos(a)}" cy="${90+r*Math.sin(a)}" r="4.5" fill="${i<s.protons?'#c66c77':'#8797aa'}" stroke="#fff" stroke-width=".7"/>`;}body=`<div class="atom-figure"><svg viewBox="0 0 190 180" role="img" aria-label="תרשים סכמטי של אטום: ${s.protons} פרוטונים, ${s.neutrons} נייטרונים ו־${s.electrons} אלקטרונים"><circle cx="95" cy="90" r="78" fill="#eaf0fc"/><circle cx="95" cy="90" r="67" fill="none" stroke="#b7c8e9" stroke-dasharray="3 5"/>${particles}</svg><div class="atom-legend"><div><span class="dot" style="background:#c66c77"></span>פרוטונים: ${s.protons}</div><div><span class="dot" style="background:#8797aa"></span>נייטרונים: ${s.neutrons}</div><div><span class="dot" style="background:#476fc0"></span>אלקטרונים: ${s.electrons}</div></div></div>`;}
return `<div class="stimulus">${s.title?`<h3>${esc(s.title)}</h3>`:''}${body}${s.type==='atom'?'<p class="caption">תרשים סכמטי בלבד, לא בקנה מידה. הנקודות הכחולות אינן מסלול התנועה של האלקטרונים.</p>':''}${s.caption?`<p class="caption">${esc(s.caption)}</p>`:''}</div>`;}
function current(){const s=state.active;const sec=s.cursor.section;s.cursor.index=Math.max(0,Math.min(s[sec].length-1,s.cursor.index));return {s,sec,pos:s.cursor.index,entry:s[sec][s.cursor.index],q:index[s[sec][s.cursor.index].id]};}
function isEntryAnswered(s,sec,entry){if(sec==='cloze')return entry.hiddenKeys.every(k=>E.answered(s,entry.id+':'+k));if(sec==='open')return !!s.openAnswers[entry.id]?.trim();return E.answered(s,entry.id);}
function sidebar(s,sec,pos){const ids=E.objectiveIds(s),done=ids.filter(id=>E.answered(s,id)).length;return `<aside class="sidebar" aria-label="ניווט בתרגול"><h3>${s.submitted?'עיון בפתרונות':'המבחן שלך'}</h3><nav class="sections">${Object.entries(names).map(([k,n])=>`<button class="section-tab ${k===sec?'active':''}" data-action="section" data-section="${k}" ${k===sec?'aria-current="step"':''}>${n}<small>${s[k].filter(e=>isEntryAnswered(s,k,e)).length}/${s[k].length}${k==='cloze'?' פסקאות':''}</small></button>`).join('')}</nav><div class="number-grid">${s[sec].map((x,i)=>`<button class="number ${isEntryAnswered(s,sec,x)?'answered':''} ${i===pos?'current':''} ${s.flags?.[x.id]?'flagged':''}" data-action="jump" data-index="${i}" aria-label="${sec==='cloze'?'פסקה':'שאלה'} ${i+1}${s.flags?.[x.id]?', מסומנת לחזרה':''}">${i+1}</button>`).join('')}</div><div class="progress-label"><span>פריטים שנענו</span><span>${done}/${ids.length}</span></div><div class="progress-track"><span style="width:${100*done/ids.length}%"></span></div><div class="legend" style="margin-top:10px">ירוק: נענתה · נקודה צהובה: לחזרה<br>שאלות פתוחות אינן חלק מהציון.</div><button class="btn ${s.submitted?'secondary':'primary'}" data-action="${s.submitted?'results':'submit'}">${s.submitted?'חזרה לתוצאות':'סיום ובדיקת התשובות'}</button></aside>`;}
function feedback(q,s){const g=s.graded[q.id];if(!g)return '';const right=q.type==='mcq'?q.choices[q.answer]:q.answer?'נכון':'לא נכון';return `<div class="feedback ${g.correct?'':'incorrect'}" role="status"><b>${g.correct?'נכון, כל הכבוד!':'כדאי לזכור לפעם הבאה'}</b>${g.correct?'':`<p>התשובה הנכונה: <strong>${esc(right)}</strong></p>`}<p>${esc(q.explanation)}</p>${source(q)}</div>`;}
function questionBody(q,entry,s){const g=s.graded[q.id],locked=!!g,answer=s.answers[q.id];const opts=q.type==='mcq'?entry.order.map((v,i)=>({value:v,text:q.choices[v],letter:['א','ב','ג','ד'][i]})):[{value:true,text:'נכון',letter:'✓'},{value:false,text:'לא נכון',letter:'×'}];return `${stimulus(q.stimulus)}<h2>${esc(q.prompt)}</h2><div class="choice-list" role="group" aria-label="אפשרויות תשובה">${opts.map((o,i)=>`<button id="choice-${i}" class="choice ${answer===o.value?'selected':''} ${locked&&o.value===q.answer?'correct':''} ${locked&&answer===o.value&&!g.correct?'wrong':''}" data-action="answer" data-value="${o.value}" aria-pressed="${answer===o.value}" ${locked?'disabled':''}><span class="letter">${o.letter}</span><span>${esc(o.text)}</span>${locked&&o.value===q.answer?'<span class="answer-tag">התשובה הנכונה</span>':''}</button>`).join('')}</div>${feedback(q,s)}`;}
function clozeBody(q,entry,s){const keys=entry.hiddenKeys,locked=keys.every(k=>s.graded[q.id+':'+k]);if(!activeGap||!keys.includes(activeGap))activeGap=q.blanks.filter(b=>keys.includes(b.key)).find(b=>!E.answered(s,q.id+':'+b.key))?.key||q.blanks.find(b=>keys.includes(b.key)).key;let counter=0;const text=esc(q.text).replace(/\[\[([^\]]+)\]\]/g,(_,key)=>{const b=q.blanks.find(x=>x.key===key);if(!keys.includes(key))return esc(b.answer);counter++;const id=q.id+':'+key,g=s.graded[id],a=s.answers[id];return `<button id="gap-${esc(key)}" class="gap ${activeGap===key&&!locked?'active':''} ${a?'filled':''} ${g?(g.correct?'correct':'wrong'):''}" data-action="gap" data-key="${esc(key)}" ${locked?'disabled':''} aria-label="השלמה ${counter}: ${esc(a||'בחרו מילה')}"><small>${counter}</small>${esc(a||'בחרו מילה')}</button>`;});const used=keys.map(k=>s.answers[q.id+':'+k]);return `<h2>${esc(q.title)}</h2><p class="small muted">חמש השלמות מתוך מחסן מילים. במחסן יש גם שלושה מסיחים.</p><div class="cloze-text">${text}</div>${!locked?`<div class="word-bank"><h3>מחסן מילים</h3><p class="small muted">בחרו מקום ריק ואז מילה. אפשר לשנות תשובה עד הבדיקה.</p><div class="words">${entry.words.map((w,i)=>`<button id="word-${i}" class="word ${used.includes(w)?'used':''}" data-action="word" data-word-index="${i}" ${used.includes(w)?'disabled':''}>${esc(w)}</button>`).join('')}</div><button class="text-button small" style="margin-top:13px" data-action="clear-gap" ${s.answers[q.id+':'+activeGap]?'':'disabled'}>ניקוי ההשלמה המסומנת</button></div>`:`<div class="feedback ${keys.every(k=>s.graded[q.id+':'+k].correct)?'':'incorrect'}" role="status"><b>${keys.filter(k=>s.graded[q.id+':'+k].correct).length} מתוך 5 השלמות נכונות</b><div class="cloze-feedback">${q.blanks.filter(b=>keys.includes(b.key)).map(b=>`<p>${s.graded[q.id+':'+b.key].correct?'✓':'↺'} <strong>${esc(b.answer)}</strong> — ${esc(b.explanation)}</p>`).join('')}</div>${source(q)}</div>`}`;}
function openBody(q,s){const allowed=s.mode==='practice'||s.submitted,revealed=!!s.revealed[q.id];return `${stimulus(q.stimulus)}<h2>${esc(q.prompt)}</h2><p class="small muted">ניסוח עצמי, בלי ציון אוטומטי. נסו להסביר במילים שלכם לפני פתיחת הדוגמה.</p><label class="sr-only" for="open-answer">התשובה שלי</label><textarea id="open-answer" class="open-answer" data-open-id="${esc(q.id)}" placeholder="התשובה שלי…" maxlength="5000">${esc(s.openAnswers[q.id]||'')}</textarea>${allowed?`<button class="btn secondary" style="margin-top:14px" data-action="reveal">${revealed?'הסתרת תשובת הדוגמה':'פתיחת תשובת דוגמה'}</button>`:'<p class="small muted" style="margin-top:14px">תשובת הדוגמה תיפתח לאחר הגשת המבחן.</p>'}${allowed&&revealed?`<div class="open-model"><h3>תשובת דוגמה</h3><p>${esc(q.modelAnswer)}</p><h3 style="margin-top:18px">בדיקה עצמית: האם התייחסתי ל…</h3>${q.keyPoints.map((p,i)=>`<label class="check-point"><input type="checkbox" data-check-id="${esc(q.id)}" data-check-index="${i}" ${s.selfChecks[q.id]?.[i]?'checked':''}><span>${esc(p)}</span></label>`).join('')}${source(q)}<p class="small muted">הסימון הוא בשבילך ואינו משנה את הציון.</p></div>`:''}`;}
function session(){const{s,sec,pos,entry,q}=current();const locked=sec==='cloze'?entry.hiddenKeys.every(k=>s.graded[q.id+':'+k]):!!s.graded[q.id];const canCheck=sec==='cloze'?entry.hiddenKeys.every(k=>E.answered(s,q.id+':'+k)):E.answered(s,q.id);const final=sec==='open'&&pos===s.open.length-1;return `<main id="main" tabindex="-1" class="container">${warning()}<div class="session-top"><div><span class="badge">${s.submitted?'פתרונות והסברים':s.mode==='exam'?'מצב מבחן':'מצב תרגול'}</span> <span class="small muted">${s.focused?E.TOPICS[s.topics[0]]:'כל ארבעת הנושאים'}</span></div><button class="btn ghost small" data-action="home">${icon('home',17)} לבית</button></div><div class="session-layout"><section class="question-panel"><div class="question-meta"><span style="color:${meta[q.topic].color}">${E.TOPICS[q.topic]}</span><span>·</span><span>${sec==='cloze'?'פסקה':'שאלה'} ${pos+1} מתוך ${s[sec].length}</span>${q.difficulty?`<span class="difficulty" aria-label="רמת קושי ${q.difficulty}">${[1,2,3].map(x=>`<i class="${x<=q.difficulty?'on':''}"></i>`).join('')}</span>`:''}<button class="flag ${s.flags?.[q.id]?'active':''}" style="margin-right:auto" data-action="flag" aria-pressed="${!!s.flags?.[q.id]}">${icon('flag',16)} ${s.flags?.[q.id]?'מסומנת':'לחזרה'}</button></div>${sec==='cloze'?clozeBody(q,entry,s):sec==='open'?openBody(q,s):questionBody(q,entry,s)}<div class="question-actions"><button class="btn secondary" data-action="prev" ${sec==='mcq'&&pos===0?'disabled':''}>הקודמת</button>${s.mode==='practice'&&!s.submitted&&sec!=='open'&&!locked?`<button class="btn primary" data-action="check" ${!canCheck?'disabled':''}>${sec==='cloze'?'בדיקת הפסקה':'בדיקת תשובה'}</button>`:`<button class="btn primary" data-action="${final?(s.submitted?'results':'submit'):'next'}">${final?(s.submitted?'חזרה לתוצאות':'סיום ובדיקה'):'הבאה'} ${!final?icon('arrow',17):''}</button>`}</div>${s.mode==='practice'&&!locked&&sec!=='open'?'<div style="text-align:left;margin-top:8px"><button class="text-button small" data-action="next">לדלג בינתיים</button></div>':''}</section>${sidebar(s,sec,pos)}</div><div class="session-mobile-footer"><button class="btn secondary" data-action="navigator">מפת השאלות</button><button class="btn secondary" data-action="${s.submitted?'results':'submit'}">${s.submitted?'לתוצאות':'סיום ובדיקה'}</button></div><footer><span>ההתקדמות נשמרת אוטומטית בדפדפן הזה.</span><span>${s.mode==='exam'&&!s.submitted?'הפתרונות יוצגו לאחר ההגשה.':'רק התשובה הראשונה נחשבת לציון.'}</span></footer></main>`;}
function answerText(q,v){return v===null||v===undefined?'לא נענתה':q.type==='mcq'?q.choices[v]:q.type==='tf'?(v?'נכון':'לא נכון'):String(v);}
function results(){const s=state.active,r=E.results(s,index),wrong=E.objectiveIds(s).filter(id=>!s.graded[id]?.correct),sorted=Object.entries(r.topics).sort((a,b)=>a[1].correct/a[1].total-b[1].correct/b[1].total);const rec=sorted.filter(([,v])=>v.correct<v.total).slice(0,3);const review=reviewAll?E.objectiveIds(s):wrong;return `<main id="main" tabindex="-1" class="container">${warning()}<section class="results-hero"><div class="score-ring" style="--score:${r.score}"><div class="score-inner"><strong>${r.score}</strong><small>מתוך 100</small></div></div><div class="eyebrow" style="justify-content:center">${s.mode==='exam'?'המבחן הושלם':'התרגול הושלם'}</div><h1>${r.score===100?'כל התשובות נכונות!':r.score>=80?'יש לך בסיס טוב להמשיך ממנו.':'עכשיו יודעים במה להתמקד.'}</h1><p>${r.correct} תשובות נכונות מתוך ${r.total} · הציון מבוסס על הניסיון הראשון</p><p class="small">שלוש השאלות הפתוחות נבדקות באופן עצמי ואינן חלק מהציון.</p><div class="action-row"><button class="btn primary" data-action="section" data-section="open">תרגול ניסוח: 3 שאלות ${icon('arrow',17)}</button><button class="btn secondary" data-action="start" data-mode="exam">מבחן חדש</button><button class="btn ghost" data-action="home">לדף הבית</button></div></section><div class="result-grid"><section class="panel"><h3>הצלחה לפי נושא</h3>${Object.entries(r.topics).map(([t,v])=>`<div class="result-row"><div><b>${E.TOPICS[t]}</b><div class="topic-meter" style="width:180px;--accent:${meta[t].color}"><span style="width:${100*v.correct/v.total}%"></span></div></div><span>${v.correct}/${v.total} · <b>${Math.round(100*v.correct/v.total)}%</b></span></div>`).join('')}<div class="small muted" style="margin-top:16px">${Object.entries(r.types).map(([t,v])=>`${t==='blank'?'קלוז':names[t]}: ${v.correct}/${v.total}`).join(' · ')}</div></section><section class="panel"><h3>על מה כדאי לחזור?</h3>${rec.length?rec.map(([t,v])=>{const qs=wrong.map(id=>index[id]).filter(q=>q.topic===t);const sources=[...new Set(qs.map(q=>q.source?.label).filter(Boolean))].slice(0,2);return `<div class="recommendation"><strong>${E.TOPICS[t]}</strong><p>${esc(qs[0]?.explanation||'חזרו על ההסברים לשאלות בנושא הזה.')}</p><div class="source">לחזרה: ${sources.map(esc).join(' · ')}</div><button class="text-button small" style="margin-top:7px" data-action="start" data-mode="practice" data-topic="${t}">תרגול ממוקד בנושא</button></div>`;}).join(''):'<p>כל הכבוד. נסו להסביר את הרעיונות במילים שלכם בשלוש השאלות הפתוחות, ובהמשך תרגלו סט חדש.</p>'}</section></div><section class="review-list"><div class="section-heading"><h2>${reviewAll?'כל התשובות וההסברים':'לומדים מהטעויות'}</h2><button class="text-button small" data-action="review-toggle">${reviewAll?'רק טעויות':'הצגת כל התשובות'}</button></div>${review.length?review.map(id=>{const q=index[id],g=s.graded[id];return `<details class="review-item"><summary>${g.correct?'✓':'↺'} ${q.type==='blank'?`השלמה בקלוז: ${esc(index[id.split(':')[0]].title)} — ${esc(q.answer)}`:esc(q.prompt)}</summary>${q.type==='blank'?`<div class="stimulus"><p>${esc(index[id.split(':')[0]].text).replace(/\[\[([^\]]+)\]\]/g,(_,k)=>esc(index[id.split(':')[0]].blanks.find(b=>b.key===k).answer))}</p></div>`:stimulus(q.stimulus)}<p>התשובה שלך: <strong>${esc(answerText(q,g.answer))}</strong></p><p>התשובה הנכונה: <strong>${esc(answerText(q,q.answer))}</strong></p><p>${esc(q.explanation)}</p>${source(q)}</details>`;}).join(''):'<div class="panel">לא היו טעויות בתרגול הזה.</div>'}</section><footer><span>חזרה על שאלה אחרי קריאת ההסבר אינה משנה את הציון המקורי.</span><button class="text-button" data-action="settings">ייצוא ההתקדמות</button></footer></main>`;}
function render(){const before=document.activeElement,fid=before?.id,action=before?.dataset?.action;root.innerHTML=header()+(page==='home'?home():page==='results'?results():session());if(action==='word')root.querySelector('.gap.active')?.focus({preventScroll:true});else if(action==='check')root.querySelector('[data-action=next]')?.focus({preventScroll:true});else if(fid)document.getElementById(fid)?.focus({preventScroll:true});}
function navigateTop(){render();document.getElementById('main')?.focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});}
function modal(title,body,actions=''){modalReturn=document.activeElement;modalRoot.innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div style="display:flex;justify-content:space-between;align-items:center;gap:15px"><h2 id="modal-title">${title}</h2><button class="btn ghost" style="padding:4px;min-height:30px" data-action="close-modal" aria-label="סגירה">${icon('close',21)}</button></div>${body}${actions?`<div class="modal-actions">${actions}</div>`:''}</section></div>`;modalRoot.querySelector('button')?.focus();}
function closeModal(){modalRoot.innerHTML='';modalReturn?.focus?.();}
function start(mode,topic){const run=()=>{state.active=E.createSession(bank,state,{mode,topic});activeGap=null;save();page='session';closeModal();navigateTop();};if(state.active&&!state.active.submitted){pendingAction=run;modal('להתחיל תרגול חדש?','<p>יש תרגול שעדיין לא הוגש. פתיחת תרגול חדש תחליף אותו. תשובות שכבר נבדקו במצב תרגול נשארות בהתקדמות המצטברת.</p>','<button class="btn secondary" data-action="close-modal">להמשיך בתרגול הקיים</button><button class="btn primary" data-action="confirm-pending">להתחיל חדש</button>');}else run();}
let pendingAction=null;
function submit(){const s=state.active;if(s.submitted){page='results';navigateTop();return;}const missing=E.objectiveIds(s).filter(id=>!E.answered(s,id)).length;pendingAction=()=>{E.finish(state,s,index);save();closeModal();page='results';reviewAll=false;navigateTop();};modal('לסיים ולבדוק?',`<p>${missing?`נותרו <strong>${missing} פריטים ללא תשובה</strong>. בהגשה הם ייחשבו כשגויים.`:'כל הפריטים הסגורים נענו. לאחר ההגשה יוצגו הציון, התשובות וההסברים.'}</p><p>השאלות הפתוחות אינן משפיעות על הציון, ואפשר להמשיך בהן גם לאחר ההגשה.</p>`,'<button class="btn secondary" data-action="close-modal">חזרה לתרגול</button><button class="btn primary" data-action="confirm-pending">הגשה ובדיקה</button>');}
function settings(){modal('התקדמות וגיבוי',`<p>הנתונים נשמרים בדפדפן הזה בלבד. ייצוא וייבוא מאפשרים להעביר את ההתקדמות ידנית בין מחשב לטלפון.</p><div class="settings-row"><b>שמירת עותק של ההתקדמות</b><p>הקובץ כולל היסטוריה ומשקלי שאלות. תשובות פתוחות והתרגול הנוכחי נשארים במכשיר.</p><button class="btn secondary" data-action="export">${icon('download',18)} ייצוא התקדמות</button></div><div class="settings-row"><b>טעינת התקדמות ממכשיר אחר</b><p>הייבוא מחליף את ההתקדמות ואת התרגול הנוכחי במכשיר הזה.</p><button class="btn secondary" data-action="import">${icon('upload',18)} בחירת קובץ לייבוא</button></div><div class="settings-row"><b>התחלה מחדש</b><p>איפוס נתוני אפליקציית המדעים בדפדפן הזה.</p><button class="text-button" style="color:var(--red)" data-action="reset">איפוס ההתקדמות</button></div><p class="small">גרסת מאגר ${E.VERSION} · ללא חשבון וללא סנכרון אוטומטי.</p>`);}
function history(){modal('ההתקדמות שלי',`<p>הציונים מתייחסים לסטים שונים. התרגול מסתגל לטעויות שלך, ולכן הציון אינו מדד יחיד להתקדמות.</p>${state.history.length?state.history.slice(0,15).map(h=>`<div class="history-row"><div><b>${h.mode==='exam'?'מבחן':'תרגול'}${h.focused?' ממוקד':''}</b><div class="small muted">${esc(new Date(h.date).toLocaleDateString('he-IL'))} · ${h.correct}/${h.total} נכונות</div></div><strong>${h.score}%</strong></div>`).join(''):'<div class="empty">עוד לא הושלם תרגול. התרגול הראשון יהיה נקודת ההתחלה שלך.</div>'}`);}
function sources(){modal('החומר והמקורות',`<p>המאגר נבנה לפי הגדרת הנושאים בדף ההכנה. ההפניות הן למספרי העמודים המודפסים בספר המצורף, ולא למונה העמודים בקובץ PDF.</p><div class="settings-row"><b>מערכת ההובלה באדם</b><p>החוברת המסכמת, פרקים א׳–ו׳. דיוקים במבנה ובתפקוד נבדקו גם מול OpenStax Anatomy and Physiology.</p></div><div class="settings-row"><b>טבלת היסודות ומבנה האטום</b><p>חוקרים חומר ואנרגיה ב׳: עמודים רלוונטיים בפרקי היסודות והאטום, ובהם 40, 44–47, 55–65, 81–84, 88–94 ו־100–103. מספור קבוצות נבדק מול IUPAC.</p><p>קבוצות ההלוגנים והגזים האצילים: 17 ו־18 במספור המודרני, 7 ו־8 במספור הטורים הראשיים שבספר.</p></div><div class="settings-row"><b>חקר מדעי</b><p>מצגת חקר מדעי לשכבה ח׳, בעיקר שקופיות 2–7 ו־9–12. טבלאות הניסויים באפליקציה הן דוגמאות לימודיות מדומות.</p></div><p>לכל שאלה יש הפניה פרטנית המופיעה לאחר הבדיקה. השאלות והקטעים נוסחו עבור האפליקציה.</p>`);}
function navigator(){const{s,sec}=current();modal('מפת השאלות',`<p>ירוק: נענתה. נקודה צהובה: מסומנת לחזרה.</p><div class="number-grid" style="display:grid;grid-template-columns:repeat(5,1fr)">${s[sec].map((x,i)=>`<button class="number ${isEntryAnswered(s,sec,x)?'answered':''} ${s.flags?.[x.id]?'flagged':''}" data-action="jump-modal" data-index="${i}">${i+1}</button>`).join('')}</div>`);}
function move(delta){const s=state.active,keys=['mcq','cloze','tf','open'];let {section,index:i}=s.cursor;i+=delta;if(i>=s[section].length){const n=keys.indexOf(section)+1;if(n>=keys.length){submit();return;}section=keys[n];i=0;}else if(i<0){const n=keys.indexOf(section)-1;if(n<0)return;section=keys[n];i=s[section].length-1;}s.cursor={section,index:i};activeGap=null;save();navigateTop();}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-action]');if(!b||b.disabled)return;const action=b.dataset.action;switch(action){case'home':page='home';save();navigateTop();break;case'start':start(b.dataset.mode,b.dataset.topic||null);break;case'resume':page='session';navigateTop();break;case'settings':settings();break;case'history':history();break;case'sources':sources();break;case'close-modal':closeModal();pendingAction=null;break;case'confirm-pending':{const f=pendingAction;pendingAction=null;f?.();break;}case'next':move(1);break;case'prev':move(-1);break;case'section':state.active.cursor={section:b.dataset.section,index:0};activeGap=null;page='session';save();navigateTop();break;case'jump':case'jump-modal':state.active.cursor.index=Number(b.dataset.index);activeGap=null;save();closeModal();navigateTop();break;case'navigator':navigator();break;case'answer':{const{s,q}=current();if(s.graded[q.id]||s.submitted)return;s.answers[q.id]=q.type==='tf'?b.dataset.value==='true':Number(b.dataset.value);save();render();break;}case'check':{const{s,sec,entry,q}=current();if(s.mode!=='practice'||s.submitted)return;if(sec==='cloze'){if(!entry.hiddenKeys.every(k=>E.answered(s,q.id+':'+k)))return;for(const k of entry.hiddenKeys)E.gradeOne(state,s,index,q.id+':'+k);}else {if(!E.answered(s,q.id))return;E.gradeOne(state,s,index,q.id);}save();render();break;}case'gap':activeGap=b.dataset.key;render();break;case'word':{const{s,entry,q}=current();const id=q.id+':'+activeGap;if(!activeGap||s.graded[id]||s.submitted)return;const word=entry.words[Number(b.dataset.wordIndex)];if(entry.hiddenKeys.some(k=>s.answers[q.id+':'+k]===word))return;s.answers[id]=word;activeGap=q.blanks.filter(x=>entry.hiddenKeys.includes(x.key)).find(x=>!s.answers[q.id+':'+x.key])?.key||activeGap;save();render();break;}case'clear-gap':{const{s,q}=current();if(!s.graded[q.id+':'+activeGap]&&!s.submitted)delete s.answers[q.id+':'+activeGap];save();render();break;}case'flag':{const{s,q}=current();s.flags??={};s.flags[q.id]=!s.flags[q.id];save();render();break;}case'reveal':{const{s,q}=current();if(s.mode==='exam'&&!s.submitted)return;s.revealed[q.id]=!s.revealed[q.id];save();render();break;}case'submit':submit();break;case'results':page='results';navigateTop();break;case'review-toggle':reviewAll=!reviewAll;render();break;case'export':{const blob=new Blob([JSON.stringify(E.exportProgress(state),null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='science-progress-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('קובץ ההתקדמות יוצא להורדה.');break;}case'import':document.getElementById('import-file').click();break;case'reset':pendingAction=()=>{state=E.fresh();save();closeModal();page='home';navigateTop();toast('ההתקדמות אופסה.');};modal('לאפס את ההתקדמות?','<p>הפעולה מוחקת את היסטוריית המדעים, משקלי השאלות והתרגול הנוכחי בדפדפן הזה. מומלץ לייצא גיבוי לפני האיפוס.</p>','<button class="btn secondary" data-action="close-modal">ביטול</button><button class="btn danger" data-action="confirm-pending">איפוס</button>');break;}});
document.addEventListener('input',ev=>{if(ev.target.dataset.openId&&state.active){state.active.openAnswers[ev.target.dataset.openId]=ev.target.value;save();}});
document.addEventListener('change',ev=>{const el=ev.target;if(el.dataset.checkId&&state.active){state.active.selfChecks[el.dataset.checkId]??={};state.active.selfChecks[el.dataset.checkId][Number(el.dataset.checkIndex)]=el.checked;save();}});
document.getElementById('import-file').addEventListener('change',async ev=>{const file=ev.target.files[0];ev.target.value='';if(!file)return;if(file.size>3*1024*1024){toast('הקובץ גדול מדי. יש לבחור קובץ התקדמות מהאפליקציה.');return;}try{const imported=E.importProgress(JSON.parse(await file.text()),index);pendingAction=()=>{state=imported;save();closeModal();page='home';navigateTop();toast('ההתקדמות יובאה בהצלחה.');};modal('לייבא את ההתקדמות?',`<p>הקובץ מכיל נתונים על ${Object.keys(imported.stats).length} פריטים ו־${imported.history.length} תרגולים שהושלמו.</p><p>הנתונים יחליפו את ההתקדמות ואת התרגול הנוכחי בדפדפן הזה.</p>`,'<button class="btn secondary" data-action="close-modal">ביטול</button><button class="btn primary" data-action="confirm-pending">ייבוא והחלפה</button>');}catch(e){toast(e.message?.includes('קובץ')||e.message?.includes('נתוני')?e.message:'לא ניתן לקרוא את הקובץ. יש לבחור קובץ JSON שיוצא מהאפליקציה.');}});
document.addEventListener('keydown',e=>{if(!modalRoot.firstChild)return;if(e.key==='Escape'){closeModal();pendingAction=null;}if(e.key==='Tab'){const f=[...modalRoot.querySelectorAll('button:not(:disabled),a,input,textarea,select')];if(!f.length)return;if(e.shiftKey&&document.activeElement===f[0]){e.preventDefault();f[f.length-1].focus();}else if(!e.shiftKey&&document.activeElement===f[f.length-1]){e.preventDefault();f[0].focus();}}});
try{E.validateBank(bank);render();}catch(e){root.innerHTML='<main class="container"><h1>לא ניתן לטעון את מאגר התרגול</h1><p>יש להוריד מחדש את קובץ האפליקציה.</p></main>';console.error(e);}
})();
</script></body></html>
