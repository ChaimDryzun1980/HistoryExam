<script>
(function(){
'use strict';
var BANK = {"topics":[{"id":1,"name":"הוגי הדעות: ״העז לדעת!⁠״, קאנט, תבונה, קדמה, חינוך","short":"הוגי הדעות","slides":[2,3,4,5,6,19],"w":6},{"id":2,"name":"הנאורות והדת: ביקורת על הכנסייה, וולטר, סובלנות דתית","short":"הנאורות והדת","slides":[10,11,12,13],"w":4},{"id":3,"name":"הפצת הרעיונות: סלונים, עיתונים, האנציקלופדיה","short":"הפצת הרעיונות","slides":[7,8,9],"w":3},{"id":4,"name":"הנאורות והמדינה: לוק, מונטסקייה, רוסו","short":"הנאורות והמדינה","slides":[15,16,17,18,21],"w":5},{"id":5,"name":"משטר אבסולוטי ואבסולוטיזם נאור","short":"אבסולוטיזם","slides":[14,20],"w":2}],"mc":[{"id":"m1","t":1,"s":2,"q":"איך כינו בני התקופה את הוגי הדעות של המאה ה-18?","o":["פילוסופים","נביאים","אבירים","שליטים"],"e":"בני התקופה כינו את הוגי הדעות ״פילוסופים״."},{"id":"m2","t":1,"s":2,"q":"מהו פילוסוף, לפי החומר?","o":["אדם שעוסק בשאלות יסוד על האדם, העולם, החברה והדרך שבה יודעים מה נכון","אדם שתפקידו לחוקק חוקים במדינה","איש דת שמפרש את כתבי הקודש לציבור","מדען שעוסק רק בניסויים במעבדה"],"e":"פילוסוף הוא אדם שעוסק בשאלות יסוד על האדם, העולם, החברה והדרך שבה אנחנו יודעים מה נכון."},{"id":"m3","t":1,"s":2,"q":"מה הייתה הגישה המשותפת להוגי הנאורות, למרות שהיו ביניהם סופרים, מדענים ואנשי רוח?","o":["לשאול שאלות, לבחון רעיונות ולנסות לשפר את החברה","לשמור על המסורת בלי לשנות דבר","לקבל כל רעיון שמציג בעל סמכות","להתרחק מענייני החברה והמדינה"],"e":"הם חלקו גישה דומה: לשאול שאלות, לבחון רעיונות ולנסות לשפר את החברה."},{"id":"m4","t":1,"s":3,"q":"באילו מאות התפתחה תנועת הנאורות באירופה?","o":["המאות ה-17 וה-18","המאות ה-13 וה-14","המאות ה-15 וה-16","המאות ה-19 וה-20"],"e":"הנאורות הייתה תנועה של הוגי דעות שהתפתחה באירופה במאות ה-17 וה-18."},{"id":"m5","t":1,"s":3,"q":"איזו עיר הייתה אחד ממרכזי הנאורות?","o":["פריז","ליסבון","רומא","ורשה"],"e":"אחד המרכזים של הנאורות היה בפריז שבצרפת."},{"id":"m6","t":1,"s":3,"q":"מה ביקשו רבים מהוגי הנאורות, למרות שלא הסכימו ביניהם על הכול?","o":["לצמצם את התלות בסמכות ולעודד חשיבה עצמאית","לחזק את סמכות המלך ואת התלות בו","להפסיק לעסוק במדע ובחינוך","להחזיר את החברה לדרכי החיים של ימי הביניים"],"e":"הם לא הסכימו על הכול, אבל רבים מהם ביקשו לצמצם את התלות בסמכות ולעודד חשיבה עצמאית."},{"id":"m7","t":1,"s":4,"q":"מהי ״תבונה״ לפי הוגי הנאורות?","o":["שימוש בשכל ובהיגיון","ציות להוראות המלך","אמונה במסורת בלי לשאול שאלות","שינון עובדות בעל פה"],"e":"הוגי הנאורות טענו שצריך להשתמש בתבונה, כלומר בשכל ובהיגיון, כדי לבחון טענות ולגבש עמדה."},{"id":"m8","t":1,"s":4,"q":"על איזה הרגל מתחו הוגי הנאורות ביקורת?","o":["לקבל דעות רק משום שהן מקובלות, או משום שבעל סמכות הציג אותן כנכונות","לקרוא ספרים ועיתונים","להיפגש בסלונים ובבתי קפה","לחקור את העולם באמצעות תצפיות"],"e":"הם ביקרו את ההרגל לקבל דעות רק משום שהן מקובלות, או משום שבעל סמכות הציג אותן כנכונות."},{"id":"m9","t":1,"s":4,"q":"לפי הוגי הנאורות, מה היחס הנכון לרעיונות ולמסורות עתיקים?","o":["גם רעיון עתיק צריך לעמוד בפני ביקורת, אבל אין זה אומר שכל מסורת שגויה","כל מסורת עתיקה שגויה ויש לבטל אותה","רעיון עתיק נכון תמיד ואין לבקר אותו","רק המלך רשאי להחליט אם רעיון עתיק נכון"],"e":"אין פירוש הדבר שכל מסורת שגויה, אלא שגם רעיון עתיק צריך לעמוד בפני ביקורת."},{"id":"m10","t":1,"s":5,"q":"באיזו קריאה עודד עמנואל קאנט אנשים לחשוב באופן עצמאי?","o":["״העז לדעת!⁠״","״חיים, חירות וקניין!⁠״","״כולם שווים בפני המלך!⁠״","״שמור על המסורת!⁠״"],"e":"קאנט עודד אנשים להעז להשתמש בשכלם ולחשוב באופן עצמאי: ״העז לדעת!⁠״."},{"id":"m11","t":1,"s":5,"q":"מה כינה קאנט ״קטינות״?","o":["מצב שבו אדם אינו משתמש בשכלו בלי הדרכה של מישהו אחר","מצב שבו אדם צעיר מגיל 18","מצב שבו המלך מחליט על הכול","מצב שבו אדם אינו יודע קרוא וכתוב"],"e":"קאנט כינה ״קטינות״ מצב שבו אדם אינו משתמש בשכלו בלי הדרכה של מישהו אחר."},{"id":"m12","t":1,"s":5,"q":"לפי קאנט, מה עיקר הבעיה אצל מי שנמצא במצב של ״קטינות״?","o":["חוסר החלטה וחוסר אומץ להשתמש בשכל","חוסר יכולת שכלית","חוסר כסף ללימודים","איסור מצד הכנסייה ללמוד"],"e":"לדברי קאנט, הבעיה אינה בהכרח חוסר יכולת, אלא חוסר החלטה ואומץ."},{"id":"m13","t":1,"s":6,"q":"מהו רעיון ״הקדמה״?","o":["האמונה שהאנושות יכולה להתקדם לעתיד טוב יותר","האמונה שהעבר תמיד היה טוב מההווה","האמונה שרק המלך יכול לשפר את חיי העם","האמונה שהעולם אינו משתנה לעולם"],"e":"הוגי הנאורות האמינו שהאנושות יכולה להתקדם לעתיד טוב יותר, ולרעיון זה קוראים ״קדמה״."},{"id":"m14","t":1,"s":6,"q":"איזה הוגה דעות מזוהה במיוחד עם רעיון הקדמה ועם האמונה בהתפתחות האנושות?","o":["קונדורסה","מונטסקייה","ג׳ון לוק","לואי ה-14"],"e":"הוגה הדעות קונדורסה היה אחד ממי שהביעו אמונה בהתפתחות האנושות."},{"id":"m15","t":1,"s":6,"q":"לפי רעיון הקדמה, באילו תחומים יכולה האנושות להתקדם?","o":["במדע ובטכנולוגיה, וגם בחינוך, בחברה צודקת יותר ובהתנהגות בני האדם","רק בהמצאות מדעיות","רק בחיזוק כוחו של המלך","רק בבניית ארמונות ומבנים"],"e":"הם לא התכוונו רק להמצאות מדעיות ולשיפור הטכנולוגיה, אלא גם לחינוך טוב יותר, לחברה צודקת יותר ולשיפור בהתנהגות בני האדם."},{"id":"m16","t":1,"s":19,"q":"באיזה ספר הציג רוסו את תפיסתו על חינוך?","o":["״אמיל״","״מהי השכלה?⁠״","האנציקלופדיה","פואמה על אסון ליסבון"],"e":"בשנת 1762 פרסם רוסו את הספר ״אמיל״, שהציג את תפיסתו על חינוך."},{"id":"m17","t":1,"s":19,"q":"לפי רוסו, איך צריכים ילדים ללמוד?","o":["באמצעות התנסות, סקרנות ושאלות שהם מעלים בעצמם","בשינון בעל פה של כל מה שהמבוגר אומר","רק בהוראת אנשי הכנסייה","בלי לשאול שאלות, כדי לא לבזבז זמן"],"e":"לדעת רוסו, ילדים צריכים ללמוד באמצעות התנסות, סקרנות ושאלות שהם מעלים בעצמם."},{"id":"m18","t":1,"s":19,"q":"מה קרה לספר ״אמיל״ לאחר שפורסם?","o":["הוא עורר התנגדות ואף נידון לשרפה בפריז","הוא הפך לספר הלימוד הרשמי של הכנסייה","המלך ציווה ללמד אותו בכל בתי הספר","הוא לא עורר שום תגובה"],"e":"הספר ערער על תפיסות חינוך מקובלות ועל סמכות הכנסייה, עורר התנגדות ואף נידון לשרפה בפריז."},{"id":"m19","t":2,"s":10,"q":"מה ביקרו רבים מהוגי הנאורות?","o":["את השפעת הכנסייה על חיי האדם ועל דרך חשיבתו","את השימוש בשכל ובהיגיון","את הדפסת הספרים והעיתונים","את המחקר המדעי"],"e":"רבים מהוגי הנאורות ביקרו את השפעת הכנסייה על חיי האדם ועל דרך חשיבתו."},{"id":"m20","t":2,"s":10,"q":"מדוע, לטענת הוגי הנאורות, הסתמכות על סמכות דתית בלבד עלולה להזיק?","o":["היא עלולה לעודד אמונות לא מבוססות ולמנוע שאלות וביקורת","היא מעודדת יותר מדי שאלות וביקורת","היא מחזקת את המדע","היא מחלישה את כוחו של המלך"],"e":"הם טענו שהסתמכות על סמכות דתית בלבד עלולה לעודד אמונות לא מבוססות ולמנוע שאלות וביקורת."},{"id":"m21","t":2,"s":10,"q":"איזו טענה נכונה לגבי ביקורת הנאורות על הכנסייה?","o":["ביקורת על הכנסייה לא הייתה בהכרח התנגדות לאמונה באלוהים","כל הוגי הנאורות התנגדו לאמונה באלוהים","הוגי הנאורות דרשו לסגור את כל הכנסיות","הוגי הנאורות תמכו בענישה בגלל השתייכות דתית"],"e":"ביקורת על הכנסייה לא הייתה בהכרח התנגדות לאמונה באלוהים."},{"id":"m22","t":2,"s":11,"q":"מהי ״הדת הטבעית״?","o":["התפיסה שאלוהים ברא את העולם ואת חוקי הטבע, אבל אינו מתערב בכל אירוע","התפיסה שאלוהים מתערב בכל אירוע שמתרחש בעולם","התפיסה שאין צורך לחקור את הטבע","התפיסה שהמלך הוא שליחו של האל"],"e":"לפי ״הדת הטבעית״ (דאיזם), אלוהים ברא את העולם ואת חוקי הטבע, אבל אינו מתערב בכל אירוע שמתרחש בו."},{"id":"m23","t":2,"s":11,"q":"למה דימו בעלי תפיסת ״הדת הטבעית״ את האל?","o":["לשען שבנה שעון","למלך שיושב בארמונו","לשופט שמעניש חוטאים","למורה שמלמד ילדים"],"e":"הם דימו את האל לשען שבנה שעון: השעון פועל מעצמו לפי המנגנון שנבנה בו, בלי שהשען יתערב."},{"id":"m24","t":2,"s":11,"q":"לפי בעלי תפיסת ״הדת הטבעית״, איך אפשר לחקור את העולם?","o":["באמצעות תצפיות והיגיון, ובו בזמן להאמין באלוהים","רק באמצעות קריאה בכתבי הקודש","אי אפשר לחקור את העולם","רק בעזרת אנשי הכנסייה"],"e":"הם האמינו שניתן להאמין בקיומו של אלוהים ובו בזמן לחקור את העולם באמצעות תצפיות והיגיון."},{"id":"m25","t":2,"s":12,"q":"במה התפרסם וולטר במיוחד?","o":["בביקורתו על קנאות דתית","בהמצאת מכונת הדפוס","בעריכת האנציקלופדיה","בשלטונו על פרוסיה"],"e":"וולטר עסק בספרות, במדע ובשאלות חברתיות ומדיניות, אך התפרסם במיוחד בביקורתו על קנאות דתית."},{"id":"m26","t":2,"s":12,"q":"מהי ״סובלנות דתית״?","o":["לאפשר לבני דתות שונות לקיים את אמונתם ללא כפייה ורדיפה","לחייב את כל האזרחים להאמין באותה דת","לבטל את כל הדתות","להעניש את מי שאינו מאמין"],"e":"סובלנות דתית פירושה לאפשר לבני דתות שונות לקיים את אמונתם ללא כפייה ורדיפה."},{"id":"m27","t":2,"s":12,"q":"באילו דרכים ניסה וולטר להשפיע על החברה ועל בעלי הסמכות?","o":["באמצעות כתיבתו ופעילותו הציבורית","באמצעות מלחמה ומרד מזוין","באמצעות כהונה כמלך","באמצעות ייסוד כנסייה חדשה"],"e":"באמצעות כתיבתו ופעילותו הציבורית ניסה וולטר להשפיע על החברה ועל בעלי הסמכות."},{"id":"m28","t":2,"s":13,"q":"מה טענו חלק מאנשי הדת על רעידת האדמה בליסבון בשנת 1755?","o":["שהאסון הוא עונש על חטאי התושבים","שהאסון נגרם בגלל טעויות של בנאים","שהאסון היה המצאה של העיתונים","שהאסון הוכיח את רעיון הקדמה"],"e":"חלק מאנשי הדת טענו שהאסון הוא עונש על חטאי התושבים."},{"id":"m29","t":2,"s":13,"q":"איזו שאלה שאל וולטר בעקבות אסון ליסבון?","o":["מה חטאם של ילדים באסון הנורא?","כיצד אפשר לחזות רעידות אדמה מראש?","מדוע המלך לא עזר לתושבים?","האם יש לבנות את ליסבון במקום אחר?"],"e":"וולטר התנגד להסבר שהאסון הוא עונש ושאל כיצד אפשר להאשים חפים מפשע, למשל: מה חטאם של ילדים?"},{"id":"m30","t":2,"s":13,"q":"מה עשה וולטר בשנת 1756 בעקבות אסון ליסבון?","o":["פרסם פואמה (שיר) שבה הציג את ביקורתו","פרסם את הספר ״אמיל״","עבר לגור בליסבון","ייסד עיתון בפורטוגל"],"e":"בשנת 1756 פרסם וולטר פואמה (שיר) שבה הציג את ביקורתו, ועורר מחלוקת על הדרך שבה מסבירים סבל אנושי ועל הסכנה שבהאשמת הקורבנות."},{"id":"m31","t":3,"s":7,"q":"היכן נפגשו משכילים במאה ה-18 כדי לשוחח על רעיונות חדשים?","o":["בבתי קפה, במועדונים ובבתים פרטיים","רק בכנסיות","רק בארמון המלך","בבתי ספר ציבוריים"],"e":"במאה ה-18 נפגשו משכילים בבתי קפה, במועדונים ובבתים פרטיים כדי לשוחח על רעיונות חדשים."},{"id":"m32","t":3,"s":7,"q":"בבתיהן של מי נערכו הסלונים המפורסמים?","o":["נשים אמידות","אנשי דת","מלכים","סוחרים בנמל"],"e":"מפורסמים במיוחד היו הסלונים שנערכו בבתיהן של נשים אמידות."},{"id":"m33","t":3,"s":7,"q":"איזו טענה נכונה לגבי הסלונים ובתי הקפה?","o":["הם התקיימו בעיקר בחוגים משכילים ומבוססים, ולא היו פתוחים לכל הציבור","הם היו פתוחים לכל הציבור","הדיונים בהם עסקו רק בדת","המלך קבע את נושאי השיחה בהם"],"e":"המפגשים התקיימו בעיקר בחוגים משכילים ומבוססים, ולא היו פתוחים לכל הציבור."},{"id":"m34","t":3,"s":8,"q":"באמצעות מה הפיצו הוגי הנאורות את רעיונותיהם?","o":["ספרים, עיתונים וכתבי עת","רדיו וטלוויזיה","דרשות בכנסיות בלבד","צווים של המלך"],"e":"הוגי הנאורות הפיצו את רעיונותיהם באמצעות ספרים, עיתונים וכתבי עת."},{"id":"m35","t":3,"s":8,"q":"מה פירוש המושג ״דעת הקהל״ בתקופת הנאורות?","o":["בעיקר שיפוט ביקורתי של משכילים, ולא בהכרח דעות הציבור כולו","דעתו של המלך על נתיניו","תוצאות של בחירות דמוקרטיות","ההחלטות של הכנסייה"],"e":"בתקופת הנאורות הכוונה הייתה בעיקר לשיפוט ביקורתי של משכילים, ולא בהכרח לדעות הציבור כולו."},{"id":"m36","t":3,"s":8,"q":"מה אפשרו הדפוס והכתיבה?","o":["לרעיונות לעבור בין ערים ומדינות","למלך לשלוט בכל מה שנכתב","לבטל את הצורך בבתי ספר","לעצור את הדיון הציבורי"],"e":"הדפוס והכתיבה אפשרו לרעיונות לעבור בין ערים ומדינות."},{"id":"m37","t":3,"s":9,"q":"מי ערך יחד עם דניס דידרו את האנציקלופדיה הגדולה?","o":["המתמטיקאי דאלמבר","וולטר","ג׳ון לוק","עמנואל קאנט"],"e":"דניס דידרו ערך את האנציקלופדיה יחד עם המתמטיקאי דאלמבר."},{"id":"m38","t":3,"s":9,"q":"מה היה החידוש באנציקלופדיה, מלבד כמות המידע?","o":["ארגון המידע לפי סדר אלפביתי והפניות בין ערכים","כתיבתה בידי אדם אחד בלבד","היא עסקה רק בדת","היא חולקה בחינם לכל תושבי צרפת"],"e":"החידוש לא היה רק בכמות המידע, אלא גם בארגונו לפי סדר אלפביתי ובהפניות בין ערכים."},{"id":"m39","t":3,"s":9,"q":"מדוע עוררה האנציקלופדיה התנגדות מצד הכנסייה הקתולית?","o":["משום שהפיצה ידע ורעיונות ביקורתיים","משום שנכתבה בגרמנית","משום שהייתה קצרה מדי","משום שתמכה בשלטון האבסולוטי"],"e":"האנציקלופדיה הפיצה ידע ורעיונות ביקורתיים, ולכן עוררה התנגדות מצד הכנסייה הקתולית."},{"id":"m40","t":4,"s":15,"q":"אילו שלוש זכויות טבעיות הדגיש ג׳ון לוק?","o":["חיים, חירות וקניין","חינוך, דת ומסחר","שוויון, אחווה ודמוקרטיה","הצבעה, נשק ועבודה"],"e":"לוק הדגיש שלוש זכויות טבעיות: חיים, חירות וקניין."},{"id":"m41","t":4,"s":15,"q":"לפי לוק, מאין נובעות הזכויות הטבעיות?","o":["הן מגיעות לכל אדם מעצם היותו אדם","הן מתנה שהמלך מעניק לאזרחים","הן ניתנות רק למי שיש לו רכוש","הכנסייה קובעת למי מגיעות זכויות"],"e":"לפי לוק, הזכויות הטבעיות מגיעות לכל אדם מעצם היותו אדם. הן אינן מתנה שהמלך מעניק."},{"id":"m42","t":4,"s":15,"q":"לפי לוק, מהו תפקידו של השלטון?","o":["להגן על הזכויות הטבעיות של האזרחים","לקבוע במה האזרחים צריכים להאמין","להעניק זכויות רק לאצילים","להרחיב את כוחו של המלך"],"e":"לפי לוק, תפקידו של השלטון הוא להגן על הזכויות הטבעיות."},{"id":"m43","t":4,"s":16,"q":"לפי לוק, מתי מותר לאזרחים להתנגד לשלטון ואף למרוד בו?","o":["כאשר השלטון פוגע בזכויותיהם ומפר את התחייבויותיו","בכל פעם שהם לא מסכימים עם חוק מסוים","אף פעם, כי השלטון הוא בחסד האל","רק אם הכנסייה מאשרת זאת"],"e":"כאשר השלטון פוגע בזכויות ומפר את התחייבויותיו, מותר לאזרחים להתנגד לו ואף למרוד בו."},{"id":"m44","t":4,"s":16,"q":"מהו הבסיס ל״חוזה החברתי״ בתפיסתו של לוק?","o":["בני האדם מקימים חברה ומסכימים להעניק לשלטון סמכות כדי שיגן על זכויותיהם","המלך מקבל את סמכותו ישירות מהאל","הכנסייה ממנה את השליטים","החזק ביותר שולט בכל השאר"],"e":"לפי לוק, בני האדם מקימים חברה ומסכימים להעניק לשלטון סמכות כדי שיגן על זכויותיהם. זהו הבסיס לחוזה החברתי בתפיסתו."},{"id":"m45","t":4,"s":16,"q":"איזו הצעה העלה לוק כדי להגביל את הכוח השלטוני ולמנוע עריצות?","o":["להפריד בין הרשות המחוקקת לרשות המבצעת","לתת למלך לשמש גם כשופט העליון","לבטל את כל החוקים","להעביר את כל הסמכויות לכנסייה"],"e":"לוק הציע להפריד בין הרשות המחוקקת לרשות המבצעת, וכך ביקש להגביל את הכוח השלטוני ולמנוע עריצות."},{"id":"m46","t":4,"s":17,"q":"מי הציע להפריד בין שלוש רשויות: המחוקקת, המבצעת והשופטת?","o":["מונטסקייה","רוסו","וולטר","קאנט"],"e":"מונטסקייה הציע להפריד בין שלוש רשויות: המחוקקת, המבצעת והשופטת."},{"id":"m47","t":4,"s":17,"q":"מה מטרת הפרדת הרשויות לפי מונטסקייה?","o":["שיהיה קשה יותר לרכז את כל הכוח בידי אדם אחד ולפגוע בחירות האזרחים","לחזק את כוחו של המלך","לבטל את המלוכה מיד","להעביר את השלטון לכנסייה"],"e":"כאשר הרשויות מאזנות ובולמות זו את זו, קשה יותר לרכז את כל הכוח בידי אדם אחד ולפגוע בחירות האזרחים."},{"id":"m48","t":4,"s":17,"q":"מה הייתה עמדתו של מונטסקייה כלפי משטר מלוכני?","o":["משטר מלוכני יכול להיות טוב, אבל יש להגביל את כוחו של המלך","יש לבטל כל משטר מלוכני","יש לתמוך בשלטון אבסולוטי ללא הגבלה","המלך צריך לשמש גם מחוקק וגם שופט"],"e":"מונטסקייה סבר שמשטר מלוכני יכול להיות טוב, אבל חייבים להגביל את כוחו של המלך."},{"id":"m49","t":4,"s":18,"q":"לפי רוסו, מהו מקור סמכות השלטון?","o":["העם","המלך","האל","הכנסייה"],"e":"רוסו טען שמקור סמכות השלטון הוא העם, ולא המלך או האל."},{"id":"m50","t":4,"s":18,"q":"מהו ״הרצון הכללי״ לפי רוסו?","o":["רצון שאמור לבטא את טובת החברה כולה","הרצון האישי של המלך","רצונם של העשירים בחברה","החלטות האפיפיור"],"e":"לפי רוסו, כל אדם מקבל על עצמו את הרצון הכללי, שאמור לבטא את טובת החברה כולה."},{"id":"m51","t":4,"s":18,"q":"היכן נולד ז׳אן ז׳אק רוסו?","o":["בז׳נבה","בפריז","בליסבון","בלונדון"],"e":"ז׳אן ז׳אק רוסו נולד בז׳נבה וחי בשנים 1712–1778."},{"id":"m52","t":4,"s":21,"q":"באיזו תשובה כל הוגה מותאם לרעיון שהוא מזוהה איתו?","o":["לוק – זכויות טבעיות; מונטסקייה – הפרדת רשויות; רוסו – ריבונות העם","לוק – ריבונות העם; מונטסקייה – זכויות טבעיות; רוסו – הפרדת רשויות","לוק – הפרדת רשויות; מונטסקייה – ריבונות העם; רוסו – זכויות טבעיות","לוק – זכויות טבעיות; מונטסקייה – ריבונות העם; רוסו – הפרדת רשויות"],"e":"לוק הדגיש זכויות טבעיות, מונטסקייה הציע הפרדת רשויות, ורוסו טען שמקור סמכות השלטון הוא העם (ריבונות העם)."},{"id":"m53","t":4,"s":21,"q":"מה היה המשותף ללוק, למונטסקייה ולרוסו?","o":["שלושתם ערערו, בדרכים שונות, על השלטון האבסולוטי","שלושתם הציעו בדיוק אותו פתרון","שלושתם היו מלכים","שלושתם תמכו בשלטון האבסולוטי"],"e":"הוגי הנאורות לא הציעו פתרון אחד לכל הבעיות, אבל שלושתם ערערו בדרכים שונות על השלטון האבסולוטי."},{"id":"m54","t":4,"s":21,"q":"איזה הוגה מזוהה עם המושג ״ריבונות העם״?","o":["רוסו","מונטסקייה","וולטר","פרידריך השני"],"e":"הרעיון שמקור סמכות השלטון הוא העם, ולא המלך או האל, נקרא ״ריבונות העם״, והוא מזוהה עם רוסו."},{"id":"m55","t":5,"s":14,"q":"מהו שלטון אבסולוטי?","o":["שלטון שבו סמכויות השלטון מרוכזות בידי המלך","שלטון שבו העם בוחר את נציגיו","שלטון שבו שלוש רשויות מאזנות זו את זו","שלטון שבו הכנסייה והמלך מתחלקים בסמכויות שווה בשווה"],"e":"בשלטון אבסולוטי סמכויות השלטון מרוכזות בידי המלך: הוא יכול לחוקק חוקים, להורות על ביצועם ולשמש כשופט העליון."},{"id":"m56","t":5,"s":14,"q":"על מה ביססו המלכים האבסולוטיים את הטענה שאינם חייבים לתת דין וחשבון לנתיניהם?","o":["על כך שהם שולטים בחסד האל","על כך שהעם בחר בהם","על כך שהם מגינים על הזכויות הטבעיות","על הפרדת הרשויות"],"e":"מלכים אבסולוטיים טענו שהם שולטים בחסד האל, ולכן אינם חייבים לתת דין וחשבון לנתיניהם."},{"id":"m57","t":5,"s":14,"q":"מה סימל ארמון ורסאי?","o":["את כוחו של המלך ואת המרחק בינו לבין רוב תושבי המדינה","את ריבונות העם","את הסובלנות הדתית בצרפת","את כוחה של הכנסייה"],"e":"ארמון ורסאי המפואר סימל את כוחו של המלך ואת המרחק בינו לבין רוב תושבי המדינה."},{"id":"m58","t":5,"s":20,"q":"מהו ״אבסולוטיזם נאור״?","o":["שלטון שבו המלך ממשיך להחזיק בסמכויות רבות, אך מנסה לשפר את חיי האזרחים","שלטון שבו העם מחזיק בכל הסמכויות","שלטון שבו המלך מוותר על כל סמכויותיו","שלטון שבו הכנסייה שולטת במדינה"],"e":"באבסולוטיזם נאור המלכים המשיכו להחזיק בסמכויות רבות, אך ניסו לשפר את חיי האזרחים."},{"id":"m59","t":5,"s":20,"q":"כיצד הציג פרידריך השני, מלך פרוסיה, את עצמו?","o":["כמשרתה הראשון של המדינה","כשליחו האישי של האפיפיור","כנציג שנבחר בידי העם","כפילוסוף שוויתר על הכתר"],"e":"פרידריך השני הציג את עצמו כ״משרתה הראשון של המדינה״ וטען שעליו לדאוג לטובתה."},{"id":"m60","t":5,"s":20,"q":"באילו דרכים ניסו המלכים ה״נאורים״ לשפר את חיי האזרחים?","o":["חינוך, ייעול השלטון וסובלנות דתית","העברת כל הסמכויות לעם","ביטול הצבא והמסים","סגירת בתי הדפוס"],"e":"המלכים ה״נאורים״ ניסו לשפר את חיי האזרחים באמצעות חינוך, ייעול השלטון וסובלנות דתית."},{"id":"m61","t":1,"s":5,"h":1,"q":"באיזו שנה פרסם עמנואל קאנט את החיבור ״מהי השכלה?⁠״?","o":["1784","1762","1755","1804"],"e":"קאנט פרסם את ״מהי השכלה?⁠״ בשנת 1784. בשנת 1762 פרסם רוסו את ״אמיל״, בשנת 1755 התרחשה רעידת האדמה בליסבון, ובשנת 1804 מת קאנט."},{"id":"m62","t":1,"s":5,"h":1,"q":"מה הן שנות חייו של עמנואל קאנט?","o":["1724–1804","1712–1778","1694–1778","1689–1755"],"e":"קאנט חי בשנים 1724–1804. השנים האחרות שייכות לרוסו (1712–1778), לוולטר (1694–1778) ולמונטסקייה (1689–1755)."},{"id":"m63","t":1,"s":5,"h":1,"q":"איזה תיאור של ״קטינות״ מתאים לדברי קאנט?","o":["מצב שבו אדם אינו משתמש בשכלו בלי הדרכה של מישהו אחר, בגלל חוסר החלטה ואומץ","מצב שבו אדם אינו מסוגל להשתמש בשכלו, בגלל חוסר יכולת","מצב שבו אדם מסרב לקבל הדרכה ממישהו אחר, בגלל גאווה","מצב שבו אדם משתמש בשכלו רק בעזרת ספרי הכנסייה, בגלל איסור"],"e":"קאנט כינה ״קטינות״ מצב שבו אדם אינו משתמש בשכלו בלי הדרכה של מישהו אחר. לדבריו, הבעיה אינה בהכרח חוסר יכולת, אלא חוסר החלטה ואומץ."},{"id":"m64","t":1,"s":6,"h":1,"q":"לפי רעיון הקדמה, מה נכון לגבי העתיד?","o":["העתיד אינו חייב להיות העתק של העבר, ובני האדם יכולים להשפיע עליו במעשיהם","העתיד נקבע מראש, ובני האדם יכולים רק להבין אותו בעזרת השכל","העתיד צריך להיות דומה לעבר, אך בני האדם יכולים לשפר בו פרטים קטנים","העתיד תלוי רק בהמצאות מדעיות, ולא בהתנהגות בני האדם"],"e":"לפי תפיסת הקדמה, העתיד אינו חייב להיות העתק של העבר, ובני האדם יכולים להשפיע עליו במעשיהם."},{"id":"m65","t":1,"s":19,"h":1,"q":"איזו טענה על הספר ״אמיל״ נכונה בכל חלקיה?","o":["פורסם ב-1762, הציג את תפיסת רוסו על חינוך ונידון לשרפה בפריז","פורסם ב-1784, הציג את תפיסת רוסו על חינוך ונידון לשרפה בפריז","פורסם ב-1762, הציג את תפיסת רוסו על השלטון ונידון לשרפה בפריז","פורסם ב-1762, הציג את תפיסת רוסו על חינוך ונעשה לספר לימוד רשמי בפריז"],"e":"״אמיל״ פורסם ב-1762, הציג את תפיסתו של רוסו על חינוך, עורר התנגדות ואף נידון לשרפה בפריז."},{"id":"m66","t":1,"s":3,"h":1,"q":"איזו טענה על תנועת הנאורות נכונה בכל חלקיה?","o":["התפתחה באירופה במאות ה-17 וה-18, ואחד ממרכזיה היה פריז","התפתחה באירופה במאות ה-18 וה-19, ומרכזה היחיד היה פריז","התפתחה בצרפת בלבד במאה ה-18, ומרכזה היה ורסאי","התפתחה באירופה במאות ה-16 וה-17, ואחד ממרכזיה היה ליסבון"],"e":"הנאורות התפתחה באירופה במאות ה-17 וה-18, ואחד ממרכזיה היה פריז שבצרפת."},{"id":"m67","t":1,"s":5,"q":"מה היה מוצאו של עמנואל קאנט?","o":["פילוסוף גרמני","פילוסוף צרפתי","פילוסוף אנגלי","פילוסוף פורטוגלי"],"e":"עמנואל קאנט היה פילוסוף גרמני."},{"id":"m68","t":1,"s":3,"q":"במה, לפי הוגי הנאורות, בני האדם מסוגלים להשתמש כדי להבין את העולם?","o":["בשכל ובהיגיון","בהוראות המלך","במסורת בלבד","בדברי אנשי הכנסייה בלבד"],"e":"הוגי הנאורות האמינו שבני האדם מסוגלים להשתמש בשכל ובהיגיון כדי להבין את העולם ולבחון רעיונות שהיו מקובלים במשך שנים."},{"id":"m69","t":1,"s":4,"q":"מה צריך לעשות ״אדם חושב״, לפי הוגי הנאורות?","o":["לשאול שאלות, לבחון הסברים ולהיות מוכן לשנות את דעתו","לשמור תמיד על דעתו הראשונה","לקבל את מה שאומר המלך","להימנע משאלות כדי לא לפגוע במסורת"],"e":"אדם חושב צריך לשאול שאלות, לבחון הסברים ולהיות מוכן לשנות את דעתו."},{"id":"m70","t":1,"s":3,"q":"באילו תחומים עסקו הוגי הנאורות?","o":["דת, מדינה, חינוך, מדע וחברה","רק מדע וטכנולוגיה","רק דת","רק אמנות ומוזיקה"],"e":"הוגי הנאורות עסקו בדת, במדינה, בחינוך, במדע ובחברה."},{"id":"m71","t":1,"s":19,"q":"באיזו שנה פרסם רוסו את הספר ״אמיל״?","o":["1762","1562","1862","1962"],"e":"רוסו פרסם את ״אמיל״ בשנת 1762, במאה ה-18."},{"id":"m72","t":1,"s":5,"q":"מה ראה קאנט כפתרון לבעיית ה״קטינות״?","o":["להעז להשתמש בשכל ולחשוב באופן עצמאי","לבקש הדרכה מבעל סמכות","להמתין עד שהמלך יחליט","לקרוא רק את ספרי הכנסייה"],"e":"קאנט עודד אנשים להעז להשתמש בשכלם ולחשוב באופן עצמאי: ״העז לדעת!⁠״."},{"id":"m73","t":2,"s":12,"h":1,"q":"מה הן שנות חייו של וולטר?","o":["1694–1778","1712–1778","1689–1755","1724–1804"],"e":"וולטר חי בשנים 1694–1778. רוסו חי בשנים 1712–1778, כלומר שניהם מתו באותה שנה."},{"id":"m74","t":2,"s":12,"h":1,"q":"למה התנגד וולטר?","o":["לכך שאנשים ייענשו או יאבדו זכויות בגלל אמונתם","לכך שאנשים יאמינו באלוהים","לכך שבני דתות שונות יקיימו את אמונתם","לכך שאנשי רוח יעסקו בשאלות חברתיות ומדיניות"],"e":"וולטר התנגד לכך שאנשים ייענשו או יאבדו זכויות בגלל אמונתם, וקרא לסובלנות דתית. ביקורת על קנאות דתית אינה בהכרח התנגדות לאמונה באלוהים."},{"id":"m75","t":2,"s":13,"h":1,"q":"איזה צירוף מתאר נכון את האסון בליסבון ואת תגובת וולטר?","o":["רעידת אדמה ב-1755, ופואמה של וולטר ב-1756","רעידת אדמה ב-1756, ופואמה של וולטר ב-1755","רעידת אדמה ב-1755, ופואמה של וולטר ב-1762","מגפה ב-1755, ופואמה של וולטר ב-1756"],"e":"רעידת האדמה בליסבון התרחשה בשנת 1755, ובשנת 1756 פרסם וולטר פואמה שבה הציג את ביקורתו."},{"id":"m76","t":2,"s":11,"h":1,"q":"לפי ״הדת הטבעית״, מה קורה בעולם לאחר שאלוהים ברא אותו?","o":["אלוהים אינו מתערב בכל אירוע, והעולם פועל לפי חוקי הטבע שברא","אלוהים מתערב רק באסונות, כדי להעניש חוטאים","אלוהים ממשיך לכוון כל אירוע ואירוע, אך דרך חוקי הטבע","אלוהים העביר את השליטה בעולם לכנסייה"],"e":"לפי ״הדת הטבעית״, אלוהים ברא את העולם ואת חוקי הטבע, אבל אינו מתערב בכל אירוע, כמו שען שבנה שעון שפועל מעצמו."},{"id":"m77","t":2,"s":12,"q":"מה היה מוצאו של וולטר?","o":["סופר והוגה דעות צרפתי","פילוסוף גרמני","פילוסוף אנגלי","סופר פורטוגלי"],"e":"וולטר היה סופר והוגה דעות צרפתי."},{"id":"m78","t":2,"s":13,"q":"באיזו מדינה נמצאת העיר ליסבון?","o":["פורטוגל","ספרד","איטליה","צרפת"],"e":"ליסבון נמצאת בפורטוגל."},{"id":"m79","t":2,"s":10,"q":"מה טענו הוגי הנאורות לגבי שאלות דתיות?","o":["שגם בהן אדם צריך להשתמש בשכלו ובניסיונו","שיש לקבל בהן את דברי הכנסייה בלי שאלות","שאסור לעסוק בהן כלל","שרק המלך רשאי להכריע בהן"],"e":"לדעתם, האדם צריך להשתמש בשכלו ובניסיונו גם כאשר הוא עוסק בשאלות דתיות."},{"id":"m80","t":2,"s":13,"q":"על איזו סכנה הצביע וולטר בפואמה שפרסם בעקבות אסון ליסבון?","o":["הסכנה שבהאשמת הקורבנות","הסכנה שברעידות אדמה נוספות","הסכנה שבהדפסת ספרים","הסכנה שבשלטון אבסולוטי"],"e":"הפואמה עוררה מחלוקת על הדרך שבה מסבירים סבל אנושי ועל הסכנה שבהאשמת הקורבנות."},{"id":"m81","t":3,"s":9,"h":1,"q":"באילו שנים פורסמה האנציקלופדיה של דידרו ודאלמבר?","o":["1751–1772","1755–1778","1689–1755","1762–1784"],"e":"האנציקלופדיה פורסמה בשנים 1751–1772."},{"id":"m82","t":3,"s":9,"h":1,"q":"איזה תיאור של האנציקלופדיה נכון בכל חלקיו?","o":["כ-72 אלף ערכים, מסודרים לפי סדר אלפביתי ועם הפניות בין ערכים","כ-72 אלף ערכים, מסודרים לפי נושאים ובלי הפניות בין ערכים","כ-72 ערכים, מסודרים לפי סדר אלפביתי ועם הפניות בין ערכים","כ-7,200 ערכים, מסודרים לפי סדר כרונולוגי"],"e":"האנציקלופדיה כללה כ-72 אלף ערכים. החידוש היה גם בארגון המידע לפי סדר אלפביתי ובהפניות בין ערכים."},{"id":"m83","t":3,"s":7,"h":1,"q":"איזו טענה על הסלונים נכונה בכל חלקיה?","o":["נערכו בבתיהן של נשים אמידות, והתקיימו בעיקר בחוגים משכילים ומבוססים","נערכו בבתיהן של נשים אמידות, והיו פתוחים לכל הציבור","נערכו בבתי קפה ציבוריים, והתקיימו בעיקר בחוגים משכילים","נערכו בארמון המלך, והוזמנו אליהם רק אנשי דת"],"e":"הסלונים נערכו בבתיהן של נשים אמידות. המפגשים התקיימו בעיקר בחוגים משכילים ומבוססים ולא היו פתוחים לכל הציבור."},{"id":"m84","t":3,"s":9,"q":"מה היה מקצועו של דאלמבר, שערך את האנציקלופדיה יחד עם דידרו?","o":["מתמטיקאי","מלך","איש דת","צייר"],"e":"דידרו ערך את האנציקלופדיה יחד עם המתמטיקאי דאלמבר."},{"id":"m85","t":3,"s":9,"q":"מה היה מוצאו של דניס דידרו?","o":["סופר והוגה דעות צרפתי","פילוסוף גרמני","פילוסוף אנגלי","מלך פרוסיה"],"e":"דניס דידרו היה סופר והוגה דעות צרפתי."},{"id":"m86","t":3,"s":7,"q":"במה דנו האורחים בסלונים?","o":["בספרים, במחזות, במוזיקה ובנושאים שהעסיקו את החברה","רק בענייני מסחר","רק בתפילות","רק בתוכניות מלחמה"],"e":"האורחים בסלונים דנו בספרים, במחזות, במוזיקה ובנושאים שהעסיקו את החברה."},{"id":"m87","t":4,"s":15,"h":1,"q":"מה הן שנות חייו של ג׳ון לוק?","o":["1632–1704","1689–1755","1712–1778","1694–1778"],"e":"ג׳ון לוק חי בשנים 1632–1704. השנים האחרות שייכות למונטסקייה, לרוסו ולוולטר."},{"id":"m88","t":4,"s":17,"h":1,"q":"מה הן שנות חייו של מונטסקייה?","o":["1689–1755","1694–1778","1632–1704","1724–1804"],"e":"מונטסקייה חי בשנים 1689–1755. השנים האחרות שייכות לוולטר, ללוק ולקאנט."},{"id":"m89","t":4,"s":16,"h":1,"q":"בין אילו רשויות הציע ג׳ון לוק להפריד?","o":["המחוקקת והמבצעת","המחוקקת, המבצעת והשופטת","המבצעת והשופטת","המחוקקת והשופטת"],"e":"לוק הציע להפריד בין הרשות המחוקקת לרשות המבצעת. ההפרדה בין שלוש רשויות, כולל השופטת, היא הצעתו של מונטסקייה."},{"id":"m90","t":4,"s":15,"h":1,"q":"מי מההוגים הבאים נולד ראשון?","o":["ג׳ון לוק","מונטסקייה","וולטר","ז׳אן ז׳אק רוסו"],"e":"לפי שנות חייהם: לוק נולד ב-1632, מונטסקייה ב-1689, וולטר ב-1694 ורוסו ב-1712."},{"id":"m91","t":4,"s":18,"h":1,"q":"איזה צירוף נכון בכל חלקיו?","o":["רוסו – נולד בז׳נבה – ריבונות העם","רוסו – נולד בפריז – ריבונות העם","מונטסקייה – נולד בז׳נבה – הפרדת רשויות","לוק – פילוסוף צרפתי – זכויות טבעיות"],"e":"רוסו נולד בז׳נבה וטען שמקור סמכות השלטון הוא העם (ריבונות העם). לוק היה פילוסוף אנגלי."},{"id":"m92","t":4,"s":15,"q":"מה היה מוצאו של ג׳ון לוק?","o":["פילוסוף אנגלי","פילוסוף צרפתי","פילוסוף גרמני","סופר פורטוגלי"],"e":"ג׳ון לוק היה פילוסוף אנגלי."},{"id":"m93","t":4,"s":17,"q":"מה היה מוצאו של מונטסקייה?","o":["הוגה דעות צרפתי","פילוסוף אנגלי","פילוסוף גרמני","מלך פרוסיה"],"e":"מונטסקייה היה הוגה דעות צרפתי."},{"id":"m94","t":4,"s":17,"q":"מרעיונותיו של מי הושפע מונטסקייה?","o":["ג׳ון לוק","עמנואל קאנט","קונדורסה","פרידריך השני"],"e":"מונטסקייה הושפע מרעיונותיו של ג׳ון לוק."},{"id":"m95","t":4,"s":18,"q":"לפי רוסו, מה היה מצבם של בני האדם במצב הטבעי?","o":["הם היו חופשיים","הם היו עבדים","הם היו נתינים של מלך","הם היו כפופים לכנסייה"],"e":"רוסו טען שבמצב הטבעי בני האדם היו חופשיים, אך החיים בחברה מחייבים הסכמה על כללים משותפים."},{"id":"m96","t":4,"s":16,"q":"מה ביקש לוק למנוע כשהציע להגביל את הכוח השלטוני?","o":["עריצות","מסחר","חינוך","מחקר מדעי"],"e":"לוק ביקש להגביל את הכוח השלטוני ולמנוע עריצות."},{"id":"m97","t":5,"s":20,"h":1,"q":"מה ההבדל העיקרי בין שלטון אבסולוטי ל״אבסולוטיזם נאור״?","o":["באבסולוטיזם נאור המלך עדיין מחזיק בסמכויות רבות, אך מנסה לשפר את חיי האזרחים","באבסולוטיזם נאור המלך מעביר את סמכויות השלטון לעם","באבסולוטיזם נאור הסמכויות מחולקות בין שלוש רשויות","באבסולוטיזם נאור המלך שולט בחסד האל ולכן אינו נותן דין וחשבון"],"e":"באבסולוטיזם נאור המלכים המשיכו להחזיק בסמכויות רבות, אך ניסו לשפר את חיי האזרחים באמצעות חינוך, ייעול השלטון וסובלנות דתית. הם לא העבירו את סמכויות השלטון לעם."},{"id":"m98","t":5,"s":14,"h":1,"q":"איזה צירוף נכון בכל חלקיו?","o":["לואי ה-14 – מלך צרפת – ארמון ורסאי","לואי ה-14 – מלך פרוסיה – ארמון ורסאי","פרידריך השני – מלך צרפת – משרתה הראשון של המדינה","פרידריך השני – מלך פרוסיה – ארמון ורסאי"],"e":"לואי ה-14 היה מלך צרפת, וארמון ורסאי סימל את כוחו. פרידריך השני היה מלך פרוסיה והציג את עצמו כ״משרתה הראשון של המדינה״."},{"id":"m99","t":5,"s":20,"q":"על איזו מדינה מלך פרידריך השני?","o":["פרוסיה","צרפת","פורטוגל","אנגליה"],"e":"פרידריך השני היה מלך פרוסיה."},{"id":"m100","t":5,"s":14,"q":"על איזו מדינה מלך לואי ה-14?","o":["צרפת","פרוסיה","ספרד","אנגליה"],"e":"לואי ה-14 היה מלך צרפת."}],"tf":[{"id":"t1","t":1,"s":2,"q":"בין הוגי הנאורות היו סופרים, מדענים ואנשי רוח.","a":true,"e":"נכון. בין הוגי הנאורות היו סופרים, מדענים ואנשי רוח."},{"id":"t2","t":1,"s":2,"q":"הוגי הנאורות פעלו בעיקר באסיה במאה ה-18.","a":false,"e":"התיקון: הוגי הנאורות פעלו באירופה."},{"id":"t3","t":1,"s":2,"q":"פילוסוף הוא אדם שעוסק בשאלות יסוד על האדם, העולם והחברה.","a":true,"e":"נכון. פילוסוף עוסק בשאלות יסוד על האדם, העולם, החברה והדרך שבה יודעים מה נכון."},{"id":"t4","t":1,"s":3,"q":"הוגי הנאורות הסכימו ביניהם על כל הנושאים.","a":false,"e":"התיקון: הם לא הסכימו על הכול, אבל רבים מהם ביקשו לצמצם את התלות בסמכות ולעודד חשיבה עצמאית."},{"id":"t5","t":1,"s":3,"q":"הוגי הנאורות עסקו בדת, במדינה, בחינוך, במדע ובחברה.","a":true,"e":"נכון. אלה התחומים שבהם עסקו הוגי הנאורות."},{"id":"t6","t":1,"s":3,"q":"הוגי הנאורות האמינו שבני האדם אינם מסוגלים להבין את העולם בעזרת השכל.","a":false,"e":"התיקון: הם האמינו שבני האדם מסוגלים להשתמש בשכל ובהיגיון כדי להבין את העולם."},{"id":"t7","t":1,"s":4,"q":"לפי הוגי הנאורות, אדם חושב צריך להיות מוכן לשנות את דעתו.","a":true,"e":"נכון. אדם חושב צריך לשאול שאלות, לבחון הסברים ולהיות מוכן לשנות את דעתו."},{"id":"t8","t":1,"s":4,"q":"הוגי הנאורות טענו שכל מסורת היא שגויה.","a":false,"e":"התיקון: אין פירוש הדבר שכל מסורת שגויה, אלא שגם רעיון עתיק צריך לעמוד בפני ביקורת."},{"id":"t9","t":1,"s":4,"q":"״תבונה״ פירושה שימוש בשכל ובהיגיון.","a":true,"e":"נכון. תבונה היא שימוש בשכל ובהיגיון כדי לבחון טענות ולגבש עמדה."},{"id":"t10","t":1,"s":5,"q":"עמנואל קאנט היה פילוסוף צרפתי.","a":false,"e":"התיקון: עמנואל קאנט היה פילוסוף גרמני (1724–1804)."},{"id":"t11","t":1,"s":5,"q":"קאנט פרסם בשנת 1784 את החיבור ״מהי השכלה?⁠״.","a":true,"e":"נכון. בשנת 1784 פרסם קאנט את החיבור ״מהי השכלה?⁠״."},{"id":"t12","t":1,"s":5,"q":"לפי קאנט, הסיבה העיקרית ל״קטינות״ היא חוסר יכולת שכלית.","a":false,"e":"התיקון: לדברי קאנט, הבעיה אינה בהכרח חוסר יכולת, אלא חוסר החלטה ואומץ."},{"id":"t13","t":1,"s":6,"q":"רעיון הקדמה עסק רק בהמצאות מדעיות ובשיפור הטכנולוגיה.","a":false,"e":"התיקון: לא רק במדע ובטכנולוגיה, אלא גם בחינוך טוב יותר, בחברה צודקת יותר ובשיפור התנהגות בני האדם."},{"id":"t14","t":1,"s":6,"q":"קונדורסה היה אחד מהוגי הדעות שהביעו אמונה בהתפתחות האנושות.","a":true,"e":"נכון. הוגה הדעות קונדורסה הביע אמונה בהתפתחות האנושות."},{"id":"t15","t":1,"s":6,"q":"לפי רעיון הקדמה, העתיד חייב להיות העתק של העבר.","a":false,"e":"התיקון: העתיד אינו חייב להיות העתק של העבר, ובני האדם יכולים להשפיע עליו במעשיהם."},{"id":"t16","t":1,"s":19,"q":"רוסו פרסם את הספר ״אמיל״ בשנת 1762.","a":true,"e":"נכון. בשנת 1762 פרסם רוסו את הספר ״אמיל״."},{"id":"t17","t":1,"s":19,"q":"לפי רוסו, המבוגר צריך לקבוע כל פרט בתהליך הלמידה של הילד.","a":false,"e":"התיקון: לפי רוסו, יש לאפשר לילד לגלות דברים ולחפש תשובות בעזרת שכלו."},{"id":"t18","t":1,"s":19,"q":"רעיונותיו של רוסו בספר ״אמיל״ ערערו על סמכות הכנסייה בתחום החינוך.","a":true,"e":"נכון. רעיונותיו ערערו על תפיסות חינוך מקובלות ועל סמכות הכנסייה בתחום זה."},{"id":"t19","t":2,"s":10,"q":"ביקורת על הכנסייה בתקופת הנאורות פירושה תמיד התנגדות לאמונה באלוהים.","a":false,"e":"התיקון: ביקורת על הכנסייה לא הייתה בהכרח התנגדות לאמונה באלוהים."},{"id":"t20","t":2,"s":10,"q":"חלק מהוגי הנאורות התנגדו במיוחד לכפיית אמונה ולענישה בגלל השתייכות דתית.","a":true,"e":"נכון. חלקם התנגדו במיוחד לכפיית אמונה ולענישה בגלל השתייכות דתית."},{"id":"t21","t":2,"s":10,"q":"לדעת הוגי הנאורות, אדם צריך להשתמש בשכלו ובניסיונו גם בשאלות דתיות.","a":true,"e":"נכון. לדעתם, האדם צריך להשתמש בשכלו ובניסיונו גם כאשר הוא עוסק בשאלות דתיות."},{"id":"t22","t":2,"s":11,"q":"לפי תפיסת ״הדת הטבעית״, אלוהים מתערב בכל אירוע שמתרחש בעולם.","a":false,"e":"התיקון: לפי תפיסה זו, אלוהים ברא את העולם ואת חוקי הטבע, אבל אינו מתערב בכל אירוע."},{"id":"t23","t":2,"s":11,"q":"בעלי תפיסת ״הדת הטבעית״ דימו את האל לשען שבנה שעון.","a":true,"e":"נכון. השעון פועל מעצמו לפי המנגנון שנבנה בו, בלי שהשען יתערב."},{"id":"t24","t":2,"s":11,"q":"לפי תפיסת ״הדת הטבעית״, אי אפשר להאמין באלוהים ובו בזמן לחקור את העולם בתצפיות ובהיגיון.","a":false,"e":"התיקון: הם האמינו שניתן להאמין באלוהים ובו בזמן לחקור את העולם באמצעות תצפיות והיגיון."},{"id":"t25","t":2,"s":12,"q":"וולטר היה סופר והוגה דעות צרפתי.","a":true,"e":"נכון. וולטר היה סופר והוגה דעות צרפתי שחי בשנים 1694–1778."},{"id":"t26","t":2,"s":12,"q":"וולטר תמך בכך שאנשים ייענשו בגלל אמונתם.","a":false,"e":"התיקון: וולטר התנגד לכך שאנשים ייענשו או יאבדו זכויות בגלל אמונתם, וקרא לסובלנות דתית."},{"id":"t27","t":2,"s":12,"q":"וולטר עסק בספרות, במדע ובשאלות חברתיות ומדיניות.","a":true,"e":"נכון. הוא עסק בכל אלה, והתפרסם במיוחד בביקורתו על קנאות דתית."},{"id":"t28","t":2,"s":13,"q":"רעידת האדמה הקשה בליסבון התרחשה בשנת 1755.","a":true,"e":"נכון. בשנת 1755 התרחשה רעידת אדמה קשה בליסבון, ותושבים רבים נהרגו."},{"id":"t29","t":2,"s":13,"q":"וולטר הסכים עם אנשי הדת שטענו שהאסון בליסבון היה עונש על חטאי התושבים.","a":false,"e":"התיקון: וולטר התנגד להסבר הזה ושאל כיצד אפשר להאשים חפים מפשע, למשל ילדים."},{"id":"t30","t":2,"s":13,"q":"העיר ליסבון נמצאת בספרד.","a":false,"e":"התיקון: ליסבון נמצאת בפורטוגל."},{"id":"t31","t":3,"s":7,"q":"הסלונים המפורסמים נערכו בבתיהן של נשים אמידות.","a":true,"e":"נכון. מפורסמים במיוחד היו הסלונים שנערכו בבתיהן של נשים אמידות."},{"id":"t32","t":3,"s":7,"q":"הסלונים ובתי הקפה היו פתוחים לכל הציבור.","a":false,"e":"התיקון: הם התקיימו בעיקר בחוגים משכילים ומבוססים, ולא היו פתוחים לכל הציבור."},{"id":"t33","t":3,"s":7,"q":"בסלונים דנו האורחים בספרים, במחזות, במוזיקה ובנושאים שהעסיקו את החברה.","a":true,"e":"נכון. אלה הנושאים שבהם דנו האורחים בסלונים."},{"id":"t34","t":3,"s":8,"q":"ככל שגדל מספר הקוראים, התרחב גם הדיון הציבורי ברעיונות הנאורות.","a":true,"e":"נכון. ככל שגדל מספר הקוראים, התרחב גם הדיון הציבורי ברעיונותיהם."},{"id":"t35","t":3,"s":8,"q":"בתקופת הנאורות, ״דעת הקהל״ פירושה דעתם של כל תושבי המדינה.","a":false,"e":"התיקון: הכוונה הייתה בעיקר לשיפוט ביקורתי של משכילים, ולא בהכרח לדעות הציבור כולו."},{"id":"t36","t":3,"s":8,"q":"הדפוס והכתיבה אפשרו לרעיונות לעבור בין ערים ומדינות.","a":true,"e":"נכון. הדפוס והכתיבה אפשרו לרעיונות לעבור בין ערים ומדינות."},{"id":"t37","t":3,"s":9,"q":"האנציקלופדיה של דידרו ודאלמבר פורסמה בשנים 1751–1772.","a":true,"e":"נכון. האנציקלופדיה פורסמה בשנים 1751–1772."},{"id":"t38","t":3,"s":9,"q":"האנציקלופדיה כללה כ-72 ערכים בלבד.","a":false,"e":"התיקון: האנציקלופדיה כללה כ-72 אלף ערכים בתחומים רבים."},{"id":"t39","t":3,"s":9,"q":"דניס דידרו ערך את האנציקלופדיה לבדו, בלי שותפים.","a":false,"e":"התיקון: דידרו ערך את האנציקלופדיה יחד עם המתמטיקאי דאלמבר, ורבים השתתפו בכתיבתה."},{"id":"t40","t":4,"s":15,"q":"ג׳ון לוק היה פילוסוף אנגלי.","a":true,"e":"נכון. ג׳ון לוק היה פילוסוף אנגלי שחי בשנים 1632–1704 והשפיע על הוגי הנאורות."},{"id":"t41","t":4,"s":15,"q":"לפי לוק, הזכויות הטבעיות הן מתנה שהמלך מעניק לאזרחים.","a":false,"e":"התיקון: הזכויות הטבעיות אינן מתנה מהמלך. הן מגיעות לכל אדם מעצם היותו אדם, ותפקיד השלטון להגן עליהן."},{"id":"t42","t":4,"s":15,"q":"לפי לוק, לכל אדם יש זכות שלא להיות משועבד לאחרים.","a":true,"e":"נכון. זו משמעותה של הזכות לחירות."},{"id":"t43","t":4,"s":16,"q":"לפי לוק, אסור לאזרחים להתנגד לשלטון בשום מצב.","a":false,"e":"התיקון: כאשר השלטון פוגע בזכויות ומפר את התחייבויותיו, מותר לאזרחים להתנגד לו ואף למרוד בו."},{"id":"t44","t":4,"s":16,"q":"לוק טען שהחלטות צריכות להתקבל ברוב קולות.","a":true,"e":"נכון. לוק טען שהחלטות צריכות להתקבל ברוב קולות."},{"id":"t45","t":4,"s":16,"q":"לוק הציע להפריד בין הרשות המחוקקת לרשות המבצעת.","a":true,"e":"נכון. לוק הציע הפרדה בין שתי רשויות. מונטסקייה הציע אחר כך הפרדה בין שלוש."},{"id":"t46","t":4,"s":17,"q":"מונטסקייה הציע לרכז את כל סמכויות השלטון בידי המלך.","a":false,"e":"התיקון: מונטסקייה הציע להפריד בין שלוש רשויות כדי להגביל את כוחו של המלך."},{"id":"t47","t":4,"s":17,"q":"מונטסקייה הושפע מרעיונותיו של ג׳ון לוק.","a":true,"e":"נכון. מונטסקייה (1689–1755) הושפע מרעיונותיו של ג׳ון לוק."},{"id":"t48","t":4,"s":17,"q":"לפי מונטסקייה, הרשויות צריכות לאזן ולבלום זו את זו.","a":true,"e":"נכון. כל רשות תופקד על תחום אחר, והרשויות יאזנו ויבלמו זו את זו."},{"id":"t49","t":4,"s":18,"q":"לפי רוסו, מקור סמכות השלטון הוא המלך.","a":false,"e":"התיקון: לפי רוסו, מקור סמכות השלטון הוא העם, ולא המלך או האל."},{"id":"t50","t":4,"s":18,"q":"רוסו טען שבמצב הטבעי בני האדם היו חופשיים.","a":true,"e":"נכון. לפי רוסו, במצב הטבעי בני האדם היו חופשיים, אך החיים בחברה מחייבים הסכמה על כללים משותפים."},{"id":"t51","t":4,"s":18,"q":"ז׳אן ז׳אק רוסו נולד בפריז.","a":false,"e":"התיקון: רוסו נולד בז׳נבה."},{"id":"t52","t":4,"s":18,"q":"הרעיון שמקור סמכות השלטון הוא העם נקרא ״ריבונות העם״.","a":true,"e":"נכון. לרעיון של רוסו קוראים ״ריבונות העם״."},{"id":"t53","t":4,"s":21,"q":"הוגי הנאורות הציעו פתרון אחד ויחיד לכל בעיות השלטון.","a":false,"e":"התיקון: הם לא הציעו פתרון אחד. לוק, מונטסקייה ורוסו הציעו דרכים שונות לחשוב על שלטון."},{"id":"t54","t":4,"s":18,"q":"מונטסקייה הוא שהגה את רעיון ״הרצון הכללי״.","a":false,"e":"התיקון: את רעיון ״הרצון הכללי״ הגה רוסו. מונטסקייה הציע את הפרדת הרשויות."},{"id":"t55","t":5,"s":14,"q":"לואי ה-14, מלך צרפת, היה דוגמה בולטת לשלטון אבסולוטי.","a":true,"e":"נכון. לואי ה-14 היה דוגמה בולטת לשלטון אבסולוטי."},{"id":"t56","t":5,"s":14,"q":"בשלטון אבסולוטי המלך יכול לחוקק חוקים, להורות על ביצועם ולשמש כשופט העליון.","a":true,"e":"נכון. בשלטון אבסולוטי סמכויות השלטון מרוכזות בידי המלך."},{"id":"t57","t":5,"s":14,"q":"מלכים אבסולוטיים טענו שהם חייבים לתת דין וחשבון לנתיניהם.","a":false,"e":"התיקון: הם טענו שהם שולטים בחסד האל, ולכן אינם חייבים לתת דין וחשבון לנתיניהם."},{"id":"t58","t":5,"s":20,"q":"רעיונות הנאורות הביאו מיד לסיום השלטון האבסולוטי.","a":false,"e":"התיקון: רעיונות הנאורות לא הביאו מיד לסיום השלטון האבסולוטי. במדינות רבות המלכים המשיכו להחזיק בסמכויות רבות."},{"id":"t59","t":5,"s":20,"q":"פרידריך השני, מלך פרוסיה, העביר את סמכויות השלטון לעם.","a":false,"e":"התיקון: פרידריך השני הציג את עצמו כ״משרתה הראשון של המדינה״, אך לא העביר את סמכויות השלטון לעם."},{"id":"t60","t":5,"s":20,"q":"פרידריך השני היה דוגמה מובהקת לשליט בשיטת ״אבסולוטיזם נאור״.","a":true,"e":"נכון. פרידריך השני, מלך פרוסיה, היה דוגמה מובהקת לשליט כזה."},{"id":"t61","t":1,"s":5,"h":1,"q":"קאנט פרסם את החיבור ״מהי השכלה?⁠״ בשנת 1762.","a":false,"e":"התיקון: קאנט פרסם את החיבור בשנת 1784. בשנת 1762 פרסם רוסו את ״אמיל״."},{"id":"t62","t":1,"s":5,"h":1,"q":"עמנואל קאנט חי בשנים 1724–1804.","a":true,"e":"נכון. קאנט חי בשנים 1724–1804."},{"id":"t63","t":1,"s":5,"h":1,"q":"לפי קאנט, הבעיה של אנשים רבים היא שהם מסרבים לקבל הדרכה מאחרים.","a":false,"e":"התיקון: לפי קאנט, אנשים רבים רגילים לתת לאחרים לחשוב בשבילם."},{"id":"t64","t":1,"s":5,"h":1,"q":"קאנט פרסם את ״מהי השכלה?⁠״ אחרי מותם של וולטר ורוסו.","a":true,"e":"נכון. וולטר ורוסו מתו ב-1778, והחיבור של קאנט פורסם ב-1784."},{"id":"t65","t":1,"s":19,"h":1,"q":"רוסו פרסם את ״אמיל״ אחרי שקאנט פרסם את ״מהי השכלה?⁠״.","a":false,"e":"התיקון: ״אמיל״ פורסם ב-1762, לפני ״מהי השכלה?⁠״ שפורסם ב-1784."},{"id":"t66","t":1,"s":3,"h":1,"q":"הנאורות התפתחה באירופה במאות ה-18 וה-19.","a":false,"e":"התיקון: הנאורות התפתחה באירופה במאות ה-17 וה-18."},{"id":"t67","t":1,"s":5,"q":"עמנואל קאנט היה פילוסוף גרמני.","a":true,"e":"נכון. עמנואל קאנט היה פילוסוף גרמני."},{"id":"t68","t":1,"s":3,"q":"אחד ממרכזי הנאורות היה פריז.","a":true,"e":"נכון. אחד ממרכזי הנאורות היה פריז שבצרפת."},{"id":"t69","t":1,"s":5,"q":"לפי קאנט, הפתרון ל״קטינות״ הוא להעז להשתמש בשכל ולחשוב באופן עצמאי.","a":true,"e":"נכון. זו משמעות הקריאה ״העז לדעת!⁠״."},{"id":"t70","t":1,"s":19,"q":"לפי רוסו, ילדים צריכים ללמוד באמצעות התנסות, סקרנות ושאלות שהם מעלים בעצמם.","a":true,"e":"נכון. זו תפיסת החינוך שהציג רוסו בספר ״אמיל״."},{"id":"t71","t":1,"s":19,"q":"הספר ״אמיל״ התקבל בברכה בפריז והפך לספר לימוד רשמי.","a":false,"e":"התיקון: הספר עורר התנגדות ואף נידון לשרפה בפריז."},{"id":"t72","t":1,"s":4,"q":"הוגי הנאורות טענו שאין להטיל ספק בדעות שבעל סמכות מציג כנכונות.","a":false,"e":"התיקון: הם ביקרו את ההרגל לקבל דעות רק משום שבעל סמכות הציג אותן כנכונות."},{"id":"t73","t":2,"s":12,"h":1,"q":"וולטר חי בשנים 1712–1778.","a":false,"e":"התיקון: וולטר חי בשנים 1694–1778. השנים 1712–1778 הן שנות חייו של רוסו."},{"id":"t74","t":2,"s":13,"h":1,"q":"וולטר פרסם את הפואמה על אסון ליסבון באותה שנה שבה התרחשה רעידת האדמה.","a":false,"e":"התיקון: רעידת האדמה התרחשה ב-1755, והפואמה פורסמה ב-1756."},{"id":"t75","t":2,"s":11,"h":1,"q":"לפי תפיסת ״הדת הטבעית״, אלוהים ברא גם את חוקי הטבע.","a":true,"e":"נכון. לפי תפיסה זו, אלוהים ברא את העולם ואת חוקי הטבע, אבל אינו מתערב בכל אירוע."},{"id":"t76","t":2,"s":12,"h":1,"q":"וולטר ורוסו מתו באותה שנה.","a":true,"e":"נכון. שניהם מתו ב-1778: וולטר חי בשנים 1694–1778, ורוסו בשנים 1712–1778."},{"id":"t77","t":2,"s":13,"q":"העיר ליסבון נמצאת בפורטוגל.","a":true,"e":"נכון. רעידת האדמה של 1755 התרחשה בליסבון שבפורטוגל."},{"id":"t78","t":2,"s":12,"q":"וולטר קרא לאפשר לבני דתות שונות לקיים את אמונתם ללא כפייה ורדיפה.","a":true,"e":"נכון. זו הסובלנות הדתית שוולטר קרא לה."},{"id":"t79","t":2,"s":10,"q":"הוגי הנאורות טענו שהסתמכות על סמכות דתית בלבד מעודדת שאלות וביקורת.","a":false,"e":"התיקון: הם טענו שהסתמכות על סמכות דתית בלבד עלולה למנוע שאלות וביקורת ולעודד אמונות לא מבוססות."},{"id":"t80","t":2,"s":13,"q":"בעקבות אסון ליסבון שאל וולטר כיצד אפשר להאשים חפים מפשע, למשל ילדים.","a":true,"e":"נכון. וולטר התנגד להסבר שהאסון הוא עונש על חטאים."},{"id":"t81","t":3,"s":9,"h":1,"q":"האנציקלופדיה פורסמה בשנים 1751–1772, ודידרו ערך אותה יחד עם המתמטיקאי דאלמבר.","a":true,"e":"נכון. שני חלקי הטענה נכונים."},{"id":"t82","t":3,"s":9,"h":1,"q":"האנציקלופדיה כללה כ-72 אלף ערכים, שסודרו לפי נושאים ולא לפי סדר אלפביתי.","a":false,"e":"התיקון: הערכים סודרו לפי סדר אלפביתי, עם הפניות בין ערכים."},{"id":"t83","t":3,"s":7,"h":1,"q":"הסלונים נערכו בבתיהן של נשים אמידות והיו פתוחים לכל הציבור.","a":false,"e":"התיקון: החלק הראשון נכון, אבל הסלונים התקיימו בעיקר בחוגים משכילים ומבוססים ולא היו פתוחים לכל הציבור."},{"id":"t84","t":3,"s":9,"q":"דניס דידרו היה סופר והוגה דעות צרפתי.","a":true,"e":"נכון. דניס דידרו היה סופר והוגה דעות צרפתי."},{"id":"t85","t":3,"s":9,"q":"דאלמבר, שערך את האנציקלופדיה יחד עם דידרו, היה מתמטיקאי.","a":true,"e":"נכון. דאלמבר היה מתמטיקאי."},{"id":"t86","t":3,"s":8,"q":"הוגי הנאורות הפיצו את רעיונותיהם רק בשיחות בעל פה, ולא בכתב.","a":false,"e":"התיקון: הם הפיצו את רעיונותיהם באמצעות ספרים, עיתונים וכתבי עת."},{"id":"t87","t":4,"s":16,"h":1,"q":"לוק הציע להפריד בין שלוש רשויות: המחוקקת, המבצעת והשופטת.","a":false,"e":"התיקון: לוק הציע להפריד בין הרשות המחוקקת לרשות המבצעת. את ההפרדה לשלוש רשויות הציע מונטסקייה."},{"id":"t88","t":4,"s":17,"h":1,"q":"מונטסקייה חי בשנים 1689–1755.","a":true,"e":"נכון. מונטסקייה חי בשנים 1689–1755."},{"id":"t89","t":4,"s":15,"h":1,"q":"ג׳ון לוק נולד לפני מונטסקייה, וולטר ורוסו.","a":true,"e":"נכון. לוק נולד ב-1632, מונטסקייה ב-1689, וולטר ב-1694 ורוסו ב-1712."},{"id":"t90","t":4,"s":18,"h":1,"q":"לפי רוסו, מקור סמכות השלטון הוא האל, אך השלטון צריך לפעול לפי הרצון הכללי.","a":false,"e":"התיקון: לפי רוסו, מקור סמכות השלטון הוא העם, ולא המלך או האל."},{"id":"t91","t":4,"s":17,"h":1,"q":"מונטסקייה סבר שיש לבטל כל משטר מלוכני.","a":false,"e":"התיקון: מונטסקייה סבר שמשטר מלוכני יכול להיות טוב, אבל חייבים להגביל את כוחו של המלך."},{"id":"t92","t":4,"s":15,"q":"ג׳ון לוק היה פילוסוף צרפתי.","a":false,"e":"התיקון: ג׳ון לוק היה פילוסוף אנגלי."},{"id":"t93","t":4,"s":17,"q":"מונטסקייה היה הוגה דעות צרפתי.","a":true,"e":"נכון. מונטסקייה היה הוגה דעות צרפתי."},{"id":"t94","t":4,"s":18,"q":"רוסו טען שהחיים בחברה מחייבים הסכמה על כללים משותפים.","a":true,"e":"נכון. לפי רוסו, במצב הטבעי בני האדם היו חופשיים, אך החיים בחברה מחייבים הסכמה על כללים משותפים."},{"id":"t95","t":4,"s":15,"q":"לפי לוק, תפקידו של השלטון הוא להגן על הזכויות הטבעיות.","a":true,"e":"נכון. הזכויות אינן מתנה מהמלך, ותפקיד השלטון להגן עליהן."},{"id":"t96","t":4,"s":17,"q":"לפי מונטסקייה, כל רשות צריכה להיות מופקדת על כל תחומי השלטון.","a":false,"e":"התיקון: לפי מונטסקייה, כל רשות תופקד על תחום אחר, והרשויות יאזנו ויבלמו זו את זו."},{"id":"t97","t":5,"s":20,"h":1,"q":"באבסולוטיזם נאור המלך המשיך להחזיק בסמכויות רבות, אך ניסה לשפר את חיי האזרחים, למשל באמצעות סובלנות דתית.","a":true,"e":"נכון. המלכים ה״נאורים״ ניסו לשפר את חיי האזרחים באמצעות חינוך, ייעול השלטון וסובלנות דתית."},{"id":"t98","t":5,"s":20,"h":1,"q":"פרידריך השני, מלך צרפת, הציג את עצמו כ״משרתה הראשון של המדינה״.","a":false,"e":"התיקון: פרידריך השני היה מלך פרוסיה, לא מלך צרפת. מלך צרפת שמוזכר בחומר הוא לואי ה-14."},{"id":"t99","t":5,"s":14,"q":"ארמון ורסאי סימל את קרבתו של המלך לרוב תושבי המדינה.","a":false,"e":"התיקון: ארמון ורסאי סימל את כוחו של המלך ואת המרחק בינו לבין רוב תושבי המדינה."},{"id":"t100","t":5,"s":20,"q":"פרידריך השני היה מלך פרוסיה.","a":true,"e":"נכון. פרידריך השני היה מלך פרוסיה."}],"cloze":[{"id":"c1","t":1,"s":[2,3,4,5],"text":"הנאורות הייתה תנועה של {{הוגי דעות}} שהתפתחה באירופה במאות ה-17 וה-18, ואחד ממרכזיה היה {{פריז}}. בני התקופה כינו את ההוגים {{פילוסופים}}. הם האמינו שבני האדם מסוגלים להשתמש בשכל ובהיגיון – מה שכינו {{תבונה}} – כדי לבחון רעיונות שהיו מקובלים במשך שנים, ורבים מהם ביקשו לצמצם את התלות בבעלי {{סמכות}}. {{עמנואל קאנט}} היה פילוסוף {{גרמני}} שחי בשנים {{1724–1804}}. בשנת {{1784}} פרסם את החיבור ״מהי השכלה?⁠״. לטענתו, אנשים רבים רגילים לתת לאחרים לחשוב בשבילם. מצב שבו אדם אינו משתמש בשכלו בלי הדרכה של מישהו אחר הוא קרא {{קטינות}}. לדבריו, הבעיה אינה בהכרח חוסר יכולת, אלא חוסר החלטה וחוסר {{אומץ}}. לכן קרא לאנשים: ״{{העז לדעת}}!⁠״ – כלומר, להשתמש בשכלם ולחשוב באופן {{עצמאי}}.","d":["וולטר","צרפתי","1762","קדמה","סובלנות","1712–1778","לונדון"]},{"id":"c2","t":1,"s":[6,19],"text":"הוגי הנאורות האמינו שהאנושות יכולה להתקדם לעתיד טוב יותר: לא רק במדע ובטכנולוגיה, אלא גם בחינוך טוב יותר ובחברה {{צודקת}} יותר. לרעיון זה קוראים {{קדמה}}. הוגה הדעות {{קונדורסה}} היה אחד ממי שהביעו אמונה בהתפתחות האנושות. לפי תפיסה זו, העתיד אינו חייב להיות העתק של {{העבר}}, ובני האדם יכולים להשפיע עליו במעשיהם. גם {{רוסו}} חשב שיש לשנות, בתחום החינוך: בשנת {{1762}} פרסם את הספר ״{{אמיל}}״. לדעתו, ילדים צריכים ללמוד באמצעות {{התנסות}}, {{סקרנות}} ושאלות שהם מעלים בעצמם. במקום שאדם {{מבוגר}} יקבע כל פרט בתהליך הלמידה, יש לאפשר לילד לגלות דברים ולחפש תשובות בעזרת {{שכלו}}. הספר ערער על תפיסות חינוך מקובלות ועל סמכות {{הכנסייה}}, ואף נידון לשרפה בעיר {{פריז}}.","d":["קאנט","1784","קטינות","שינון","המלך","לונדון"]},{"id":"c3","t":2,"s":[10,11,12,13],"text":"רבים מהוגי הנאורות ביקרו את השפעת {{הכנסייה}} על חיי האדם ועל דרך חשיבתו, אך ביקורת זו לא הייתה בהכרח כפירה. חלקם האמינו ב״הדת הטבעית״: {{אלוהים}} ברא את העולם ואת חוקי הטבע, אך אינו מתערב בכל אירוע. לפי הדימוי שלהם, האל הוא כמו {{שען}} שבנה שעון. הסופר הצרפתי {{וולטר}} התפרסם בביקורתו על {{קנאות}} דתית. הרעיון שקידם נקרא {{סובלנות דתית}}: לאפשר לבני דתות שונות לקיים את אמונתם ללא כפייה וללא {{רדיפה}}. בשנת {{1755}} התרחשה רעידת אדמה קשה בעיר {{ליסבון}} שבפורטוגל, ותושבים רבים נהרגו. חלק מאנשי הדת טענו שהאסון הוא {{עונש}} על חטאי התושבים. הסופר התנגד להסבר זה ושאל: מה חטאם של {{ילדים}} באסון הנורא? בשנת {{1756}} פרסם {{פואמה}} שבה הציג את ביקורתו.","d":["דידרו","פריז","1784","רוסו","מלך","1762"]},{"id":"c4","t":3,"s":[7,8,9],"text":"במאה ה-18 נפגשו משכילים בבתים פרטיים, במועדונים ובבתי קפה. מפורסמים במיוחד היו {{הסלונים}} שנערכו בבתיהן של {{נשים}} אמידות. המפגשים התקיימו בעיקר בחוגים משכילים ומבוססים, ולא היו פתוחים לכל {{הציבור}}. הוגי הנאורות הפיצו את רעיונותיהם באמצעות ספרים, {{עיתונים}} וכתבי עת. ככל שקהל {{הקוראים}} גדל, התרחב גם הדיון ברעיונות החדשים. רבים החלו לפרסם ביקורת על יצירות, על דעות ועל ענייני החברה, ולביקורת זו קראו {{דעת הקהל}}. {{הדפוס}} והכתיבה אפשרו לרעיונות לעבור בין ערים ומדינות. הסופר הצרפתי {{דניס דידרו}} ערך, יחד עם {{דאלמבר}}, שהיה {{מתמטיקאי}}, אנציקלופדיה גדולה שפורסמה בשנים {{1751–1772}}. היא כללה כ-72 אלף ערכים, והחידוש היה גם בארגון המידע לפי סדר {{אלפביתי}} ובהפניות בין הערכים. מאחר שהפיצה ידע ורעיונות ביקורתיים, עוררה התנגדות מצד {{הכנסייה}} הקתולית.","d":["וולטר","כרונולוגי","המלך","גברים","1755–1778","פילוסוף"]},{"id":"c5","t":4,"s":[15,16,17,18],"text":"{{ג׳ון לוק}} היה פילוסוף {{אנגלי}}. הוא טען שלכל אדם יש {{זכויות טבעיות}}: חיים, {{חירות}} וקניין. זכויות אלו אינן מתנה שהמלך מעניק, ותפקיד השלטון הוא להגן עליהן. לוק גם טען שהחלטות צריכות להתקבל לפי {{רוב}} קולות. {{מונטסקייה}}, הוגה דעות {{צרפתי}} שהושפע מלוק, הציע להפריד בין שלוש רשויות: המחוקקת, {{המבצעת}} והשופטת. הרשויות יאזנו ויבלמו זו את זו, וכך יהיה קשה יותר לרכז את כל הכוח בידי אדם אחד. לרעיון זה קוראים {{הפרדת רשויות}}. {{רוסו}}, שנולד בעיר {{ז׳נבה}}, טען שבמצב הטבעי בני האדם היו {{חופשיים}}. לפי רעיון {{האמנה החברתית}} שלו, כל אדם מקבל על עצמו את {{הרצון הכללי}}, ומקור סמכות השלטון הוא העם ולא המלך או האל. לרעיון זה קוראים {{ריבונות העם}}.","d":["וולטר","סובלנות דתית","קטינות","שוויון","גרמני","פריז"]},{"id":"c6","t":5,"s":[14,20],"text":"במדינות רבות באירופה התקיים שלטון אבסולוטי, שבו סמכויות השלטון מרוכזות בידי {{המלך}}. הוא יכול היה לחוקק {{חוקים}}, להורות על ביצועם ולשמש {{שופט}} עליון. מלכים אלה טענו שהם שולטים בחסד {{האל}}, ולכן אינם חייבים לתת {{דין וחשבון}} לנתיניהם. {{לואי ה-14}}, מלך {{צרפת}}, היה דוגמה בולטת לשלטון כזה, וארמון {{ורסאי}} המפואר סימל את כוחו ואת {{המרחק}} בינו לבין רוב התושבים. רעיונות הנאורות לא הביאו מיד לסיום שלטון כזה. מלכים כמו {{פרידריך השני}}, מלך {{פרוסיה}}, המשיכו להחזיק בסמכויות רבות, אך ניסו לשפר את חיי האזרחים באמצעות {{חינוך}}, ייעול השלטון וסובלנות דתית. לשיטה זו קוראים {{אבסולוטיזם נאור}}. מלך זה הציג את עצמו כ״משרתה הראשון של המדינה״, אך לא העביר את סמכויות השלטון אל {{העם}}.","d":["רוסו","האפיפיור","אנגליה","ריבונות העם","פורטוגל","הקרבה"]}]};

var K_MC = 15, K_TF = 15, K_BL = 10, K_HARD = 3, N_DIST = 4, TOTAL = K_MC + K_TF + K_BL, PTS = 100 / TOTAL;
function fmt(x){ x = Math.round(x * 10) / 10; return Number.isInteger(x) ? String(x) : x.toFixed(1); }
var LETTERS = ['א','ב','ג','ד'];
var LS = {w:'enl.weights.v1', h:'enl.history.v1', m:'enl.mode.v1'};

/* ---------- storage (per-viewer, per-device) ---------- */
var store = {
  get: function(k,d){ try{ var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set: function(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del: function(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
var W = store.get(LS.w, {}) || {};
var HIST = store.get(LS.h, []) || [];
var MODE = store.get(LS.m, 'practice') === 'exam' ? 'exam' : 'practice';
var S = null;
var topicById = {};
BANK.topics.forEach(function(t){ topicById[t.id] = t; });
var app = document.getElementById('app');

function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

/* ---------- adaptive weights (Leitner-style) ----------
   Every item starts at weight 1. A wrong answer sets it to 4; a right answer halves it (floor 1).
   Items are drawn with probability proportional to weight inside their topic. */
function wOf(id){ return W[id] || 1; }
function learn(id, ok){ W[id] = ok ? Math.max(1, wOf(id) / 2) : 4; }
function saveW(){ store.set(LS.w, W); }

function shuffle(a){ a = a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

/* Weighted sampling without replacement (Efraimidis–Spirakis): key = U^(1/w), keep the k largest keys. */
function wSample(items, k){
  return items.map(function(x){ return {x:x, key:Math.pow(Math.random(), 1/wOf(x.id))}; })
    .sort(function(a,b){ return b.key - a.key; }).slice(0,k).map(function(o){ return o.x; });
}

/* Proportional topic quotas. Each topic gets floor(k*w/sum w); the leftover units are assigned by
   systematic sampling (random order, one uniform start, unit steps), which includes topic i with
   probability exactly equal to its fractional part. Hence E[quota_i] = k*w_i/sum(w) for any k. */
function quotas(k){
  var w = BANK.topics.map(function(t){ return t.w; });
  var tot = w.reduce(function(a,b){ return a+b; }, 0);
  var raw = w.map(function(x){ return k*x/tot; });
  var q = raw.map(Math.floor);
  var frac = raw.map(function(r,i){ return r - q[i]; });
  var rem = k - q.reduce(function(a,b){ return a+b; }, 0);
  if(rem > 0){
    var next = Math.random(), c = 0, given = 0;
    shuffle(frac.map(function(_,i){ return i; })).forEach(function(i){
      c += frac[i];
      if(given < rem && next < c - 1e-12){ q[i]++; given++; next += 1; }
    });
    while(given < rem){   /* floating-point safety net; not reached in practice */
      var j = frac.indexOf(Math.max.apply(null, frac)); q[j]++; frac[j] = 0; given++;
    }
  }
  return q;
}

/* Draw k items stratified by topic, exactly kh of them hard ("h":1).
   Topic totals q_i and hard counts h_i are drawn independently (E[q_i] = k*w_i/W, E[h_i] = kh*w_i/W);
   h_i <= q_i always holds for this bank (kh*w_i/W < 1 and q_i >= 1). With hard pools of size w_i
   and regular pools of size 4*w_i, every item has the same exposure probability (0.15 at k=15, kh=3). */
function drawStrat(pool, k, kh){
  var q = quotas(k), h = quotas(kh), out = [];
  BANK.topics.forEach(function(t,i){
    var inT = pool.filter(function(x){ return x.t === t.id; });
    var nh = Math.min(h[i], q[i]);
    out = out.concat(wSample(inT.filter(function(x){ return x.h; }), nh),
                     wSample(inT.filter(function(x){ return !x.h; }), q[i] - nh));
  });
  return shuffle(out);
}

function drawCloze(){
  var p = wSample(BANK.cloze, 1)[0];
  var parts = p.text.split(/\{\{(.+?)\}\}/);   // even index: text, odd index: keyword
  var kwPos = [];
  for(var i=1;i<parts.length;i+=2) kwPos.push(i);
  var chosen = {};
  shuffle(kwPos).slice(0,K_BL).forEach(function(i){ chosen[i] = true; });
  var blanks = [];
  var segs = parts.map(function(s,i){
    if(i % 2 === 1 && chosen[i]){ blanks.push({ans:s, fill:null, done:false}); return {b:blanks.length-1}; }
    return {txt:s};
  });
  var words = shuffle(blanks.map(function(b){ return b.ans; }).concat(shuffle(p.d).slice(0,N_DIST)));
  return {p:p, segs:segs, blanks:blanks, words:words, used:words.map(function(){ return null; }), sel:0, learned:false};
}

function newTest(){
  S = {
    mode: MODE,
    mc: drawStrat(BANK.mc, K_MC, K_HARD).map(function(q){ return {q:q, ord:shuffle([0,1,2,3]), pick:null, done:false}; }),
    tf: drawStrat(BANK.tf, K_TF, K_HARD).map(function(q){ return {q:q, pick:null, done:false}; }),
    cz: drawCloze(),
    submitted:false, result:null
  };
  renderQuiz();
  window.scrollTo(0,0);
}

function answered(){
  if(!S) return 0;
  return S.mc.filter(function(x){ return x.pick !== null; }).length
       + S.tf.filter(function(x){ return x.pick !== null; }).length
       + S.cz.blanks.filter(function(x){ return x.fill !== null; }).length;
}
function correctSoFar(){
  var n = 0;
  S.mc.forEach(function(x){ if(x.done && x.pick === 0) n++; });
  S.tf.forEach(function(x){ if(x.done && x.pick === x.q.a) n++; });
  S.cz.blanks.forEach(function(b){ if(b.done && S.cz.words[b.fill] === b.ans) n++; });
  return n;
}

/* ---------- rendering ---------- */
function fbHTML(ok, none, correctLine, q){
  var t = topicById[q.t];
  var head = ok ? '<p class="verdict ok">תשובה נכונה</p>'
                : '<p class="verdict no">' + (none ? 'לא נענתה. ' : 'תשובה שגויה. ') + esc(correctLine) + '</p>';
  var sl = Array.isArray(q.s) ? q.s.join(', ') : q.s;
  return '<div class="fb">' + head + '<p class="exp">' + esc(q.e) + '</p><p class="src">שקופית ' + sl + ', ' + esc(t.short) + (q.h ? ', שאלת אתגר' : '') + '</p></div>';
}

function mcHTML(it, i){
  var show = S.submitted || it.done;
  var opts = it.ord.map(function(oi,pos){
    var cls = 'opt';
    if(show){ cls += oi === 0 ? ' right' : (it.pick === oi ? ' wrong' : ' dim'); }
    else if(it.pick === oi){ cls += ' sel'; }
    return '<button type="button" class="' + cls + '" data-act="mc" data-i="' + i + '" data-j="' + oi + '"' + (show ? ' disabled' : '') +
           ' aria-pressed="' + (it.pick === oi) + '"><span class="let">' + LETTERS[pos] + '</span><span class="ot">' + esc(it.q.o[oi]) + '</span></button>';
  }).join('');
  var fb = show ? fbHTML(it.pick === 0, it.pick === null, 'התשובה הנכונה: ' + LETTERS[it.ord.indexOf(0)] + '. ' + it.q.o[0], it.q) : '';
  return '<div class="q" id="mc-' + i + '"><div class="qh"><span class="qn">' + (i+1) + '.</span><p class="qt">' + esc(it.q.q) + '</p></div><div class="opts">' + opts + '</div>' + fb + '</div>';
}

function tfHTML(it, i){
  var show = S.submitted || it.done, a = it.q.a;
  function b(v, label){
    var cls = 'opt';
    if(show){ cls += v === a ? ' right' : (it.pick === v ? ' wrong' : ' dim'); }
    else if(it.pick === v){ cls += ' sel'; }
    return '<button type="button" class="' + cls + '" data-act="tf" data-i="' + i + '" data-v="' + (v ? 1 : 0) + '"' + (show ? ' disabled' : '') +
           ' aria-pressed="' + (it.pick === v) + '">' + label + '</button>';
  }
  var fb = show ? fbHTML(it.pick === a, it.pick === null, 'התשובה: ' + (a ? 'נכון' : 'לא נכון') + '.', it.q) : '';
  return '<div class="q" id="tf-' + i + '"><div class="qh"><span class="qn">' + (i+1) + '.</span><p class="qt">' + esc(it.q.q) + '</p></div><div class="tfrow">' +
         b(true,'נכון') + b(false,'לא נכון') + '</div>' + fb + '</div>';
}

function clozeHTML(){
  var c = S.cz, rev = S.submitted;
  var html = '<p class="passage">';
  c.segs.forEach(function(sg){
    if(sg.b === undefined){ html += esc(sg.txt); return; }
    var b = sg.b, bl = c.blanks[b], show = rev || bl.done;
    var filled = bl.fill !== null ? c.words[bl.fill] : null;
    var cls = 'blank', inner;
    if(show){
      var ok = filled === bl.ans;
      cls += ok ? ' right' : ' wrong';
      inner = ok ? esc(bl.ans) : (filled ? '<s>' + esc(filled) + '</s> ' + esc(bl.ans) : esc(bl.ans));
    } else {
      if(c.sel === b) cls += ' active';
      inner = filled ? esc(filled) : '&nbsp;';
    }
    html += '<button type="button" class="' + cls + '" data-act="blank" data-b="' + b + '"' + (show ? ' disabled' : '') +
            ' aria-label="מקום ' + (b+1) + (filled ? ': ' + esc(filled) : ', ריק') + '"><span class="bn">' + (b+1) + '</span><span class="bw">' + inner + '</span></button>';
  });
  html += '</p><p class="banklabel">מחסן מילים</p><div class="bank">';
  html += c.words.map(function(w,i){
    var used = c.used[i] !== null;
    return '<button type="button" class="chip' + (used ? ' used' : '') + '" data-act="word" data-w="' + i + '"' + (used || rev ? ' disabled' : '') + '>' + esc(w) + '</button>';
  }).join('');
  html += '</div>';
  var allDone = rev || c.blanks.every(function(x){ return x.done; });
  if(allDone){
    var right = c.blanks.filter(function(x){ return x.fill !== null && c.words[x.fill] === x.ans; }).length;
    html += '<div class="fb"><p class="verdict ' + (right === K_BL ? 'ok' : 'no') + '">' + right + ' מתוך ' + K_BL + ' מקומות נכונים</p>' +
            '<p class="exp">התשובות: ' + c.blanks.map(function(x,i){ return '(' + (i+1) + ') ' + esc(x.ans); }).join(', ') + '</p>' +
            '<p class="src">הקטע מבוסס על שקופיות ' + c.p.s.join(', ') + ', ' + esc(topicById[c.p.t].short) + '</p></div>';
  }
  return '<div class="q" id="cz">' + html + '</div>';
}

function barsHTML(per){
  return '<div class="bars">' + BANK.topics.map(function(t){
    var v = per[t.id] || [0,0], c = v[0], n = v[1];
    if(!n) return '';
    var pct = Math.round(100*c/n);
    return '<div class="bar"><div class="bl"><span>' + esc(t.short) + '</span><span class="bv">' + c + ' מתוך ' + n + '</span></div>' +
           '<div class="track"><div class="fill" style="width:' + pct + '%"></div></div></div>';
  }).join('') + '</div>';
}
function weakest(per){
  var best = null;
  BANK.topics.forEach(function(t){
    var v = per[t.id] || [0,0];
    if(!v[1]) return;
    var p = v[0]/v[1];
    if(p < 1 && (best === null || p < best.p || (p === best.p && v[1] > best.n))) best = {t:t, p:p, n:v[1]};
  });
  return best ? best.t : null;
}
function tipHTML(per){
  var t = weakest(per);
  return t ? '<p class="tip">כדאי לחזור על <b>' + esc(t.name) + '</b> (שקופיות ' + t.slides.join(', ') + ').</p>' : '';
}

function resultHTML(){
  var r = S.result;
  var verdict = r.score >= 90 ? 'מצוין' : r.score >= 80 ? 'טוב מאוד' : r.score >= 65 ? 'טוב, יש מה לחזק' : 'כדאי לחזור על החומר ולנסות שוב';
  return '<section class="sheet" id="result"><div class="rtop">' +
    '<div class="seal big" role="img" aria-label="ציון ' + fmt(r.score) + ' מתוך 100"><span><span class="sn">' + fmt(r.score) + '</span><span class="ss">מתוך 100</span></span></div>' +
    '<div><h2>' + verdict + '</h2><table class="parts"><tbody>' +
      '<tr><td>חלק א׳, רב-ברירה</td><td>' + r.mc + ' מתוך ' + K_MC + '</td><td>' + fmt(r.mc*PTS) + ' נק׳</td></tr>' +
      '<tr><td>חלק ב׳, השלמה</td><td>' + r.cz + ' מתוך ' + K_BL + '</td><td>' + fmt(r.cz*PTS) + ' נק׳</td></tr>' +
      '<tr><td>חלק ג׳, נכון / לא נכון</td><td>' + r.tf + ' מתוך ' + K_TF + '</td><td>' + fmt(r.tf*PTS) + ' נק׳</td></tr>' +
    '</tbody></table></div></div>' +
    '<h3>לפי נושא</h3>' + barsHTML(r.per) + tipHTML(r.per) +
    '<p class="hint">התשובות וההסברים מופיעים מתחת לכל שאלה.</p>' +
    '<div class="actions"><button type="button" class="btn primary" data-act="new">מבחן חדש</button><button type="button" class="btn ghost" data-act="home">למסך הבית</button></div></section>';
}

function updBar(){
  var t = document.getElementById('progt'), f = document.getElementById('progf'), u = document.getElementById('unans');
  if(!t || !S) return;
  var a = answered();
  if(S.submitted){ t.textContent = 'ציון: ' + fmt(S.result.score) + ' מתוך 100'; }
  else if(S.mode === 'practice'){ t.textContent = 'נענו ' + a + ' מתוך ' + TOTAL + ', נכונות ' + correctSoFar(); }
  else { t.textContent = 'נענו ' + a + ' מתוך ' + TOTAL; }
  f.style.width = (S.submitted ? 100 : Math.round(100*a/TOTAL)) + '%';
  if(u){ var left = TOTAL - a; u.textContent = left > 0 ? 'נשארו ' + left + ' שאלות או מקומות בלי תשובה. אפשר להגיש בכל זאת.' : 'ענית על הכול.'; }
}

function renderQuiz(){
  var ex = S.mode === 'exam';
  app.innerHTML =
    '<div class="topbar"><button type="button" class="btn ghost sm" data-act="home" data-confirm="לחיצה נוספת יוצאת">יציאה</button>' +
      '<div class="prog"><span id="progt"></span><div class="track"><div class="fill" id="progf"></div></div></div><span class="mtag">' + (ex ? 'מבחן' : 'תרגול') + '</span></div>' +
    (S.submitted ? resultHTML() : '') +
    '<section class="sheet"><h2>חלק א׳: שאלות רב-ברירה</h2><p class="inst">בחרו את התשובה הנכונה. ' + fmt(PTS) + ' נקודות לכל שאלה.</p>' + S.mc.map(mcHTML).join('') + '</section>' +
    '<section class="sheet"><h2>חלק ב׳: השלמה ממחסן מילים</h2><p class="inst">השלימו את הקטע במילים מתוך מחסן המילים. שימו לב: במחסן יש מילים מיותרות. ' + fmt(PTS) + ' נקודות לכל מקום. ' +
      'לחצו על מקום ריק ואז על מילה' + (ex ? '; לחיצה על מקום מלא מחזירה את המילה למחסן.' : '.') + '</p>' + clozeHTML() + '</section>' +
    '<section class="sheet"><h2>חלק ג׳: נכון / לא נכון</h2><p class="inst">קבעו אם כל טענה נכונה או לא נכונה. ' + fmt(PTS) + ' נקודות לכל טענה.</p>' + S.tf.map(tfHTML).join('') + '</section>' +
    '<div class="endbar">' + (S.submitted
      ? '<button type="button" class="btn primary wide" data-act="new">מבחן חדש</button>'
      : '<button type="button" class="btn primary wide" data-act="submit">' + (ex ? 'הגשת המבחן' : 'סיום וקבלת ציון') + '</button><p class="hint" id="unans"></p>') + '</div>';
  updBar();
}

function renderHome(){
  S = null;
  var n = HIST.length, stats = '';
  if(n){
    var last = HIST[n-1].score;
    var l5 = HIST.slice(-5);
    var avg = fmt(l5.reduce(function(a,h){ return a + h.score; }, 0) / l5.length);
    var cum = {};
    BANK.topics.forEach(function(t){ cum[t.id] = [0,0]; });
    HIST.forEach(function(h){ BANK.topics.forEach(function(t){ var v = h.per[t.id]; if(v){ cum[t.id][0] += v[0]; cum[t.id][1] += v[1]; } }); });
    stats = '<section class="sheet"><h2>ההתקדמות שלך</h2>' +
      '<p class="inst">' + (n === 1 ? 'הושלם מבחן אחד' : 'הושלמו ' + n + ' מבחנים') + '. ציון אחרון: ' + fmt(last) + '. ממוצע ' + (l5.length > 1 ? l5.length + ' המבחנים האחרונים' : 'המבחן האחרון') + ': ' + avg + '.</p>' +
      '<h3>תשובות נכונות לפי נושא, בכל המבחנים</h3>' + barsHTML(cum) + tipHTML(cum) +
      '<button type="button" class="link" data-act="reset" data-confirm="לחיצה נוספת מוחקת את ההתקדמות">מחיקת ההתקדמות</button></section>';
  }
  app.innerHTML =
    '<header class="hero"><div class="seal" aria-hidden="true"><span>העז<br>לדעת!</span></div>' +
      '<div><h1>מהפכת הנאורות</h1><p class="sub">מבחן תרגול בהיסטוריה לכיתה ח׳. בכל פעם נבנה מבחן חדש מתוך מאגר שאלות על החומר.</p></div></header>' +
    '<section class="sheet"><h2>מבנה המבחן</h2><table class="struct"><tbody>' +
      '<tr><th>חלק א׳</th><td>שאלות רב-ברירה</td><td class="n">' + K_MC + ' שאלות, ' + fmt(K_MC*PTS) + ' נק׳</td></tr>' +
      '<tr><th>חלק ב׳</th><td>השלמה ממחסן מילים</td><td class="n">' + K_BL + ' מקומות, ' + fmt(K_BL*PTS) + ' נק׳</td></tr>' +
      '<tr><th>חלק ג׳</th><td>נכון / לא נכון</td><td class="n">' + K_TF + ' טענות, ' + fmt(K_TF*PTS) + ' נק׳</td></tr>' +
    '</tbody></table>' +
    '<h2 class="mt">איך לתרגל?</h2><div class="modes" role="radiogroup" aria-label="מצב תרגול">' +
      '<button type="button" role="radio" aria-checked="' + (MODE === 'practice') + '" class="mode' + (MODE === 'practice' ? ' on' : '') + '" data-act="mode" data-mode="practice"><b>תרגול</b><span>תשובה והסבר מיד אחרי כל שאלה</span></button>' +
      '<button type="button" role="radio" aria-checked="' + (MODE === 'exam') + '" class="mode' + (MODE === 'exam' ? ' on' : '') + '" data-act="mode" data-mode="exam"><b>מבחן</b><span>ציון והסברים רק בסוף, כמו בכיתה</span></button>' +
    '</div><button type="button" class="btn primary wide" data-act="start">התחלת מבחן</button>' +
    '<p class="hint">בכל מבחן ' + K_HARD + ' שאלות רב-ברירה ו-' + K_HARD + ' טענות הן שאלות אתגר. שאלות שטעית בהן יחזרו בתדירות גבוהה יותר במבחנים הבאים.</p></section>' +
    stats +
    '<p class="foot">מבוסס על המצגת ״מהפכת הנאורות״ (שקופיות 2–21), אחרי בדיקה ותיקון. במאגר ' + BANK.mc.length + ' שאלות רב-ברירה, ' +
      BANK.tf.length + ' טענות נכון / לא נכון ו-' + BANK.cloze.length + ' קטעי השלמה. ההתקדמות נשמרת בדפדפן של המכשיר הזה בלבד.</p>';
}

/* ---------- actions ---------- */
function confirmTap(el){
  if(el.dataset.armed === '1') return true;
  el.dataset.armed = '1';
  var label = el.textContent;
  el.textContent = el.dataset.confirm || 'לחיצה נוספת לאישור';
  setTimeout(function(){ if(el.isConnected && el.dataset.armed === '1'){ el.dataset.armed = '0'; el.textContent = label; } }, 3500);
  return false;
}
function replaceItem(id, html, focusSel){
  var el = document.getElementById(id);
  if(!el) return;
  el.outerHTML = html;
  if(focusSel){ var f = document.querySelector('#' + id + ' ' + focusSel); if(f && !f.disabled) f.focus({preventScroll:true}); }
}

function onMC(i, j){
  var it = S.mc[i];
  if(S.submitted || it.done) return;
  it.pick = j;
  if(S.mode === 'practice'){ it.done = true; learn(it.q.id, j === 0); saveW(); }
  replaceItem('mc-' + i, mcHTML(it, i), '[data-j="' + j + '"]');
  updBar();
}
function onTF(i, v){
  var it = S.tf[i];
  if(S.submitted || it.done) return;
  it.pick = v;
  if(S.mode === 'practice'){ it.done = true; learn(it.q.id, v === it.q.a); saveW(); }
  replaceItem('tf-' + i, tfHTML(it, i), '[data-v="' + (v ? 1 : 0) + '"]');
  updBar();
}
function nextEmpty(c){ return c.blanks.findIndex(function(x){ return x.fill === null && !x.done; }); }
function onBlank(b){
  var c = S.cz, bl = c.blanks[b];
  if(S.submitted || bl.done) return;
  if(bl.fill !== null){ c.used[bl.fill] = null; bl.fill = null; }
  c.sel = b;
  replaceItem('cz', clozeHTML(), '[data-b="' + b + '"]');
  updBar();
}
function onWord(w){
  var c = S.cz;
  if(S.submitted || c.used[w] !== null) return;
  var b = c.sel;
  if(b === null || b === undefined || c.blanks[b].fill !== null || c.blanks[b].done) b = nextEmpty(c);
  if(b < 0) return;
  var bl = c.blanks[b];
  bl.fill = w; c.used[w] = b;
  if(S.mode === 'practice'){
    bl.done = true;
    if(c.words[w] !== bl.ans){   // reveal: the right word is now spent
      var k = c.words.findIndex(function(x,i){ return x === bl.ans && c.used[i] === null; });
      if(k >= 0) c.used[k] = 'x';
    }
  }
  var nx = nextEmpty(c);
  c.sel = nx >= 0 ? nx : null;
  if(S.mode === 'practice' && nx < 0 && !c.learned){
    c.learned = true;
    learn(c.p.id, c.blanks.every(function(x){ return c.words[x.fill] === x.ans; }));
    saveW();
  }
  replaceItem('cz', clozeHTML(), nx >= 0 ? '[data-b="' + nx + '"]' : null);
  updBar();
}

function submit(){
  if(!S || S.submitted) return;
  S.submitted = true;
  var per = {}, mc = 0, tf = 0, cz = 0;
  BANK.topics.forEach(function(t){ per[t.id] = [0,0]; });
  S.mc.forEach(function(it){ var ok = it.pick === 0; if(ok) mc++; per[it.q.t][0] += ok ? 1 : 0; per[it.q.t][1]++; if(!it.done) learn(it.q.id, ok); it.done = true; });
  S.tf.forEach(function(it){ var ok = it.pick === it.q.a; if(ok) tf++; per[it.q.t][0] += ok ? 1 : 0; per[it.q.t][1]++; if(!it.done) learn(it.q.id, ok); it.done = true; });
  var c = S.cz;
  c.blanks.forEach(function(bl){ var ok = bl.fill !== null && c.words[bl.fill] === bl.ans; if(ok) cz++; per[c.p.t][0] += ok ? 1 : 0; per[c.p.t][1]++; });
  if(!c.learned){ c.learned = true; learn(c.p.id, cz === K_BL); }
  saveW();
  var score = Math.round(PTS * (mc + tf + cz) * 10) / 10;
  S.result = {score:score, mc:mc, tf:tf, cz:cz, per:per};
  HIST.push({ts:Date.now(), mode:S.mode, score:score, per:per});
  if(HIST.length > 60) HIST = HIST.slice(-60);
  store.set(LS.h, HIST);
  renderQuiz();
  window.scrollTo(0,0);
}

app.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]');
  if(!el || el.disabled) return;
  var a = el.dataset.act;
  if(a === 'mode'){ MODE = el.dataset.mode === 'exam' ? 'exam' : 'practice'; store.set(LS.m, MODE); renderHome(); var m = app.querySelector('[data-mode="' + MODE + '"]'); if(m) m.focus({preventScroll:true}); }
  else if(a === 'start' || a === 'new'){ newTest(); }
  else if(a === 'home'){ if(S && !S.submitted && answered() > 0 && !confirmTap(el)) return; renderHome(); window.scrollTo(0,0); }
  else if(a === 'mc'){ onMC(+el.dataset.i, +el.dataset.j); }
  else if(a === 'tf'){ onTF(+el.dataset.i, el.dataset.v === '1'); }
  else if(a === 'blank'){ onBlank(+el.dataset.b); }
  else if(a === 'word'){ onWord(+el.dataset.w); }
  else if(a === 'submit'){ submit(); }
  else if(a === 'reset'){ if(!confirmTap(el)) return; W = {}; HIST = []; store.del(LS.w); store.del(LS.h); renderHome(); }
});

/* hooks for automated testing only; no effect on the page */
window.enlDebug = {quotas:quotas, drawStrat:drawStrat, drawCloze:drawCloze, wSample:wSample, BANK:BANK, state:function(){ return S; }};

renderHome();
})();
</script>
