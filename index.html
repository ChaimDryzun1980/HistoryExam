<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מהפכת הנאורות – מבחן תרגול</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E9E8E1; --sheet:#FAF9F4; --sheet-2:#F0EEE6; --ink:#1C2B4A; --ink-2:#4A556C; --rule:#D3D0C4;
  --wax:#8A1C2C; --wax-ink:#FBF3EF; --verd:#2F6650; --verd-bg:#E2EEE7; --err:#A3262E; --err-bg:#F6E3E1; --sel:#DCE3F0;
  --serif:"Frank Ruhl Libre","David","Times New Roman",serif;
  --sans:"Assistant","Segoe UI","Arial Hebrew",Arial,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121620; --sheet:#1A1F2B; --sheet-2:#222837; --ink:#E6E2D6; --ink-2:#A8AEBB; --rule:#333B4C;
    --wax:#B23B4E; --wax-ink:#FFF5F2; --verd:#79C29B; --verd-bg:#1C3027; --err:#EE8B88; --err-bg:#3A2226; --sel:#26314A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121620; --sheet:#1A1F2B; --sheet-2:#222837; --ink:#E6E2D6; --ink-2:#A8AEBB; --rule:#333B4C;
  --wax:#B23B4E; --wax-ink:#FFF5F2; --verd:#79C29B; --verd-bg:#1C3027; --err:#EE8B88; --err-bg:#3A2226; --sel:#26314A;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.65 var(--sans)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
.wrap{max-width:740px;margin:0 auto;padding:0 14px 40px}
h1,h2,h3{font-family:var(--serif);color:var(--ink);margin:0}
h2{font-size:1.32rem;font-weight:700;line-height:1.3}
h3{font-size:1.1rem;font-weight:700;margin-top:18px}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--wax);outline-offset:2px}

/* hero */
.hero{display:flex;align-items:center;gap:20px;padding:30px 4px 10px}
.hero h1{font-size:clamp(2.3rem,9vw,3.5rem);font-weight:900;line-height:1.02;letter-spacing:-.01em}
.hero .sub{margin-top:8px;color:var(--ink-2);max-width:34em}
.seal{flex:none;width:100px;height:100px;border-radius:50%;display:grid;place-items:center;text-align:center;
  color:var(--wax-ink);font-family:var(--serif);font-weight:900;font-size:1.12rem;line-height:1.08;
  background-color:var(--wax);
  background-image:radial-gradient(circle at 34% 30%, color-mix(in srgb,var(--wax) 65%,#fff) 0, var(--wax) 46%, color-mix(in srgb,var(--wax) 70%,#000) 100%);
  box-shadow:inset 0 0 0 5px color-mix(in srgb,var(--wax) 82%,#000), inset 0 0 0 7px color-mix(in srgb,var(--wax) 62%,#fff), 0 3px 8px rgba(0,0,0,.22);
  transform:rotate(-9deg)}
.seal.big{width:132px;height:132px;transform:rotate(-6deg);animation:stamp .45s cubic-bezier(.2,.8,.3,1.25) both}
.seal .sn{display:block;font-size:2.7rem;line-height:1}
.seal .ss{display:block;font-family:var(--sans);font-weight:600;font-size:.8rem;margin-top:2px}
@keyframes stamp{from{transform:scale(1.4) rotate(-16deg);opacity:0}to{transform:scale(1) rotate(-6deg);opacity:1}}

/* sheets */
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:20px 18px;margin:16px 0;
  box-shadow:0 1px 0 var(--rule),0 10px 22px -16px rgba(28,43,74,.45)}
.inst{color:var(--ink-2);margin-top:6px;font-size:.95rem}
.mt{margin-top:22px}
.hint{color:var(--ink-2);font-size:.9rem;margin-top:10px}
.struct{width:100%;border-collapse:collapse;margin-top:8px}
.struct th,.struct td{padding:9px 4px;border-bottom:1px solid var(--rule);text-align:start;vertical-align:baseline}
.struct th{font-family:var(--serif);font-weight:700;white-space:nowrap;padding-inline-end:12px}
.struct td.n{color:var(--ink-2);white-space:nowrap;font-size:.95rem}
.struct tr:last-child th,.struct tr:last-child td{border-bottom:0}

/* modes */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 16px}
.mode{display:flex;flex-direction:column;gap:2px;text-align:start;padding:12px 14px;border:1.5px solid var(--rule);border-radius:10px;background:transparent;cursor:pointer}
.mode b{font-family:var(--serif);font-size:1.15rem}
.mode span{font-size:.88rem;color:var(--ink-2);line-height:1.4}
.mode.on{border-color:var(--ink);background:var(--sel)}
@media (max-width:380px){.modes{grid-template-columns:1fr}}

/* buttons */
.btn{appearance:none;border:0;border-radius:10px;padding:13px 20px;font-weight:700;min-height:48px;cursor:pointer}
.btn.primary{background:var(--wax);color:var(--wax-ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--rule)}
.btn.sm{padding:6px 14px;min-height:40px;font-size:.92rem}
.btn.wide{width:100%}
.link{background:none;border:0;color:var(--ink-2);text-decoration:underline;cursor:pointer;padding:10px 0;font-size:.92rem}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.actions .btn{flex:1 1 160px}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--rule)}
.prog{flex:1;min-width:0;font-size:.9rem;color:var(--ink-2)}
.track{height:6px;background:var(--rule);border-radius:3px;overflow:hidden;margin-top:4px}
.fill{height:100%;background:var(--ink);transition:width .25s ease}
.mtag{font-size:.85rem;color:var(--ink-2);border:1px solid var(--rule);border-radius:999px;padding:2px 10px;white-space:nowrap}

/* questions */
.q{padding:16px 0}
.q + .q{border-top:1px solid var(--rule)}
.qh{display:flex;gap:8px;align-items:baseline}
.qn{font-family:var(--serif);font-weight:700;color:var(--ink-2);min-width:1.6em}
.qt{font-family:var(--serif);font-weight:500;font-size:1.12rem;line-height:1.7}
.opts{margin-top:6px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:start;margin:8px 0 0;padding:11px 12px;border:1.5px solid var(--rule);border-radius:10px;background:transparent;cursor:pointer;min-height:48px;line-height:1.5}
.opt .let{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--ink-2);display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:.95rem;line-height:1}
.opt .ot{padding-top:2px}
.opt.sel{border-color:var(--ink);background:var(--sel)}
.opt.sel .let{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.opt.right{border-color:var(--verd);background:var(--verd-bg)}
.opt.right .let{background:var(--verd);border-color:var(--verd);color:var(--sheet)}
.opt.wrong{border-color:var(--err);background:var(--err-bg)}
.opt.wrong .let{background:var(--err);border-color:var(--err);color:var(--sheet)}
.opt.dim{opacity:.55}
.opt:disabled{cursor:default;color:var(--ink)}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.tfrow .opt{justify-content:center;font-weight:700;margin-top:4px}

/* feedback */
.fb{margin-top:12px;padding:10px 14px;border-inline-start:4px solid var(--ink-2);background:var(--sheet-2);border-radius:8px}
.verdict{font-weight:700}
.verdict.ok{color:var(--verd)}
.verdict.no{color:var(--err)}
.exp{margin-top:4px}
.src{margin-top:4px;font-size:.85rem;color:var(--ink-2)}

/* cloze */
.passage{font-family:var(--serif);font-size:1.12rem;line-height:2.45;margin-top:12px}
.blank{display:inline-flex;align-items:baseline;gap:6px;min-width:5.6em;justify-content:center;padding:0 10px;margin:0 2px;border:0;border-bottom:2px solid var(--ink);
  background:var(--sheet-2);font-family:var(--serif);font-weight:700;border-radius:6px 6px 0 0;cursor:pointer;line-height:1.75;vertical-align:baseline}
.blank .bn{font-family:var(--sans);font-size:.72rem;color:var(--ink-2)}
.blank.active{background:var(--sel);box-shadow:inset 0 -3px 0 var(--wax)}
.blank.right{border-bottom-color:var(--verd);background:var(--verd-bg);cursor:default}
.blank.wrong{border-bottom-color:var(--err);background:var(--err-bg);cursor:default}
.blank s{font-weight:400;opacity:.75}
.banklabel{font-weight:700;margin:16px 0 8px}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--ink);background:var(--sheet);border-radius:999px;padding:8px 16px;font-weight:600;min-height:44px;cursor:pointer}
.chip.used{opacity:.35;text-decoration:line-through;border-style:dashed;cursor:default}
.chip:disabled{color:var(--ink)}

/* results & stats */
.rtop{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.rtop h2{font-size:1.5rem}
.parts{border-collapse:collapse;margin-top:8px;font-size:.95rem}
.parts td{padding:3px 0 3px 14px}
.parts td:last-child{font-weight:700}
.bar{margin:10px 0}
.bl{display:flex;justify-content:space-between;gap:10px;font-size:.95rem}
.bv{color:var(--ink-2);white-space:nowrap}
.bars .fill{background:var(--verd)}
.tip{margin-top:14px;padding:10px 14px;background:var(--sheet-2);border-radius:8px}
.endbar{margin:20px 0}
.foot{font-size:.85rem;color:var(--ink-2);margin:26px 4px 0;line-height:1.6}

@media (max-width:420px){
  .hero{gap:14px}
  .seal:not(.big){width:82px;height:82px;font-size:.98rem}
  .sheet{padding:18px 14px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
